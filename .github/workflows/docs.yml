# SPDX-License-Identifier: Apache-2.0
# Build posix-next Sphinx documentation and deploy to GitHub Pages.

name: Documentation

on:
  push:
    branches:
      - main
      - v*-branch
    tags:
      - v*
  pull_request:
    branches:
      - main
      - v*-branch
  # Redeploy with fresh badge data when a metrics producer finishes on main.
  workflow_run:
    workflows: [Twister, Coverage, ASAN, UBSAN, Scan-Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Serialize docs runs per ref. Never cancel main runs mid-flight: a dying
# deploy job's cleanup cancels its Pages deployment by SHA, and since
# deployments are keyed by SHA it can kill the successor run's deployment of
# the same commit. PR runs never deploy and may cancel freely.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------
  doc-build:
    name: Build HTML documentation
    # A failed nightly must still redeploy (failure badges are the point);
    # only cancelled/skipped producer runs carry no new data.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout posix-next
        uses: actions/checkout@v4
        with:
          path: modules/lib/posix

      - name: Fetch latest metrics artifacts
        # Badge data comes from the newest completed run of each producer
        # workflow on main that still has the artifact (a run whose tests
        # failed still summarizes; a cancelled one does not). Anything
        # missing degrades to absent badges.
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: modules/lib/posix
        run: |
          set -u
          fetch() {
            local wf="$1" artifact="$2" id
            for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" \
                --branch main --status completed --limit 10 \
                --json databaseId --jq '.[].databaseId'); do
              if gh run download -R "$GITHUB_REPOSITORY" "$id" \
                  --name "$artifact" --dir doc/metrics; then
                echo "$wf: fetched $artifact from run $id"
                return 0
              fi
            done
            echo "$wf: no $artifact artifact found; badges will be absent"
          }
          fetch Twister twister-summary
          fetch Coverage coverage-json-snapshot
          fetch ASAN asan-summary
          fetch UBSAN ubsan-summary
          fetch Scan-Build static-analysis-summary
          ls -l doc/metrics

      # Docs build against the same Zephyr revision the manifest pins, without
      # a full west workspace; deriving the ref from west.yml keeps this from
      # drifting when the pin is bumped.
      - name: Read Zephyr revision from west.yml
        id: zephyr-rev
        working-directory: modules/lib/posix
        run: |
          rev=$(yq '.manifest.projects[] | select(.name == "zephyr") | .revision' west.yml)
          test -n "$rev" && test "$rev" != "null"
          echo "rev=${rev}" >> "$GITHUB_OUTPUT"
          echo "Zephyr revision: ${rev}"

      - name: Checkout Zephyr
        uses: actions/checkout@v4
        with:
          repository: zephyrproject-rtos/zephyr
          ref: ${{ steps.zephyr-rev.outputs.rev }}
          path: zephyr

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: zephyr/doc/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r zephyr/scripts/requirements-base.txt
          python3 -c "
          import re, pathlib
          txt = pathlib.Path('zephyr/doc/requirements.txt').read_text()
          txt = txt.replace('\x5c\n', ' ')
          txt = re.sub(r'\s*--hash[= ]\S+', '', txt)
          pathlib.Path('/tmp/doc-reqs.txt').write_text(txt)
          "
          pip install -r /tmp/doc-reqs.txt

      - name: Apply the posix-next patch series to Zephyr
        # The Kconfig database documents the tree this module actually builds
        # against (CONFIG_SYS_*, process support, ...), so the docs build
        # needs the patch series applied to the bare Zephyr checkout.
        run: |
          python3 - <<'EOF'
          import pathlib
          import subprocess

          import yaml

          module = pathlib.Path("modules/lib/posix/zephyr")
          patches = yaml.safe_load((module / "patches.yml").read_text())["patches"]
          for patch in patches:
              if patch.get("module", "zephyr") != "zephyr":
                  continue  # only the Zephyr tree is checked out here
              path = (module / "patches" / patch["path"]).resolve()
              subprocess.run(["git", "apply", str(path)], cwd="zephyr", check=True)
              print(f"applied {patch['path']}")
          EOF

      - name: Install Doxygen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Build HTML
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
          SPHINXOPTS_EXTRA: "-q -t publish"
          DOCS_HTML_BASEURL: "https://cfriedt.github.io/posix-next/"
        run: |
          make -C modules/lib/posix/doc html \
            SPHINXOPTS="-j auto -T -W --keep-going"

      - name: Upload Pages artifact
        # Only upload on push to main/tags (not PRs); use artifact for deploy job
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: modules/lib/posix/doc/_build/html

      - name: Upload PR preview artifact
        # On PRs, upload as a plain artifact for manual inspection
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: html-preview-pr${{ github.event.pull_request.number }}
          path: modules/lib/posix/doc/_build/html
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Deploy (push to main / tags only)
  # ---------------------------------------------------------------------------
  doc-deploy:
    name: Deploy to GitHub Pages
    needs: doc-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}

    steps:
      # Back-to-back runs (force-push after a push, staggered workflow_run
      # redeploys) race the Pages backend: the previous run's deployment can
      # still be in progress and the create request is rejected. Give it
      # time to settle and try once more before failing the run.
      - name: Deploy Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait for in-flight deployment to settle
        if: steps.deploy.outcome == 'failure'
        run: sleep 120

      - name: Deploy Pages (retry)
        if: steps.deploy.outcome == 'failure'
        id: deploy-retry
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # Status check (always reported — required for branch protection)
  # ---------------------------------------------------------------------------
  doc-status:
    name: Documentation Status
    if: always()
    needs: [doc-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Check build result
        # 'skipped' is a clean outcome: a cancelled producer run has no new data
        run: |
          result="${{ needs.doc-build.result }}"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "Documentation build failed"
            exit 1
          fi
          echo "Documentation build result: $result"
