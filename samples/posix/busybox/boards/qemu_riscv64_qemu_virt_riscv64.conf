# the image outgrows the 8 MiB default kernel virtual region, and its kernel
# mappings plus every process's domain tables outgrow the page-table pool
CONFIG_KERNEL_VM_SIZE=0x2000000
CONFIG_MAX_XLAT_TABLES=64

# busybox ping6 gives up before the loopback reply when idle time warps
# under icount; the M-mode variant this sample grew up on has icount off
CONFIG_QEMU_ICOUNT=n
