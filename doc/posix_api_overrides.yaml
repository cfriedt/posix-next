#
# Per-function implementation-status overrides for the Option Group badges.
#
# scripts/doc/posix_metrics.py normally derives status from the curated
# csv-tables in doc/posix/option_groups/ ("yes" in the Supported column)
# minus statically detected ENOSYS stubs in lib/posix/**. Entries here win
# over both and exist for cases static analysis cannot see.
#
# status values:
#   implemented - counts as implemented (overrides stub detection)
#   external    - implemented outside this repo (toolchain libc, Zephyr
#                 core, or a macro); counts as implemented
#   stub        - counts as not implemented (overrides table "yes")
#   unsupported - counts as not implemented
functions:
  # ISO C hosted-environment functions provided by the toolchain libc
  # (newlib/picolibc) or Zephyr's minimal libc.
  _Exit: {status: external, note: toolchain libc}
  _exit: {status: external, note: toolchain libc}
  abort: {status: external, note: toolchain libc}
  assert: {status: external, note: toolchain libc}
  atexit: {status: external, note: toolchain libc}
  clearerr: {status: external, note: toolchain libc}
  exit: {status: external, note: toolchain libc}
  fclose: {status: external, note: toolchain libc}
  feof: {status: external, note: toolchain libc}
  ferror: {status: external, note: toolchain libc}
  fflush: {status: external, note: toolchain libc}
  fgetc: {status: external, note: toolchain libc}
  fgetpos: {status: external, note: toolchain libc}
  fgets: {status: external, note: toolchain libc}
  fnmatch: {status: external, note: toolchain libc}
  fopen: {status: external, note: toolchain libc}
  fprintf: {status: external, note: toolchain libc}
  fputc: {status: external, note: toolchain libc}
  fputs: {status: external, note: toolchain libc}
  fread: {status: external, note: toolchain libc}
  freopen: {status: external, note: toolchain libc}
  fscanf: {status: external, note: toolchain libc}
  fseek: {status: external, note: toolchain libc}
  fsetpos: {status: external, note: toolchain libc}
  ftell: {status: external, note: toolchain libc}
  fwrite: {status: external, note: toolchain libc}
  getc: {status: external, note: toolchain libc}
  getchar: {status: external, note: toolchain libc}
  gets: {status: external, note: toolchain libc}
  longjmp: {status: external, note: toolchain libc}
  printf: {status: external, note: toolchain libc}
  putc: {status: external, note: toolchain libc}
  putchar: {status: external, note: toolchain libc}
  puts: {status: external, note: toolchain libc}
  raise: {status: external, note: toolchain libc}
  remove: {status: external, note: toolchain libc}
  rewind: {status: external, note: toolchain libc}
  scanf: {status: external, note: toolchain libc}
  setbuf: {status: external, note: toolchain libc}
  tmpfile: {status: external, note: common libc}
  tmpnam: {status: external, note: common libc}
  setjmp: {status: external, note: toolchain libc}
  setvbuf: {status: external, note: toolchain libc}
  signal: {status: external, note: toolchain libc}
  ungetc: {status: external, note: toolchain libc}
  vfprintf: {status: external, note: toolchain libc}
  vfscanf: {status: external, note: toolchain libc}
  vprintf: {status: external, note: toolchain libc}
  vscanf: {status: external, note: toolchain libc}

  # ISO C symbols (objects/macros) provided by the toolchain libc.
  errno: {status: external, note: toolchain libc}
  stderr: {status: external, note: toolchain libc}
  stdin: {status: external, note: toolchain libc}
  stdout: {status: external, note: toolchain libc}

  # POSIX symbols (objects) provided by the toolchain libc or Zephyr.
  environ: {status: external, note: zephyr posix env}
  optarg: {status: external, note: getopt in zephyr lib}
  opterr: {status: external, note: getopt in zephyr lib}
  optind: {status: external, note: getopt in zephyr lib}
  optopt: {status: external, note: getopt in zephyr lib}

  # Provided as macros or by Zephyr networking headers.
  htonl: {status: external, note: zephyr net byteorder}
  htons: {status: external, note: zephyr net byteorder}
  ntohl: {status: external, note: zephyr net byteorder}
  ntohs: {status: external, note: zephyr net byteorder}
  pthread_cleanup_pop: {status: external, note: macro in pthread.h}
  pthread_cleanup_push: {status: external, note: macro in pthread.h}
