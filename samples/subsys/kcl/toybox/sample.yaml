sample:
  description: run toybox, built for Linux with the host's compiler, with an interactive shell
  name: kcl linux toybox
common:
  tags:
    - kcl
    - posix
  # the guest is a Linux program for the target: the host's own compiler, or a
  # Linux cross toolchain with a static-PIE C library (see the README)
  platform_allow:
    - qemu_x86_64
    - qemu_cortex_a53
    - qemu_riscv64
  integration_platforms:
    - qemu_x86_64
  harness: console
  timeout: 420
tests:
  sample.kcl.toybox:
    # the interactive shell: its prompt has no newline, so a line is printed after it
    extra_configs:
      - CONFIG_KCL_LINUX_TOYBOX_PROMPT_LINE=y
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "running sh interactively"
        - "^\\$ toybox shell is up"
  sample.kcl.toybox.demo:
    # the tour in /root/demo.sh: commands, pipelines, files, links, FIFOs, a
    # signal-ended child and loopback pings, then the interactive shell
    extra_configs:
      - CONFIG_KCL_LINUX_TOYBOX_COMMAND="sh /root/demo.sh"
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "running sh -c"
        - "^jello, world!"
        - "^Linux zephyr .* Toybox"
        - "^zephyr$"
        - "^0$"
        - "^0$"
        - "^foo.txt$"
        - "^/tmp$"
        - "^/bin/toybox: ELF"
        - "^/: directory"
        - "^/tmp/foo.txt: ASCII text"
        - "tmp\\."
        - "^jello, world!"
        - "foo -> /tmp/foo.txt"
        - "^/tmp/foo.txt$"
        - "^/tmp/foo$"
        - "^/tmp/foo.txt$"
        - "^prw.* /tmp/fifo"
        - "^through the fifo"
        - "^prw.* /tmp/pipe"
        - "^1$"
        - "^2$"
        - "^[0-9]+$"
        - "3 packets transmitted, 3 received"
        - "64 bytes from ::1"
        - "3 packets transmitted, 3 received"
        - "^signal status 143"
        - "^demo complete"
