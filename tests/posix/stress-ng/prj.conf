CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=32768

CONFIG_STRESS_NG=y

CONFIG_HEAP_MEM_POOL_SIZE=4194304
# the stressors malloc() freely; this is the libc arena, not the kernel heap
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=2097152

# temporary files on a tmpfs at /tmp (CONFIG_STRESS_NG_TEMP_PATH)
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_TMPFS=y
# many stressors map and open freely
CONFIG_ZVFS_MMAP_MAX=128
CONFIG_ZVFS_OPEN_MAX=64
# stressors install handlers for many signals
CONFIG_SIGNAL_ACTION_DB_SIZE=64
CONFIG_MAIN_STACK_SIZE=16384
# a random source for the net stack and getentropy() on boards without entropy hardware
CONFIG_TEST_RANDOM_GENERATOR=y
# default pthread stacks: stressor threads carry PATH_MAX buffers
CONFIG_SYS_THREAD_STACK_SIZE=16384
# stress-ng keeps its lock table in pthread spin locks on ARM
CONFIG_MAX_PTHREAD_SPINLOCK_COUNT=64
# stress-ng names files with a 64-bit random suffix
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=64
# and nests them under a per-instance temp dir
CONFIG_ZVFS_PATH_MAX=256
CONFIG_PICOLIBC_IO_FLOAT=y
