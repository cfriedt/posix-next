  - path: zephyr/deprecate-config-posix-api.patch
    sha256sum: afab1145fde704f6e4dcec5dbc6e8e2fd92c2034b898a3bf385b1fcc0ca7abcf
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-23
    upstreamable: true
    merge-pr: https://github.com/zephyrproject-rtos/zephyr/pull/120028
    comments: |
      Part of zephyr#120028 (rebased onto v4.5.0-rc2), replacing the v4.3.0/v4.4.1-era
      deprecate-config-posix-api and do-not-define-_POSIX_C_SOURCE patches.
      posix: deprecate CONFIG_POSIX_API
      CONFIG_POSIX_API predates POSIX subprofiling and enables an ad-hoc,
      ever-growing set of Option Groups. Mark it deprecated and convert the
      in-tree users to a subprofile (CONFIG_POSIX_AEP_CHOICE_*) plus the
      Option Groups they actually use, following the conversion used in the
      posix-next module. Networked samples and tests use the NETAPP
      subprofile.

      Gate the file and file-system function declarations in
      <zephyr/posix/unistd.h> on _POSIX_C_SOURCE or
      CONFIG_POSIX_SYSTEM_INTERFACES instead of CONFIG_POSIX_API, and make
      the network namespace compatibility mode for tests depend on
      CONFIG_POSIX_NETWORKING, the Option Group that provides the POSIX
      socket API.

      The hostap module selects the Option Groups it uses directly; this
      requires the hostap change that includes the standard POSIX headers
      instead of gating them on CONFIG_POSIX_API.
