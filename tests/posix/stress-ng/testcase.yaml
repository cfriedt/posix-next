      - CONFIG_STRESS_NG_STRESSOR_SOCKABUSE=y
      - CONFIG_STRESS_NG_STRESSOR_SOCKMANY=y
      - CONFIG_STRESS_NG_STRESSOR_SOCKPAIR=y
