      Promote zvfs_eventfd(), zvfs_eventfd_read(), and zvfs_eventfd_write()
      to system calls so eventfd works from user mode. The read/write
      verifiers check K_OBJ_FILE ownership via zvfs_fd_syscall_verify() in
      addition to the vtable match inside the implementation (which validates
      the type but not the caller's grant), and the read verifier bounds the
      value pointer. zvfs/eventfd.h joins the registered syscall headers.
  - path: zephyr/libc-statvfs-utime-headers.patch
    sha256sum: c897a6167eb29192501e321be70faf3ba1441814bda49e8903a16611f80545d2
