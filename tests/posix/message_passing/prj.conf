CONFIG_ZTEST=y

CONFIG_POSIX_AEP_CHOICE_PSE51=y
CONFIG_POSIX_MESSAGE_PASSING=y
CONFIG_POSIX_TIMEOUTS=y

# 2 guaranteed (statically allocated) message queues
CONFIG_SYS_MSGQ_MIN_ADD_TEST=2

# stdio (3) + concurrently open message queues (4)
CONFIG_ZVFS_OPEN_IGNORE_MIN=y
CONFIG_ZVFS_OPEN_MAX=7

# SIGEV_THREAD notification threads
CONFIG_SYS_THREAD_STACK_MIN_ADD_TEST=2
CONFIG_SYS_THREAD_THREAD_MIN_ADD_TEST=2

CONFIG_HEAP_MEM_POOL_SIZE=16384
