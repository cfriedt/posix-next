# the board maps 8 MiB by default: the heap, the RAM disk and the process
# tree's copied memory need more
CONFIG_KERNEL_VM_SIZE=0x6000000
CONFIG_MAX_XLAT_TABLES=512
# Linux executables use the SIMD and floating-point registers
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
