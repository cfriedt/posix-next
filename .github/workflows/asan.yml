name: ASAN

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan-prep:
    runs-on: ubuntu-24.04
    outputs:
      skip_nightly: ${{ steps.skip.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      - name: Check if scheduled nightly should run
        id: skip
        uses: ./.github/actions/skip-unchanged-nightly
        with:
          artifact: asan-summary

  asan:
    needs: asan-prep
    if: needs.asan-prep.outputs.skip_nightly != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up workspace
        id: workspace
        uses: ./.github/actions/setup-workspace
        with:
          toolchains: x86_64-zephyr-elf
          ccache-key-prefix: asan

      - name: Run Tests with Twister (ASAN)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ccache --zero-stats
          "${{ github.workspace }}/${{ env.MANIFEST_PATH }}/scripts/ci/asan.sh"
          ccache --show-stats

      - name: Upload ASAN summary
        # Fetched by the Documentation workflow to render docs badges.
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: asan-summary
          path: |
            ${{ github.workspace }}/asan-summary.json
            ${{ github.workspace }}/asan-findings.json
          if-no-files-found: error

      - name: Save workspace ccache
        if: always() && !cancelled()
        uses: ./.github/actions/save-workspace-ccache
        with:
          cache-primary-key: ${{ steps.workspace.outputs.ccache-primary-key }}
          save: true
