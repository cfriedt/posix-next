sample:
  description: POSIX message queue sample
  name: posix message queues
common:
  tags:
    - posix_message_passing
  # stdout interferes with coverage reporting
  filter: not CONFIG_COVERAGE
  integration_platforms:
    - qemu_x86
    - native_sim
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "received \\[prio 6\\]: urgent: fire drill"
      - "received \\[prio 3\\]: reminder: standup at 10"
      - "received \\[prio 3\\]: reminder: lunch at noon"
      - "received \\[prio 0\\]: newsletter"
      - "notified: 1 message\\(s\\) pending"
      - "drained \\[prio 1\\]: notify works"
      - "notified: 1 message\\(s\\) pending"
      - "drained \\[prio 1\\]: and re-arms, too"
      - "signalled: SIGUSR1, SI_MESGQ, value 1234"
      - "received \\[prio 2\\]: signalled, even"
      - "queue geometry: 8 x 48 bytes"
      - "done"
tests:
  sample.posix.message_passing: {}
