manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  # zephyr-keep-sorted-start re(^\s+\- name:)
  projects:
    - name: stress-ng
      url: https://github.com/cfriedt/stress-ng
      revision: 105617edaa3588073dea562a24c22f75774fc240
      path: modules/lib/stress-ng
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.5.0
      import:
        name-allowlist:
          - cmsis_6
          - fatfs
          - hostap
          - littlefs
          - mbedtls
          - picolibc
          - tf-psa-crypto
          - zcbor
  # zephyr-keep-sorted-stop

  self:
    path: modules/lib/posix
