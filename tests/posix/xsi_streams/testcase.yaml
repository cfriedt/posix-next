common:
  filter: not CONFIG_NATIVE_LIBC
  tags:
    - xsi_streams
  # 1 tier0 platform per supported architecture
  platform_key:
    - arch
    - simulation
  integration_platforms:
    - qemu_riscv64
  min_flash: 64
  min_ram: 32
tests:
  portability.posix.xsi_streams: {}
  portability.posix.xsi_streams.userspace:
    filter: (not CONFIG_NATIVE_LIBC) and CONFIG_ARCH_HAS_USERSPACE
    tags: userspace
    extra_configs:
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
  portability.posix.xsi_streams.minimal:
    extra_configs:
      - CONFIG_MINIMAL_LIBC=y
  portability.posix.xsi_streams.newlib:
    filter: TOOLCHAIN_HAS_NEWLIB == 1
    extra_configs:
      - CONFIG_NEWLIB_LIBC=y
  portability.posix.xsi_streams.picolibc:
    tags: picolibc
    filter: CONFIG_PICOLIBC_SUPPORTED
    extra_configs:
      - CONFIG_PICOLIBC=y
  # fails: the host libc has no <stropts.h> / STREAMS interfaces (removed in glibc 2.30)
