# one additional domain per fork round-trip (page tables are not reclaimed):
# the ztest domain plus the three forked children
CONFIG_X86_MAX_ADDITIONAL_MEM_DOMAINS=4

# PROCESS_VM needs the kernel on the process's page tables: no KPTI
CONFIG_X86_KPTI=n
