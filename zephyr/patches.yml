  - path: zephyr/libc-posix-net-header-shims.patch
    sha256sum: 6a60dce0d9e6470857fa9629a48fbb2d3fc71b3d006b522e07b7a4bf54b13a01
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-19
    upstreamable: true
    comments: |
      Add picolibc and newlib <sys/uio.h>, <sys/un.h>, and <netpacket/packet.h>
      shim headers that forward to the out-of-tree posix-next headers, so the new
      POSIX networking headers resolve for these libcs (mirrors the existing
      <sys/socket.h> / <netinet/in.h> shims).
  - path: zephyr/net-compat-non-posix-constants.patch
    sha256sum: 9f2a0b5341a0d3eff0d1e458a6d94471c43e0272f7c4f4a5752a83fff2d73675
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-19
    upstreamable: true
