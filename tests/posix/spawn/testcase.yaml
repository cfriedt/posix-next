common:
  tags:
    - posix_spawn
  platform_key:
    - arch
    - simulation
  min_flash: 64
  min_ram: 32
tests:
  portability.posix.spawn:
    filter: not CONFIG_NATIVE_LIBC
    integration_platforms:
      - qemu_riscv64
      - qemu_cortex_m3
      - qemu_x86
