  - path: zephyr/zvfs-libc-file-fd-fix.patch
    sha256sum: 1f4b778ef2a0e5e02e3302c89dd96c532822d0ffc90df358f9c083da44911d3a
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-06-19
    upstreamable: true
    comments: |
      Bind C library FILE objects to ZVFS file descriptors via per-libc
      zvfs_libc_fdopen()/zvfs_libc_fileno() hooks and a generic, statically-
      allocated FILE-object store (k_mem_slab), fixing the #108818 fd_entry-to-
      FILE cast crash. Add common libc fopen()/freopen()/fclose() on zvfs_open()
      without POSIX_FILE_SYSTEM by moving zvfs_open() and the FS fd vtable into
      lib/os/zvfs/zvfs_fs.c (CONFIG_ZVFS_FS). Reserve fd table slots via
      CONFIG_ZVFS_RESERVE_STDIO_FDS and CONFIG_ZVFS_OPEN_ADD_SIZE_STDIO.
  - path: zephyr/kernel-k-object-is-valid-honor-type.patch
    sha256sum: 89da67c3593f05ed87ab794b2b1fdbd523e7b2dd70d7d1772b947e15038243de
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-08
    upstreamable: true
    comments: |
      k_object_is_valid() accepts an object type and an init-state argument
      but validated against K_OBJ_ANY / _OBJ_INIT_ANY, silently discarding
      both. Callers such as the BSD socket layer therefore received an
      existence-and-permission check with no type or init-state enforcement,
      permitting type confusion between kernel object families at the
      syscall boundary. Forward both arguments to k_object_validate().
  - path: zephyr/zvfs-introduce-k-obj-file.patch
    sha256sum: 7eca8b1784a4812967f6a91570a88051de316a270eac67947f10653f8095d0d8
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-06-19
    upstreamable: true
    comments: |
      Register each static fdtable slot as a K_OBJ_FILE kernel object for
      userspace permission checks. Initialize slots at boot, recycle permissions
      on reserve, and clear initialization when the last reference is dropped.
      Forbid dynamic allocation of K_OBJ_FILE. Extend
      kernel.memory_protection.obj_validation with fdtable slot checks (no POSIX).
      Revoke all grants and clear the PUBLIC flag when the last reference to a
      slot is dropped, so a closed descriptor leaves no residual access.
  - path: zephyr/zvfs-fdtable-use-k-obj-file.patch
    sha256sum: 9b939a901f56067624eead1bdca6ae93d6c472392b48bae44eceffbc0b0a357a
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-06-19
    upstreamable: true
