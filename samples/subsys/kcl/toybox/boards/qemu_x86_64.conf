# per-process address spaces need the kernel out of the user page tables
CONFIG_X86_KPTI=n
# every process is a memory domain whose page tables come from a pool that
# never shrinks, and each VM-cloned child copies its parent's writable
# memory: give the process tree room (64 MiB of RAM: boards/qemu_x86_64.overlay)
CONFIG_X86_MAX_ADDITIONAL_MEM_DOMAINS=32
CONFIG_KERNEL_VM_SIZE=0x5000000
