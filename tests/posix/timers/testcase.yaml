common:
  tags:
    - posix_timers
  # 1 tier0 platform per supported architecture
  platform_key:
    - arch
    - simulation
  min_flash: 64
  min_ram: 32
tests:
  portability.posix.timers:
    filter: not CONFIG_NATIVE_LIBC
  portability.posix.timers.userspace:
    filter: (not CONFIG_NATIVE_LIBC) and CONFIG_ARCH_SUPPORTS_USERSPACE_SIGNALS
    tags: userspace
    extra_configs:
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
  portability.posix.timers.static_only:
    filter: not CONFIG_NATIVE_LIBC
    extra_configs:
      # equal to the accumulated SYS_TIMER_MIN (SYS_TIMER_MIN_ADD_TEST=2): no dynamic timers
      - CONFIG_SYS_TIMER_MAX=2
  portability.posix.timers.minimal:
    filter: not CONFIG_NATIVE_LIBC
    extra_configs:
      - CONFIG_MINIMAL_LIBC=y
  portability.posix.timers.newlib:
    filter: (not CONFIG_NATIVE_LIBC) and (TOOLCHAIN_HAS_NEWLIB == 1)
    extra_configs:
      - CONFIG_NEWLIB_LIBC=y
  portability.posix.timers.picolibc:
    tags: picolibc
    filter: (not CONFIG_NATIVE_LIBC) and CONFIG_PICOLIBC_SUPPORTED
    extra_configs:
      - CONFIG_PICOLIBC=y
  portability.posix.timers.linux_compat:
    tags: native
    platform_allow:
      - native_sim
      - native_sim/native/64
    filter: CONFIG_NATIVE_LIBC
    extra_configs:
      - CONFIG_POSIX_TEST_LINUX_COMPAT=y
      - CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
  portability.posix.timers.signal_less:
    filter: not CONFIG_NATIVE_LIBC
    extra_args:
      - CONF_FILE=prj_signal_less.conf
