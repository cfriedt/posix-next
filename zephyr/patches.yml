  - path: zephyr/zephyr-getopt-h.patch
    sha256sum: 091920d553c343d42ce25dd94bef84bec5bf26fc94edaf92aa34388ad0a2006c
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
