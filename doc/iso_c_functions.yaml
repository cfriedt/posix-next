#
# Functions and symbols defined by the ISO C standard that also appear in
# the POSIX Option Group tables under doc/posix/option_groups/, mapped to
# the C standard in which they first appeared (C89, C99, C11, C17, C23).
# Grouped by C standard header for reviewability.
#
# Used by the posix_badges extension to attach a round "C89"/"C99"/... badge
# to these entries on the Option Group pages, marked with the group's ISO C
# test status (minimal-libc scenario, base fallback). ISO C membership is a
# fixed standard fact; this list only changes if the Option Group tables
# gain or lose ISO C entries (scripts/doc/posix_metrics.py --report helps
# re-derive it).
iso_c:
  assert.h:
    assert: C89
  errno.h:
    errno: C89
  setjmp.h:
    longjmp: C89
    setjmp: C89
  signal.h:
    raise: C89
    signal: C89
  stdio.h:
    stderr: C89
    stdin: C89
    stdout: C89
    clearerr: C89
    fclose: C89
    feof: C89
    ferror: C89
    fflush: C89
    fgetc: C89
    fgetpos: C89
    fgets: C89
    fopen: C89
    fprintf: C89
    fputc: C89
    fputs: C89
    fread: C89
    freopen: C89
    fscanf: C89
    fseek: C89
    fsetpos: C89
    ftell: C89
    fwrite: C89
    getc: C89
    getchar: C89
    gets: C89  # removed in C11; originates in C89
    perror: C89
    printf: C89
    putc: C89
    putchar: C89
    puts: C89
    remove: C89
    rename: C89
    rewind: C89
    scanf: C89
    setbuf: C89
    setvbuf: C89
    tmpfile: C89
    tmpnam: C89
    ungetc: C89
    vfprintf: C89
    vfscanf: C99
    vprintf: C89
    vscanf: C99
  stdlib.h:
    _Exit: C99
    abort: C89
    atexit: C89
    exit: C89
    getenv: C89
  time.h:
    clock: C89
