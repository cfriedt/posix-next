CONFIG_ZTEST=y

CONFIG_POSIX_AEP_CHOICE_BASE=y
CONFIG_POSIX_CLOCK_SELECTION=y

CONFIG_SYS_THREAD_THREAD_MIN=3
CONFIG_SYS_THREAD_STACK_MIN=3
CONFIG_THREAD_STACK_INFO=y

# statically-allocated objects for test_pthread_cond_clockwait, so that the
# suite also passes without a heap (e.g. with the minimal libc)
CONFIG_SYS_THREAD_CONDVAR_MIN_ADD_TEST=1
CONFIG_SYS_THREAD_MUTEX_MIN_ADD_TEST=1
