codecov:
  notify:
    require_ci_to_pass: yes

# gcovr emits west-workspace paths; posix-next git tree is repo-root relative.
fixes:
  - "modules/lib/posix/::"

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default: false
      nightly:
        flags:
          - nightly
        target: auto
    patch:
      default:
        target: auto
        threshold: 0%

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: nightly
      carryforward: true
      paths:
        - include/
        - lib/posix/
    - name: pr-diff
      carryforward: false
      paths:
        - include/
        - lib/posix/

comment:
  layout: "reach, diff, flags, components, files, footer"
  behavior: default
  require_changes: no

# Branch detection is disabled so the Codecov percentage is pure line
# coverage, matching the line-coverage badges in the generated docs.
# NOTE: this parser setting only applies to gcov *text* reports; CI uploads
# Cobertura XML, whose parser has no such toggle and always counts branch
# partials as uncovered. Branch data is therefore stripped from the XML at
# generation time (see coverage.yml and coverage-pr-codecov.sh); this block
# is kept as documentation/backstop should a gcov-format upload ever appear.
parsers:
  gcov:
    branch_detection:
      conditional: no
      loop: no
      method: no
      macro: no

# Option Group components align with coverageui EMBED_POSIX_MANIFEST IDs.
# Kconfig directory names are implementation layout; paths may overlap (shared code).
