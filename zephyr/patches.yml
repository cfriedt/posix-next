  - path: zephyr/kernel-dyn-stack-priv-placement.patch
    sha256sum: e5196f7246f6d2d70007d3c7499af90db152a46968545f102043847745fbfba1
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-04
    upstreamable: true
    comments: |
      kernel: userspace: place dynamic-stack privileged stacks past the object

      Upstream d6071319b53 ("kernel/userspace: Dynamically allocate
      privileged stack after user stack", v4.4.0) moved dynamically
      allocated privileged stacks from the object base to the end of the
      user stack, but computed the end from the requested size.

      dynamic_object_create() places the privileged stack for a dynamically
      allocated user thread stack at ROUND_UP(data + size, obj_align), but
      the user buffer laid out by setup_thread_stack() spans
      K_THREAD_STACK_LEN(size) bytes: K_THREAD_STACK_RESERVED (the PMP
      stack guard) plus any power-of-two size rounding. On RISC-V with
      CONFIG_PMP_STACK_GUARD and CONFIG_PMP_POWER_OF_TWO_ALIGNMENT a
      4 KiB request yields an 8 KiB user object, and the privileged stack
      lands in its top half: every syscall and interrupt then writes kernel
      exception frames over the live user stack top - the thread's TLS area
      and any caller spill slots - so a user thread on an oversized dynamic
      stack corrupts itself as soon as it makes a syscall (observed as the
      syscall wrapper reloading a spilled argument as 0 and oopsing with
      "0 is not a valid k_thread").

      Place the privileged stack after the full K_THREAD_STACK_LEN(size)
      footprint instead. On MPU targets K_THREAD_STACK_RESERVED is 0 and
      the two expressions coincide, so only PMP-guarded configurations
      change. STACK_ELEMENT_DATA_SIZE() already budgets an extra
      Z_THREAD_STACK_OBJ_ALIGN(size) of slack, which covers the moved
      placement.
  - path: zephyr/tracing-ctf-forward-declare-zvfs-pollfd.patch
    sha256sum: 3a919118df16415c70a5c8ddad1d5d4c85a4e576c45d3e3f537acd4a30fcfadc
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-15
    upstreamable: true
    comments: |
      Forward-declare struct zvfs_pollfd in tracing_ctf.h to break fdtable→kernel→tracing include cycle.
  - path: zephyr/gen-syscalls-va-list-by-reference.patch
    sha256sum: c332aa43ae7b09852d43c21dc5368e4db7b102973c69df9518d018894f2ae142
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-13
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-signal.patch
    comments: |
      scripts: build: gen_syscalls: pass va_list arguments by reference. A
      va_list system-call argument (zsock_ioctl_impl(), zvfs_ioctl()) was
      va_copy()d into a register-sized union and its first word sent
      through the trap; the marshaller rebuilt a va_list from that word.
      That only works where a va_list is a pointer (riscv, arm, x86-32).
      On x86_64 and arm64 it is a struct or an array wider than a register,
      so the kernel read the remaining fields uninitialized - GCC 14
      diagnoses reg_save_area/overflow_arg_area as maybe-uninitialized in
      z_vrfy_zsock_ioctl_impl(), a build error under warnings-as-errors,
      and at run time va_arg() walked garbage. The wrapper now keeps the
      copy on the caller's stack and sends its address; the marshaller
      validates that object for reading, va_copy()s it into a local list
      for the verifier and va_end()s it afterwards.
  - path: zephyr/fs-ext2-serialize-operations.patch
    sha256sum: 2db31d79153050925c287da5fdb7b1e7101de3a85a2a80904b24d53a723d524f
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-30
    upstreamable: true
    comments: |
      Serialize every ext2 operation behind one lock: the driver was
      written assuming external serialization (static lookup buffers,
      shared block-fetch state) which concurrently running processes do
      not provide; racing lookups returned phantom ENOENTs. ext2 supports
      a single mounted instance, so a single lock suffices.
  - path: zephyr/fs-ext2-log-uuid-as-hex.patch
    sha256sum: a3c9c02fe0b6e124f49ca57e7d09ec63e4e986bb1e8645999ce1fef4bd50c78b
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-14
    upstreamable: true
    comments: |
      fs: ext2: log the file system UUID as hex. ext2_format() logged
      cfg->uuid with %s, but the UUID is 16 raw bytes - random ones when
      the caller sets none - neither text nor NUL-terminated: any byte at
      or above 0x80 put a non-UTF-8 byte on the console, which twister's
      byte-wise decoder reports as "unexpected byte" and fails the run,
      and the string ran into whatever followed the field in memory.
      About one format in two hit it, which made every ext2-backed suite
      (symbolic_links_fd, file_system) look load-flaky on every qemu
      platform. Format the UUID through bin2hex() into a stack buffer.
  - path: zephyr/disk-ramdisk-map-ram-region-only.patch
    sha256sum: d5c0e879ee820ca8fee25bdb8d9347d23d13184911193a09b4283f070418da04
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-10-04
    upstreamable: true
    comments: |
      Map a RAM disk under the MMU only when its buffer is a ram-region.
      A buffer declared in the image is already mapped and its address is
      virtual: mapping it again as a physical address is wrong where the
      two differ and otherwise costs a second virtual range the size of
      the disk, which a 4 MiB disk no longer finds in an 8 MiB kernel VM.

  - path: zephyr/ztest-failed-expectation-from-user-mode.patch
    sha256sum: fed831d9d4292ca7bf3cee8f925cef9c4afb412f1962898dd6793e31996f7823
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-11-07
    upstreamable: true
    comments: |
      ztest_test_expect_fail() recorded a failed zexpect by writing a static of the
      test framework directly; from a user-mode test that write is a page fault, so a
      failing expectation crashed the test instead of failing it, and twister reported
      "Fault detected while running test" with no verdict. The flag is set through a
      system call like the test result and phase already are.
  - path: zephyr/privileged-stack-fits-a-zvfs-syscall.patch
    sha256sum: 458d99e3409c0b243ff772bed5eefe5bc7ceb48639249a7fcde7557880ac7bf5
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-11-04
    upstreamable: true
    comments: |
      A ZVFS system call runs the file or socket path on the caller's privileged stack and
      overflowed the 1 KiB default twice: recv() -> tcp_out_ext() -> net_pkt allocation ->
      k_queue_get() on qemu_riscv32 (976 bytes in use at the trap), and a FIFO test's file
      operations -> heap free on mps2/an385, where the first privileged stack sits right above
      z_main_stack and the overflow corrupted main's frame (its epilogue popped a heap-code
      return address as pc after the suite had passed). With ZVFS the privileged stack
      defaults to 2 KiB, as it already does under EMUL and gcov.
  - path: zephyr/sysworkq-stack-fits-dns-retransmit.patch
    sha256sum: bcd2a6846cebadc124593e4dffe7ca879cf3665ceb9291111405a9ba5ba30c6c
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-11-04
    upstreamable: true
    comments: |
      The DNS resolver retransmits a query from the system workqueue, through
      zsock_sendto(), source address selection and the route lookup. On a
      32-bit target without an MMU that chain fills the 1 KiB default stack
      exactly, so the default is 2048 when the resolver is enabled, as it
      already is for the Wi-Fi supplicants.
  - path: zephyr/arm64-switch-callee-saved-base.patch
    sha256sum: c3f6d6e05a9763367769ab7d71f4549ee4cc64cbea0269069032c4e2708e3363
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-11-04
    upstreamable: true
    comments: |
      z_arm64_context_switch() addressed the callee-saved registers with
      stp/ldp offsets from the thread object, limited to 504 bytes; growing
      struct k_thread ahead of callee_saved broke the build. The pairs are
      now addressed from a base register.
  - path: zephyr/sched-halt-spin-irqs-masked.patch
    sha256sum: 56e824f2878376875d810d90e93f0da2d53efb93f3510ee5442077512c6f7758
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-11-04
    upstreamable: true
    comments: |
      halt_thread() waits out a timeout handler still in flight on another
      CPU by dropping and retaking the scheduler lock. Unlocking restored
      interrupts: a thread halting itself is already dead, so an interrupt
      in that window switched it out for good, before it woke its joiners,
      and every joiner hung. The lock is now released without restoring
      interrupts. Upstream v4.5.0 and main have the same loop.
  - path: zephyr/twister-progress-eta.patch
    sha256sum: 709dd25d27d360765fdfaa7f29815970649081046e57fe3e44914fa10f0b64b0
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-11-08
    upstreamable: true
    comments: |
      The progress ticker shows the elapsed time and an estimate of the time
      left, from the average per-instance rate so far, so a run watched from
      its log or a plain terminal says when it will finish. The estimate and
      the duration formatting move to runmonitor.py, where the
      --console-monitor dashboard takes them from as well.
  - path: zephyr/arm-syscall-clobbers-flags.patch
    sha256sum: f3d25252d8c4bb624e768cc7f6695e47c8c561149cce775622b126ffa6494a98
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-11-03
    upstreamable: true
    comments: |
      The ARM syscall asm clobbers the condition flags: GCC otherwise keeps a compare
      live across the svc, and nothing preserves APSR through z_arm_do_syscall().
  - path: zephyr/kernel-dyn-stack-alloc-align.patch
    sha256sum: 48d8e863aa5c9e0b57e8c0dd8c0234d9f19c9a3c923aacc63c46dfb985da15cf
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-10-17
    upstreamable: true
    comments: |
      kernel: userspace: align dynamic user stacks to their own object alignment

      dynamic_object_create() allocates the buffer of a dynamic thread stack
      aligned to DYN_OBJ_DATA_ALIGN_K_THREAD_STACK, the object alignment of
      CONFIG_DYNAMIC_THREAD_STACK_SIZE, whatever size was requested. On
      architectures with CONFIG_MPU_REQUIRES_POWER_OF_TWO_ALIGNMENT (ARMv7-M,
      ARMv7-R) the object alignment of a stack is its power-of-two size, so a
      user stack larger than the default is only aligned to the default size
      and the MPU region programmed for it does not cover it. Whether the
      thread then faults depends on where the heap happened to place the
      buffer: on mps2/an385 and qemu_cortex_r5 a user thread on a stack of
      twice the default size takes an MPU stacking fault on its first
      exception.

      Align the buffer to the larger of the default alignment and the
      requested size's own object alignment. On every other architecture the
      two are equal and nothing changes. STACK_ELEMENT_DATA_SIZE() already
      reserves Z_THREAD_STACK_OBJ_ALIGN(size) of slack, so the privileged
      stack placed at ROUND_UP(data + K_THREAD_STACK_LEN(size), obj_align)
      still fits; with an aligned buffer the ROUND_UP is exact.

      Found through zephyr#122510, whose dynamic_thread_stack test allocates
      user stacks of twice CONFIG_DYNAMIC_THREAD_STACK_SIZE and faults on
      exactly the two power-of-two MPU platforms in CI.
  - path: zephyr/libc-picolibc-errno-function.patch
    sha256sum: 20511f749f65f6d6fe8b9ddbdb4accaa21a23aa1977f0b2b9cd926c2090be6d2
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-11-20
    upstreamable: true
    comments: |
      Picolibc keeps errno in a thread-local variable, which a loadable
      extension cannot name: extensions carry no thread-local relocations.
      CONFIG_PICOLIBC_ERRNO_FUNCTION, on by default with LLEXT, has the
      library's <errno.h> route every access through z_errno_wrap(), a
      function the base image defines over the variable and exports, so an
      extension shares the errno of the thread running it. ERRNO_IN_TLS
      defaults off with LLEXT for the same reason.
  - path: zephyr/zvfs-libc-file-fd-fix.patch
    sha256sum: 83f092887f555bb86e5b406bc9dafee2a134cd1b0325a360786e6c93fcd42b54
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-06-19
    upstreamable: true
    comments: |
      Bind C library FILE objects to ZVFS file descriptors via per-libc
      zvfs_libc_fdopen()/zvfs_libc_fileno() hooks and a generic, statically-
      allocated FILE-object store (k_mem_slab), fixing the #108818 fd_entry-to-
      FILE cast crash. Add common libc fopen()/freopen()/fclose() on zvfs_open()
      without POSIX_FILE_SYSTEM by moving zvfs_open() and the FS fd vtable into
      lib/os/zvfs/zvfs_fs.c (CONFIG_ZVFS_FS). Reserve fd table slots via
      CONFIG_ZVFS_RESERVE_STDIO_FDS and CONFIG_ZVFS_OPEN_ADD_SIZE_STDIO.
  - path: zephyr/sigrtmin-linux-alignment.patch
    sha256sum: 6c56de0f2055b6b1488fb31a4fb017e0450a622ed85c7c9cfdc925e0c8703d02
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-06-21
    upstreamable: true
    comments: |
      Align SIGRTMIN with Linux/glibc NPTL (reserve 32 for cancel and 33;
      application RT signals from 34). Corrects SIGRTMIN 32 in Newlib/Picolibc
      libc shadows after move-posix; posix headers and Kconfig live out-of-tree.
      The original value 32 was taken from Newlib and Picolibc Cygwin targets,
      which use a compact sigset_t (uint32_t or unsigned long) rather than a
      range sized for Zephyr's POSIX realtime signal requirements.
  - path: zephyr/libc-minimal-and-pico-support-for-strfmon.patch
