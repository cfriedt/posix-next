common:
  tags:
    - posix_multi_process
  # 1 tier0 platform per supported architecture
  platform_key:
    - arch
    - simulation
  min_flash: 64
  min_ram: 32
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "app:exiting"
      - "atexit:first"
      - "atexit:second"
      - "atexit:last"
tests:
  portability.posix.multi_process.exit:
    filter: not CONFIG_NATIVE_LIBC
  portability.posix.multi_process.exit.minimal:
    filter: not CONFIG_NATIVE_LIBC
    extra_configs:
      - CONFIG_MINIMAL_LIBC=y
  portability.posix.multi_process.exit.newlib:
    filter: (not CONFIG_NATIVE_LIBC) and (TOOLCHAIN_HAS_NEWLIB == 1)
    extra_configs:
      - CONFIG_NEWLIB_LIBC=y
  portability.posix.multi_process.exit.picolibc:
    tags: picolibc
    filter: (not CONFIG_NATIVE_LIBC) and CONFIG_PICOLIBC_SUPPORTED
    extra_configs:
      - CONFIG_PICOLIBC=y
  portability.posix.multi_process.exit.linux_compat:
    tags: native
    platform_allow:
      - native_sim
      - native_sim/native/64
    filter: CONFIG_NATIVE_LIBC
