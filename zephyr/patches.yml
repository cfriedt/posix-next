  - path: zephyr/k-signal.patch
    sha256sum: 5b3edfdef80c721ed8907fa8342205a261d7e8a57fe301985bbdb2632e7c33ae
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2024-06-18
    upstreamable: true
    comments: |
      Add the k_signal API for inter-thread signaling.
      A thread object set up anew drops the thread-directed entries its
      previous occupant never claimed (z_sig_thread_drop() from
      z_setup_new_thread()): a pooled thread that exited with a kill queued
      to it would otherwise hand that kill to the next thread drawn on it.
      The syscall-return trampoline is its own mechanism, SYSCALL_RETURN_HOOK
      (kernel/return_hook.c), which signals select: z_sig_handle(), k_sig_current()
      and k_sig_return() live there, and kernel/signal.c keeps the queue, the
      dispositions, z_sig_claim() and z_sig_pending_any().
      Handlers run in series: while one is in progress (k_sig_ctx.handling,
      set at redirection and cleared by k_sig_return()) z_sig_handle() leaves
      further signals pending, so a second signal arriving at a system call
      made inside a handler cannot start a nested handler. The per-thread
      backup of the interrupted context has one slot; a nested delivery
      overwrote it and the outer k_sig_return() resumed the wrong context.

      Includes the SIGNAL_ACTION_DB_SIZE_MIN_* Kconfig contributor mechanism, a per-thread
      count of signals delivered to a handler readable via k_sig_delivered(), a user_data
      pointer carried with each k_sig_action (retrievable during handling via k_sig_current(),
      for layers that interpose their own handler), and a system-wide alarm armed via
      k_sig_alarm() that queues K_SIG_ALRM to the calling thread on expiry. The alarm
      goes with the thread that armed it: halt_thread() cancels it through
      z_sig_thread_exit(), so an expiry never queues to a thread object that has since
      been retired or reused.
      The pending-scan reclaims queue entries whose target thread has died,
      keyed on each entry's own target rather than the querying thread.
      The generated system call wrappers test one system-wide counter of pending signal
      work inline (z_syscall_work_pending, maintained at the queue and release sites) and only
      reach the out-of-line checks when it is non-zero; kernel-only builds force-inline
      every non-variadic wrapper (Z_SYSCALL_INLINE) so that test does not turn a direct
      kernel call into two calls. Invalid actions are rejected before the action database
      capacity check.

      kernel: an ignored signal that its target has unblocked is discarded as
      it is generated. Delivery would only have discarded it, so queueing it
      held a slot of the shared signal queue until the target next passed a
      delivery point; a flood of kill()s with an ignored signal (stress-ng
      kill: SIGUSR1 to a process ignoring it, STOP/CONT/USR1 to a child
      slower than its parent) filled the queue and a later kill() failed with
      EAGAIN, which is not a kill() error. Blocked signals still pend whatever
      their action (POSIX leaves a blocked, ignored signal unspecified; a
      handler installed later, or a sigwait(), may still take it), child
      notifications keep their reaped status, and timer, message-queue and
      asynchronous I/O notifications keep their own accounting: only
      kill()-class generation (K_SI_QUEUE) to a thread is discarded. The
      standing decision not to merge repeats of a standard signal in the
      queue is unchanged. tests/kernel/signal test_k_kill floods an ignored
      unblocked signal past the queue size and checks that a blocked one
      still pends and is claimed.
  - path: zephyr/k-signal-ucontext.patch
    sha256sum: dad3d7456b2804a997377b8277e13b6498b989147a43992412fcf5a2746f6621
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-11-20
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-signal.patch
    comments: |
      The signal trampoline builds the context a handler is entered with on
      the handler's stack and passes its address as the third argument: the
      mask the interrupted context resumes with, which the handler may change.
      k_sig_return() installs that mask, with K_SIG_KILL and K_SIG_STOP kept
      unblocked for a user caller, in place of the one it kept; k_sig_current()
      fills the context in.
  - path: zephyr/k-signal-fault.patch
    sha256sum: 239fae688f75845d89a0c94decbc0ff1f2420c7092dec7059ac319afdcb61e65
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-11-03
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-signal.patch
    comments: |
      A fault a user thread takes generates a signal for it (SIGSEGV, SIGBUS,
      SIGILL, SIGFPE, SIGTRAP with the Linux si_code and si_addr) instead of
      a fatal error. The arch records the fault and resumes the thread in a
      stack-free user-mode stub whose k_sig_fault() system call either runs
      the handler on the return path or, for a blocked, ignored or default
      disposition or a fault inside a handler, ends the thread with the
      signal in thread context (its process, once there are processes). A
      returning handler ends it the same way (POSIX leaves it undefined).
      Each architecture's fault classifier follows in a patch of its own. The
      picolibc signal.h shim numbers si_code as Linux does.
      tests/kernel/signal test_k_sig_fault, with the sections every
      architecture shares.
  - path: zephyr/k-signal-interruptible-wait.patch
    sha256sum: 226a436f79b6ff76719592e57d318ab674edd9d17cb13a9667f7ae3320ce932a
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-10-24
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-signal.patch
    comments: |
      Signals interrupt a thread's blocking waits. Queueing a signal never
      woke its target: a thread blocked in a sleep, a pend or a poll ran its
      handler only when that wait ended on its own, so an alarm never ended
      a sleep and a handled signal never interrupted the call. A blocking
      wait that signals may interrupt opts in at its wait site, so the
      kernel's own waits are never cut short: the waiter marks its thread
      (z_sig_pend_begin()), checks once more that no deliverable signal
      (unblocked, not ignored) is pending, and pends as before. A signal
      queued to a marked thread unpends it with -EINTR, wakes it from
      k_sleep(), or flags a pend not yet made so that it returns at once;
      the window between the waiter's check and its pend is closed inside
      the scheduler (z_sched_sig_interrupt(), pend_locked(), z_pend_curr()).
      z_sig_pend_end() reports a signal pending, or one claimed during the
      wait - the arch return path claims it for delivery before the waiter
      looks. Waits built on poll signals register the signal they poll in
      the thread's signal context (k_sig_ctx.wait_sig, z_sig_wait_begin()
      and z_sig_wait_end()) and queueing raises it.

      Opted in here: sys_clock_nanosleep() (sleep, nanosleep,
      clock_nanosleep), the socket accept, connect and receive waits,
      poll and select, and the eventfd read and write, which end with
      EINTR as on Linux instead of staying blocked until the counter moves.
      A signal wait (k_sig_timedwait) ends with -EINTR when a deliverable
      signal outside its set arrives, so a thread blocked in sigwaitinfo()
      can be terminated or run a handler. Blocked and ignored signals do
      not interrupt; a call is never restarted. The sender of a signal
      yields to its target: when z_sched_sig_interrupt() readies the target
      and the sender is a preemptible thread of the same priority, the
      sender moves to the end of its run queue, as a time slice expiry
      would, so that programs which rely on the woken thread running first
      see every report.

      tests/kernel/signal covers a sleep, a semaphore pend and a signal
      wait; tests/lib/zvfs_eventfd covers the interrupted read.
