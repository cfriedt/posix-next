  - path: zephyr/samples-net-can-propagate-socket-errors.patch
    sha256sum: 3f7bff68c0e3d40d7a6a5dd2d85d7a2f202cb10e1867c48d2753e7988858b485
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-19
    upstreamable: true
