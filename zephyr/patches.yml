      satisfy e.g. POSIX_SYSTEM_DATABASE_R tests.
  - path: zephyr/zvfs-file-locking.patch
    sha256sum: 2245082c16bab396ca1a57e87e3e1c6596c03da2fee7d4a63596026aa969876d
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-06-20
    upstreamable: true
    comments: |
      Add ZVFS file-locking helpers (zvfs_lock_file, zvfs_getc_unlocked, etc.)
      and refactor zvfs_rw() so unlocked I/O can run under flockfile().
      Route minimal-libc stdout through z_impl_zephyr_write_stdout for reserved
      stdio fds. Select TC_PROVIDES_POSIX_FILE_LOCKING for picolibc.
  - path: zephyr/zvfs-poll-no-poll-support.patch
    sha256sum: 5667e50aa0edd96c0dc6ff49f39150970634503bf9b7c53ec23acad47b6723d3
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-01
    upstreamable: true
    comments: |
      lib: os: zvfs: poll fds whose backends have no poll support

      poll() on a descriptor whose backend implements no poll ioctls
      (regular files, shared memory, message queues, directories, and
      the stdio slots) failed with a garbage errno: the vmethod's -1
      return was negated into errno as EPERM. POSIX requires that
      regular files always poll readable and writable.

      Classify such descriptors by their fd entry mode: IFREG, IFSHM,
      IFBLK, IFCHR, IFDIR, and IMSGQ have no waitable condition and are
      reported ready for input and output immediately, without
      consulting the backend. The stdio slots, previously untyped, are
      now typed IFCHR. Backends that do implement the poll ioctls
      (sockets, eventfd, socketpair) are unaffected: eventfd finalizes
      untyped and continues through the ioctl path.

      The per-fd prepare and update steps move into zvfs_poll_prepare_fd()
      and zvfs_poll_update_fd(), internal single-descriptor helpers that
      zvfs_poll_internal() now loops over, so the classification exists
      in exactly one place and kernel services can arm readiness waits
      on a single descriptor (e.g. with k_work_poll) without a pollfd
      array of their own.
  - path: zephyr/fs-opendir-root-mount.patch
    sha256sum: 5cbf0cb3010ac8133f4a6d0d86494f7d43cdc5b95ce6e250ed3b04853ec709ab
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-30
    upstreamable: true
    comments: |
      fs_opendir("/") opens a file system mounted at the root itself when
      one exists, instead of unconditionally enumerating mount points via
      the virtual root directory.
  - path: zephyr/zvfs-eventfd-syscalls.patch
    sha256sum: 0e4795b4e1831c2065b56cbfe8f958047ba39aa5f25a78731c768bf5a92b7f45
