common:
  tags:
    - posix_spawn
  platform_key:
    - arch
    - simulation
  min_flash: 64
  min_ram: 32
tests:
  portability.posix.spawn:
    filter: not CONFIG_NATIVE_LIBC
    integration_platforms:
      - qemu_riscv64
      - qemu_cortex_m3
      - qemu_x86
  # a kernel-mode caller: the user-mode images it spawns start with no signal blocked
  portability.posix.spawn.kernel_caller:
    filter: (not CONFIG_NATIVE_LIBC) and CONFIG_ARCH_HAS_USERSPACE
    tags: userspace
    extra_configs:
      - CONFIG_USERSPACE=y
      - CONFIG_ZTEST_FATAL_HOOK=y
      # the kernel-mode caller spawns, maps and reaps on the ztest stack
      - CONFIG_ZTEST_STACK_SIZE=4096
      - CONFIG_PRIVILEGED_STACK_SIZE=4096
      # the SIGCHLD section nests three processes of the suite's own, each in a domain
      - platform:qemu_x86/atom:CONFIG_X86_MAX_ADDITIONAL_MEM_DOMAINS=8
      - platform:qemu_x86_64/atom:CONFIG_X86_MAX_ADDITIONAL_MEM_DOMAINS=8
      # and each with a power-of-two aligned user stack where the MPU or PMP demands it
      - platform:qemu_riscv32/qemu_virt_riscv32:CONFIG_HEAP_MEM_POOL_SIZE=65536
      - platform:mps2/an385:CONFIG_HEAP_MEM_POOL_SIZE=65536
  portability.posix.spawn.userspace:
    filter: (not CONFIG_NATIVE_LIBC) and CONFIG_ARCH_HAS_USERSPACE
    tags: userspace
    extra_configs:
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
      - CONFIG_ZTEST_FATAL_HOOK=y
      # a user caller clones on its privileged stack
      - CONFIG_PRIVILEGED_STACK_SIZE=4096
      # the SIGCHLD section nests three processes of the suite's own, each in a domain
      - platform:qemu_x86/atom:CONFIG_X86_MAX_ADDITIONAL_MEM_DOMAINS=8
      - platform:qemu_x86_64/atom:CONFIG_X86_MAX_ADDITIONAL_MEM_DOMAINS=8
      # and each with a power-of-two aligned user stack where the MPU or PMP demands it
      - platform:qemu_riscv32/qemu_virt_riscv32:CONFIG_HEAP_MEM_POOL_SIZE=65536
      - platform:mps2/an385:CONFIG_HEAP_MEM_POOL_SIZE=65536
  # fails: spawns prelinked Zephyr thread images via the image registry, which the host libc cannot run
