CONFIG_ZTEST=y
CONFIG_POSIX_AEP_CHOICE_PSE52=y
CONFIG_POSIX_FIFO=y

# XSI provides the S_IF* constants and the XSI struct stat members
CONFIG_XSI=y

# FIFO nodes need ext2
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_EXT2=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_RAM=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_EVENTFD=n

CONFIG_ZVFS_PIPE_MAX=2
CONFIG_ZVFS_FIFO_OPEN_MAX=4
CONFIG_ZVFS_OPEN_IGNORE_MIN=y
CONFIG_ZVFS_OPEN_MAX=12
CONFIG_ZVFS_DIR_MAX=4

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_TEST_EXTRA_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384

# static stacks/threads: heap-carved user stacks do not fit the fixed heap above;
# the writer's open() runs an ext2 lookup on its stack
CONFIG_SYS_THREAD_STACK_MIN_ADD_TEST=1
CONFIG_SYS_THREAD_THREAD_MIN_ADD_TEST=1
CONFIG_SYS_THREAD_STACK_SIZE=4096
