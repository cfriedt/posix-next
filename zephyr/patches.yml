      Repurpose the network namespace compatibility mode to provide only the
      non-POSIX, system-dependent unprefixed names (AF_PACKET, IPPROTO_IGMP,
      SO_PRIORITY, CAN_RAW, TLS_*, PACKET_*, sockaddr_ll, ...). All POSIX symbols
