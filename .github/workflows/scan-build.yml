name: Scan-Build

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-build-prep:
    runs-on: ubuntu-24.04
    outputs:
      skip_nightly: ${{ steps.skip.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      - name: Check if scheduled nightly should run
        id: skip
        uses: ./.github/actions/skip-unchanged-nightly
        with:
          artifact: static-analysis-summary

  scan-build:
    needs: scan-build-prep
    if: needs.scan-build-prep.outputs.skip_nightly != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up workspace
        id: workspace
        uses: ./.github/actions/setup-workspace
        with:
          toolchains: x86_64-zephyr-elf
          ccache-key-prefix: scan-build

      - name: Install clang static analyzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tools

      - name: Run clang scan-build over module sources
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ccache --zero-stats
          "${{ github.workspace }}/${{ env.MANIFEST_PATH }}/scripts/ci/scan-build.sh"
          ccache --show-stats

      - name: Fail on findings
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          count=$(jq '.findings | length' static-analysis.json)
          echo "clang static analyzer reported ${count} finding(s)"
          test "$count" -eq 0

      - name: Upload static analysis summary
        # Fetched by the Documentation workflow to render docs badges.
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-summary
          path: ${{ github.workspace }}/static-analysis.json
          if-no-files-found: error

      - name: Save workspace ccache
        if: always() && !cancelled()
        uses: ./.github/actions/save-workspace-ccache
        with:
          cache-primary-key: ${{ steps.workspace.outputs.ccache-primary-key }}
          save: true
