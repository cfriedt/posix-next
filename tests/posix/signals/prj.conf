CONFIG_ZTEST=y
CONFIG_ZTEST_FATAL_HOOK=y

CONFIG_POSIX_AEP_CHOICE_PSE51=y
CONFIG_POSIX_SIGNALS=y
# POSIX_SIGNALS no longer selects POSIX_MULTI_PROCESS (they are independent
# Subprofiling Option Groups); the tests use getpid() as the kill() target
CONFIG_POSIX_MULTI_PROCESS=y

CONFIG_SYS_THREAD_STACK_MIN_ADD_TEST=1
CONFIG_SYS_THREAD_THREAD_MIN_ADD_TEST=2
