name: Skip unchanged nightly
description: >-
  Decide whether a scheduled nightly should run: skip when main is unchanged
  since the newest completed run of this workflow that uploaded its summary
  artifact, and that run succeeded (the published data is already current
  and green). A failed run at the same commit is repeated so the failure
  stays visible. workflow_dispatch runs are never skipped.

inputs:
  artifact:
    description: Summary artifact name a prior run must have uploaded
    required: true

outputs:
  skip:
    description: "'true' when the scheduled run should be skipped"
    value: ${{ steps.check.outputs.skip }}
  main_sha:
    description: Commit at the tip of main when the check ran
    value: ${{ steps.check.outputs.main_sha }}

runs:
  using: composite
  steps:
    - name: Compare main against the last summarized run
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ARTIFACT: ${{ inputs.artifact }}
      run: |
        set -euo pipefail
        echo "skip=false" >> "$GITHUB_OUTPUT"
        main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" \
          --jq .commit.sha)
        echo "main_sha=${main_sha}" >> "$GITHUB_OUTPUT"
        if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
          echo "Not a scheduled run; nightly enabled (main=${main_sha})"
          exit 0
        fi
        while read -r id sha conclusion; do
          has=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts" \
            --jq "[.artifacts[].name] | any(. == \"${ARTIFACT}\")")
          if [ "$has" != "true" ]; then
            continue
          fi
          if [ "$sha" != "$main_sha" ]; then
            echo "Scheduled nightly will run (main=${main_sha}," \
              "last summarized=${sha})"
          elif [ "$conclusion" != "success" ]; then
            echo "Scheduled nightly will run: run ${id} summarized ${sha}" \
              "but concluded ${conclusion}"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled nightly skipped: main unchanged since run ${id}" \
              "summarized ${sha} successfully"
          fi
          exit 0
        done < <(gh run list -R "${GITHUB_REPOSITORY}" \
          --workflow "${GITHUB_WORKFLOW}" --branch main --status completed \
          --limit 10 --json databaseId,headSha,conclusion \
          --jq '.[] | "\(.databaseId) \(.headSha) \(.conclusion)"')
        echo "No prior ${ARTIFACT} artifact found; scheduled nightly will run"
