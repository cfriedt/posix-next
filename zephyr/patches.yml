  - path: zephyr/hostap-wifi-posix-profile.patch
    sha256sum: 9a00d4901cb5a6bfd383ff1c73bfd941908746f9e10e76aafd8ce92b1e6938d7
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
