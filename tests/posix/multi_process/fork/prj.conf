CONFIG_ZTEST=y

CONFIG_POSIX_AEP_CHOICE_BASE=y
CONFIG_POSIX_MULTI_PROCESS=y
CONFIG_USERSPACE=y
CONFIG_TEST_USERSPACE=y
CONFIG_PROCESS_VM=y
# fork's same-address TLS requires the arch current-thread lookup
CONFIG_CURRENT_THREAD_USE_TLS=n
CONFIG_SYS_PROCESS_MAX=5
# four fork round-trips: the reaped children's tables free lazily
CONFIG_HEAP_MEM_POOL_SIZE=262144
# a child's copies come from the page-frame pool: an arena the kernel heap could not hold
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=524288
CONFIG_MAX_THREAD_BYTES=5
CONFIG_SYS_THREAD_THREAD_MIN=4
CONFIG_SYS_THREAD_STACK_MIN=4

# fd inheritance sections use an eventfd as the shared description
CONFIG_POSIX_DEVICE_IO=y
CONFIG_EVENTFD=y

# the disposition inheritance section queries sigaction() across fork
CONFIG_POSIX_SIGNALS=y

# the fork handler section registers with pthread_atfork()
CONFIG_POSIX_THREADS=y
CONFIG_POSIX_THREAD_ATFORK_MAX=1
