patches:
  - path: zephyr/random-test-csprng-syscall-handler.patch
    sha256sum: f76bd4ccbfefcacb64e18f10ed5d101ed875af45fc20509770adb05303582fdd
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-10-10
    upstreamable: true
    comments: |
      Upstream Zephyr bug, independent of posix-next: the sys_csrand_get()
      system call handler is compiled only with CONFIG_CSPRNG_ENABLED, but
      CONFIG_TEST_CSPRNG_GENERATOR also implements z_impl_sys_csrand_get()
      (over sys_rand_get()). A user thread calling sys_csrand_get() in that
      configuration hits an unimplemented system call and oopses instead of
      reaching the generator. Compile the handler for both providers.
  - path: zephyr/posix-network-appliance-subprofile.patch
    sha256sum: 4bdadaa91684601e6c1bb1cad164f64b84ac21bb303334da659fbb6ea05d82eb
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-23
    upstreamable: true
    merge-pr: https://github.com/zephyrproject-rtos/zephyr/pull/120028
    comments: |
      Part of zephyr#120028 (rebased onto v4.5.0-rc2), replacing the v4.3.0/v4.4.1-era
      deprecate-config-posix-api and do-not-define-_POSIX_C_SOURCE patches.
      posix: add a network appliance subprofile
      Networked applications typically need the networking interfaces of
      PSE53 but not its multi-process, pipe, spawn or sporadic server
      interfaces. Add CONFIG_POSIX_AEP_CHOICE_NETAPP, a Zephyr-specific
      subprofile that selects PSE52 plus POSIX_NETWORKING, POSIX_RAW_SOCKETS,
      POSIX_CPUTIME and POSIX_PRIORITY_SCHEDULING, so that such applications
      do not have to pull in the whole of PSE53.
      v4.5.0-rc2 carries the subprofile itself (Kconfig.profile, release note); only the POSIX
      overview line listing CONFIG_POSIX_AEP_CHOICE_NETAPP remains here (2026-10-15).
  - path: zephyr/posix-remove-zephyr-posix-header-prefix.patch
    sha256sum: 2e7c294498bab25c56251c2226dd14d9d51d20db140a0fac571eb67d6567a0db
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-22
    upstreamable: true
    merge-pr: https://github.com/zephyrproject-rtos/zephyr/pull/120028
    comments: |
      Part of zephyr#120028 (rebased onto v4.5.0-rc2), replacing the v4.3.0/v4.4.1-era
      deprecate-config-posix-api and do-not-define-_POSIX_C_SOURCE patches.
      posix: remove zephyr/posix in header prefixes
      If C libraries provide conformant POSIX headers, then use the headers
      provided by the C library.

      Otherwise, C library maintainers may add `include/zephyr/posix` to their
      standard search path.

      This change removes the requirement to have `<zephyr/posix/...>` prefixing
      all standard POSIX includes in Zephyr.

      The main reason that it was required was due to conflicts between C
      library time.h, signal.h and the fact that Zephyr posix headers were being
      somewhat ad-hoc mixed with libc posix headers.

      Now, any (even partially) POSIX-conformant C libraries are expected to
      provide their own types, constants, and headers, and Zephyr's
      implementation uses those definitions.

      If any definitions are missing, we define them on a per-libc basis. This
      can also be done out-of-tree, which allows for implementors to take
      advantage of the `CONFIG_TC_PROVIDES_POSIX..` options.

      This is likely the last major commit required before we deprecate the
      `CONFIG_POSIX_API` Kconfig option in favour of POSIX subprofiling \o/
  - path: zephyr/posix-unistd-version-and-symbolic-constants.patch
    sha256sum: 7c5b21cdc9bc42c28299366f83f413a61a5363047234ca84750c605c5eced438
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-22
    upstreamable: true
    merge-pr: https://github.com/zephyrproject-rtos/zephyr/pull/120028
    comments: |
      Part of zephyr#120028 (rebased onto v4.5.0-rc2), replacing the v4.3.0/v4.4.1-era
      deprecate-config-posix-api and do-not-define-_POSIX_C_SOURCE patches.
      posix: ensure that unistd.h declares version and symbolic constants
      The specification requires that unistd.h (or a file that is included via
      unistd.h) declare version macros and symbolic constants.

      Feature test macros declarations are also removed from
      `subsys/portability/posix/options/CMakeLists.txt`.

      Closes #97949
  - path: zephyr/deprecate-config-posix-api.patch
    sha256sum: afab1145fde704f6e4dcec5dbc6e8e2fd92c2034b898a3bf385b1fcc0ca7abcf
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-23
    upstreamable: true
    merge-pr: https://github.com/zephyrproject-rtos/zephyr/pull/120028
    comments: |
      Part of zephyr#120028 (rebased onto v4.5.0-rc2), replacing the v4.3.0/v4.4.1-era
      deprecate-config-posix-api and do-not-define-_POSIX_C_SOURCE patches.
      posix: deprecate CONFIG_POSIX_API
      CONFIG_POSIX_API predates POSIX subprofiling and enables an ad-hoc,
      ever-growing set of Option Groups. Mark it deprecated and convert the
      in-tree users to a subprofile (CONFIG_POSIX_AEP_CHOICE_*) plus the
      Option Groups they actually use, following the conversion used in the
      posix-next module. Networked samples and tests use the NETAPP
      subprofile.

      Gate the file and file-system function declarations in
      <zephyr/posix/unistd.h> on _POSIX_C_SOURCE or
      CONFIG_POSIX_SYSTEM_INTERFACES instead of CONFIG_POSIX_API, and make
      the network namespace compatibility mode for tests depend on
      CONFIG_POSIX_NETWORKING, the Option Group that provides the POSIX
      socket API.

      The hostap module selects the Option Groups it uses directly; this
      requires the hostap change that includes the standard POSIX headers
      instead of gating them on CONFIG_POSIX_API.
  - path: zephyr/kernel-dyn-stack-priv-placement.patch
    sha256sum: e5196f7246f6d2d70007d3c7499af90db152a46968545f102043847745fbfba1
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-04
    upstreamable: true
    comments: |
      kernel: userspace: place dynamic-stack privileged stacks past the object

      Upstream d6071319b53 ("kernel/userspace: Dynamically allocate
      privileged stack after user stack", v4.4.0) moved dynamically
      allocated privileged stacks from the object base to the end of the
      user stack, but computed the end from the requested size.

      dynamic_object_create() places the privileged stack for a dynamically
      allocated user thread stack at ROUND_UP(data + size, obj_align), but
      the user buffer laid out by setup_thread_stack() spans
      K_THREAD_STACK_LEN(size) bytes: K_THREAD_STACK_RESERVED (the PMP
      stack guard) plus any power-of-two size rounding. On RISC-V with
      CONFIG_PMP_STACK_GUARD and CONFIG_PMP_POWER_OF_TWO_ALIGNMENT a
      4 KiB request yields an 8 KiB user object, and the privileged stack
      lands in its top half: every syscall and interrupt then writes kernel
      exception frames over the live user stack top - the thread's TLS area
      and any caller spill slots - so a user thread on an oversized dynamic
      stack corrupts itself as soon as it makes a syscall (observed as the
      syscall wrapper reloading a spilled argument as 0 and oopsing with
      "0 is not a valid k_thread").

      Place the privileged stack after the full K_THREAD_STACK_LEN(size)
      footprint instead. On MPU targets K_THREAD_STACK_RESERVED is 0 and
      the two expressions coincide, so only PMP-guarded configurations
      change. STACK_ELEMENT_DATA_SIZE() already budgets an extra
      Z_THREAD_STACK_OBJ_ALIGN(size) of slack, which covers the moved
      placement.
  - path: zephyr/tracing-ctf-forward-declare-zvfs-pollfd.patch
    sha256sum: 3a919118df16415c70a5c8ddad1d5d4c85a4e576c45d3e3f537acd4a30fcfadc
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-15
    upstreamable: true
    comments: |
      Forward-declare struct zvfs_pollfd in tracing_ctf.h to break fdtable→kernel→tracing include cycle.
  - path: zephyr/gen-syscalls-va-list-by-reference.patch
    sha256sum: c332aa43ae7b09852d43c21dc5368e4db7b102973c69df9518d018894f2ae142
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-13
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-signal.patch
    comments: |
      scripts: build: gen_syscalls: pass va_list arguments by reference. A
      va_list system-call argument (zsock_ioctl_impl(), zvfs_ioctl()) was
      va_copy()d into a register-sized union and its first word sent
      through the trap; the marshaller rebuilt a va_list from that word.
      That only works where a va_list is a pointer (riscv, arm, x86-32).
      On x86_64 and arm64 it is a struct or an array wider than a register,
      so the kernel read the remaining fields uninitialized - GCC 14
      diagnoses reg_save_area/overflow_arg_area as maybe-uninitialized in
      z_vrfy_zsock_ioctl_impl(), a build error under warnings-as-errors,
      and at run time va_arg() walked garbage. The wrapper now keeps the
      copy on the caller's stack and sends its address; the marshaller
      validates that object for reading, va_copy()s it into a local list
      for the verifier and va_end()s it afterwards.
  - path: zephyr/fs-ext2-serialize-operations.patch
    sha256sum: 2db31d79153050925c287da5fdb7b1e7101de3a85a2a80904b24d53a723d524f
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-30
    upstreamable: true
    comments: |
      Serialize every ext2 operation behind one lock: the driver was
      written assuming external serialization (static lookup buffers,
      shared block-fetch state) which concurrently running processes do
      not provide; racing lookups returned phantom ENOENTs. ext2 supports
      a single mounted instance, so a single lock suffices.
  - path: zephyr/fs-ext2-log-uuid-as-hex.patch
    sha256sum: a3c9c02fe0b6e124f49ca57e7d09ec63e4e986bb1e8645999ce1fef4bd50c78b
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-14
    upstreamable: true
    comments: |
      fs: ext2: log the file system UUID as hex. ext2_format() logged
      cfg->uuid with %s, but the UUID is 16 raw bytes - random ones when
      the caller sets none - neither text nor NUL-terminated: any byte at
      or above 0x80 put a non-UTF-8 byte on the console, which twister's
      byte-wise decoder reports as "unexpected byte" and fails the run,
      and the string ran into whatever followed the field in memory.
      About one format in two hit it, which made every ext2-backed suite
      (symbolic_links_fd, file_system) look load-flaky on every qemu
      platform. Format the UUID through bin2hex() into a stack buffer.
  - path: zephyr/disk-ramdisk-map-ram-region-only.patch
    sha256sum: d5c0e879ee820ca8fee25bdb8d9347d23d13184911193a09b4283f070418da04
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-10-04
    upstreamable: true
    comments: |
      Map a RAM disk under the MMU only when its buffer is a ram-region.
      A buffer declared in the image is already mapped and its address is
      virtual: mapping it again as a physical address is wrong where the
      two differ and otherwise costs a second virtual range the size of
      the disk, which a 4 MiB disk no longer finds in an 8 MiB kernel VM.

