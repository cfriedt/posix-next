  - path: zephyr/arm-cortex-m-decouple-exception-from-switch.patch
    sha256sum: afd69aa6da95808913e31d18001694df5d7cf0d9ace0462e72d7339ddb9ca725
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-18
    upstreamable: true
    comments: |
      Decouple <zephyr/arch/exception.h> from the Cortex-M context-switch
      machinery: factor the _EXC_* priority macros into cortex_m/cpu.h and stop
      cortex_m/exception.h from including arm-m-switch.h (and thus kernel/thread.h),
      restoring the cross-arch convention that v4.4.1's new arm-m-switch.h broke.
      Fixes '_EXC_IRQ_DEFAULT_PRIO undeclared' and the CONFIG_SIGNAL circular
      include on Cortex-M.
  - path: zephyr/kernel-dyn-stack-priv-placement.patch
    sha256sum: e5196f7246f6d2d70007d3c7499af90db152a46968545f102043847745fbfba1
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-04
    upstreamable: true
    comments: |
      kernel: userspace: place dynamic-stack privileged stacks past the object

      Upstream d6071319b53 ("kernel/userspace: Dynamically allocate
      privileged stack after user stack", v4.4.0) moved dynamically
      allocated privileged stacks from the object base to the end of the
      user stack, but computed the end from the requested size.

      dynamic_object_create() places the privileged stack for a dynamically
      allocated user thread stack at ROUND_UP(data + size, obj_align), but
      the user buffer laid out by setup_thread_stack() spans
      K_THREAD_STACK_LEN(size) bytes: K_THREAD_STACK_RESERVED (the PMP
      stack guard) plus any power-of-two size rounding. On RISC-V with
      CONFIG_PMP_STACK_GUARD and CONFIG_PMP_POWER_OF_TWO_ALIGNMENT a
      4 KiB request yields an 8 KiB user object, and the privileged stack
      lands in its top half: every syscall and interrupt then writes kernel
      exception frames over the live user stack top - the thread's TLS area
      and any caller spill slots - so a user thread on an oversized dynamic
      stack corrupts itself as soon as it makes a syscall (observed as the
      syscall wrapper reloading a spilled argument as 0 and oopsing with
      "0 is not a valid k_thread").

      Place the privileged stack after the full K_THREAD_STACK_LEN(size)
      footprint instead. On MPU targets K_THREAD_STACK_RESERVED is 0 and
      the two expressions coincide, so only PMP-guarded configurations
      change. STACK_ELEMENT_DATA_SIZE() already budgets an extra
      Z_THREAD_STACK_OBJ_ALIGN(size) of slack, which covers the moved
      placement.
  - path: zephyr/net-mgmt-test-wait-for-async-delivery.patch
    sha256sum: c2a1b0c7c3a5d05ea4c7774d7a7de1c328728e3cb2561211227eb98deac8ac7c
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-18
