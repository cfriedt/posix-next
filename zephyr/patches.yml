    comments: |
      Rebased onto v4.5.0-rc1, where upstream had renamed its getopt to sys_getopt_*: the Bluetooth, SSH,
      HTTP client, TFTP and iptables shells are converted to getopt_long_r()
      as well, and the OpenThread border router overlays select ZEPHYR_GETOPT_LONG.
      Remove CONFIG_GETOPT, CONFIG_GETOPT_LONG, CONFIG_SHELL_GETOPT, and lib/utils/getopt.
      Convert remaining sys_getopt callers to getopt_r() / getopt_long_r() and select
      ZEPHYR_GETOPT / ZEPHYR_GETOPT_LONG instead.
