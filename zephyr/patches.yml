  - path: zephyr/zvfs-eventfd-syscalls.patch
    sha256sum: 4cdf6b4427ebbf2cbee70e4dedf80b031809df91ef62717d173c5df69cad5b4a
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-07
    upstreamable: true
