<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="toybox running on Zephyr in a terminal">
<rect width="100%" height="100%" rx="10" fill="#1b1f24"/>
<rect width="100%" height="30" fill="#2b313a"/>
<circle cx="18" cy="15" r="6" fill="#ff5f57"/><circle cx="38" cy="15" r="6" fill="#febc2e"/><circle cx="58" cy="15" r="6" fill="#28c840"/>
<text x="480.0" y="20" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#aab">toybox on Zephyr — qemu_riscv64</text>
<g font-family="DejaVu Sans Mono, Liberation Mono, Menlo, Consolas, monospace" font-size="13" fill="#e6e6e6" xml:space="preserve">
<text x="14" y="56" fill="#9be28f">*** Booting Zephyr OS build v4.5.0-rc2 ***</text>
<text x="14" y="74" fill="#8fd3ff">$ toybox</text>
<text x="14" y="92" fill="#e6e6e6">[ ascii basename bash cat dirname echo egrep false fgrep grep head</text>
<text x="14" y="110" fill="#e6e6e6">ln ls mkdir ping ping6 printf pwd readlink rm rmdir sed seq sh test</text>
<text x="14" y="128" fill="#e6e6e6">toysh true uname vi wc</text>
<text x="14" y="146" fill="#8fd3ff">$ toybox uname -a</text>
<text x="14" y="164" fill="#e6e6e6">Zephyr zephyr 4.5.0-rc2 v4.5.0-rc2 Oct 17 2026 13:28:06 riscv Toybox</text>
<text x="14" y="182" fill="#8fd3ff">$ toybox ls -l /etc</text>
<text x="14" y="200" fill="#e6e6e6">total 0</text>
<text x="14" y="218" fill="#e6e6e6">-rwxrwxrwx 1 root root 10 1970-01-01 00:00 group</text>
<text x="14" y="236" fill="#e6e6e6">-rwxrwxrwx 1 root root 29 1970-01-01 00:00 motd</text>
<text x="14" y="254" fill="#e6e6e6">-rwxrwxrwx 1 root root 30 1970-01-01 00:00 passwd</text>
<text x="14" y="272" fill="#8fd3ff">$ toybox cat /etc/motd</text>
<text x="14" y="290" fill="#e6e6e6">Hello from toybox on Zephyr!</text>
<text x="14" y="308" fill="#e6e6e6">$</text>
<rect x="30" y="296" width="8" height="15" fill="#e6e6e6" opacity="0.8"/>
</g></svg>
