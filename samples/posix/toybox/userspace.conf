# SPDX-License-Identifier: Apache-2.0

# every toybox command is a user-mode process in its own memory domain, with
# the C library state (malloc arena, standard streams) of its own
CONFIG_USERSPACE=y
CONFIG_SYS_PROCESS_STATE_AREA=262144
# a system call stages the image, its arguments and the working directory
CONFIG_PRIVILEGED_STACK_SIZE=8192
# fork(): toysh subshells and background jobs, timeout(1)
CONFIG_PROCESS_VM=y
CONFIG_CURRENT_THREAD_USE_TLS=n
