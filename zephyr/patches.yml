  - path: zephyr/kernel-futex-per-object-wait-queues.patch
    sha256sum: b99625f8063618e2733cebe9346a79f1ae3c9eb4317912bf8c34e79453828193
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-10-03
    upstreamable: false
    comments: |
      Revert zephyr#110059 (158ebbd44c, "kernel: userspace: Support arbitrary futex addresses",
      in v4.5.0-rc1): restore the per-object futex wait queues, the k_futex kernel object metadata
      and the mem_protect futex tests of v4.4.1. posix-next carries its own futex variant on top of
      them (address-hashed wait queues for unregistered futexes, a waiter count, priority
      inheritance through sys_mutex), which the following patches build; which of the two designs
      survives is settled when that work is upstreamed, so this revert is not for upstream.
  - path: zephyr/sys-sem-track-blocked-waiters.patch
    sha256sum: 01272b01ede4bf6d68c4f87faf0167b172d0401b66e36799a56b725d1dc77d17
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-09
    upstreamable: true
    comments: |
      Rebased onto v4.5.0-rc1 (on the restored per-object futex): sys_sem lives in kernel/userspace/sem.c
      and kernel/sys/sem.c there.
      Track whether any thread is blocked taking a sys_sem and expose it
      as sys_sem_has_waiters(). The kernel maintains the count in every
      k_futex: it is incremented under the wait-queue lock before the
      value compare and decremented by whoever unblocks the thread, the
      waker in k_futex_wake() or the thread itself on timeout, still inside
      the system call. A woken thread therefore never touches the futex
      again, which makes it safe to destroy a semaphore right after the
      give that released its last waiter. Without userspace the k_sem wait
      queue is peeked. The answer is a snapshot intended as a hint, e.g. for
      POSIX sem_destroy() EBUSY detection, which lets sem_t be exactly
      struct sys_sem and the POSIX semaphore layer be a thin spelling
      adapter over the sys_sem API.
  - path: zephyr/futex-wait-at-any-user-accessible-address.patch
    sha256sum: 9950d1bd5efed9776fc2101e9b8f861a85d130bc07d8735f2cd8777cd1664fa1
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-09
    upstreamable: false
    custom:
      upstream:
        depends-on:
          - zephyr/sys-sem-track-blocked-waiters.patch
    comments: |
      Rebased onto v4.5.0-rc1 on top of kernel-futex-per-object-wait-queues, which restores the v4.4.1 futex
      this variant extends; the implementation lives in kernel/userspace/futex.c there.
      k_futex_wait() resolved its wait queue through the kernel object
      table, so only statically-defined futexes - the ones the kernel
      object scanner can see - were waitable; a futex on a stack or in
      heap memory failed with -EINVAL even for supervisor callers, and
      only under contention, since uncontended operations never enter the
      kernel. Fall back to a small fixed array of address-hashed wait
      queues for unregistered futexes, in the manner of Linux: waiters
      record the futex address and wake-ups unpend only matching waiters,
      in priority order, so sharing a bucket costs lock contention but
      never a lost or spurious wakeup. Statically-defined futexes keep
      their dedicated wait queues. Update the mem_protect/futex testsuite
      cases that asserted -EINVAL for user-accessible non-kobject
      addresses to assert the new pend/no-waiter behavior instead.

      This lifts the static-allocation restriction from sys_sem and
      everything built on it, notably POSIX sem_t.

      Inspired by upstream PR #110059, which fixes the same issue with a
      single global wait queue and the awaited address in the thread
      struct, but the implementation here varies quite differently and it
      is not clear if this is a candidate for upstreaming.
  - path: zephyr/k-obj-map-size.patch
    sha256sum: a490528e70769c7d22d9029f19b972603270dc4acbead1c98f761f9e0b25a3df
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-05-10
