# SPDX-License-Identifier: Apache-2.0

CONFIG_BUSYBOX=y

CONFIG_POSIX_AEP_CHOICE_PSE53=y
# PSE53 without the queues, shared memory and packet sockets the shell never uses
CONFIG_POSIX_MESSAGE_PASSING=n
CONFIG_POSIX_SHARED_MEMORY_OBJECTS=n
CONFIG_POSIX_RAW_SOCKETS=n
CONFIG_POSIX_JOB_CONTROL=y
CONFIG_POSIX_EXEC_LLEXT=y
CONFIG_POSIX_DEVICE_SPECIFIC=y
CONFIG_POSIX_DEVICE_SPECIFIC_R=y
CONFIG_POSIX_FILE_SYSTEM_GLOB=y
CONFIG_POSIX_FILE_ATTRIBUTES=y
CONFIG_POSIX_REGEXP=y
CONFIG_POSIX_SYMBOLIC_LINKS=y
CONFIG_POSIX_SYSTEM_DATABASE=y
CONFIG_POSIX_USER_GROUPS=y
CONFIG_POSIX_USER_GROUPS_R=y

CONFIG_XSI=y
CONFIG_XSI_SINGLE_PROCESS=y
CONFIG_XSI_STREAMS=y

CONFIG_LLEXT=y
CONFIG_POSIX_LLEXT_SYMBOLS=y
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y
CONFIG_LLEXT_HEAP_SIZE=2048

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_EXT2=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_RAM=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ZVFS_STDIN_CONSOLE=y

CONFIG_SYS_PROCESS_MAX=8
CONFIG_SYS_THREAD_STACK_SIZE=8192
CONFIG_SYS_PROCESS_ARG_BYTES=1024
CONFIG_POSIX_EXEC_ARGS_MAX=32
CONFIG_HEAP_MEM_POOL_SIZE=524288
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=131072

# room for multi-stage pipelines: several simultaneous pipes plus the
# shell's stdio, ext2, and cwd descriptors
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_PROC_OPEN_MAX=16
CONFIG_ZVFS_PIPE_MAX=8
CONFIG_ZVFS_OPEN_ADD_SIZE_PIPE=16
CONFIG_MAIN_STACK_SIZE=16384
