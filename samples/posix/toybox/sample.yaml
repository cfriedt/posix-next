sample:
  description: run toybox commands as processes exec'd from an ext2 file system
  name: posix toybox
common:
  tags:
    - posix
    - exec
    - llext
  build_only: false
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "hello world"
      - "Hello from toybox on Zephyr!"
      - "motd"
      - "bytes from 127[.]0[.]0[.]1"
      - "toybox sample complete"
  timeout: 180
tests:
  sample.posix.toybox:
    # 32-bit targets need an off_t story for toybox's _FILE_OFFSET_BITS=64 first
    platform_allow:
      - qemu_cortex_a53
      - qemu_riscv64
    integration_platforms:
      - qemu_riscv64
