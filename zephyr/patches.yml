      mirror zvfs_fd_set and declare FD_CLR(), FD_ISSET(), FD_SET(), and FD_ZERO()
      as functions instead of libc macros over an incompatible bit-array fd_set.
  - path: zephyr/minimal-libc-fread.patch
    sha256sum: 74158863087981a2854e59eeb90390c4cf26129f90848c1da4343d2e2ee10840
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-06-30
    upstreamable: true
    comments: |
      Implement fread() for minimal libc on ZVFS-backed FILE streams, mirroring the
      existing fwrite() path. Adds zephyr_fread() syscall hook for userspace builds.
  - path: zephyr/zvfs-pread-pwrite-regular-files.patch
    sha256sum: 326074ba8d5ab39bba9ddb7c46b79d6d5498bee456d0d2b9ecc65b16cd799d9c
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-01
    upstreamable: true
    comments: |
      Allow pread() and pwrite() on ZVFS-backed regular files via the existing
      fs read_offs and write_offs vtable methods, restoring the underlying file
      position after offset I/O so lseek(SEEK_CUR) is unchanged.
  - path: picolibc/tinystdio-fgetpos-fsetpos.patch
    sha256sum: 5fcf090847b930dff1a2da52e6e24711a64c37d428be9e0db7ba8cd92348dcaa
    module: picolibc
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-08
    upstreamable: true
    comments: |
      Add fgetpos.c, fsetpos.c, and flockfile_init.c to the picolibc tinystdio CMake
      build (already listed in meson.build). Without these, native_sim resolves
      fgetpos()/fsetpos() from host glibc against picolibc FILE objects and hangs.
      Also expose the tinystdio source directory for stdio_private.h includes.
  - path: zephyr/minimal-libc-fseek.patch
    sha256sum: 323611afba98459c2ec3dce86cb7eee20d3f32bf20a0dc29a79817826d71f0d7
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-04
    upstreamable: true
    comments: |
      Implement C89 stdio positioning for minimal libc on ZVFS-backed FILE streams:
      clearerr(), fgetpos(), fseek(), fsetpos(), ftell(), and rewind(). Required for
      POSIX_FD_MGMT when CONFIG_MINIMAL_LIBC is selected (fseeko()/ftello() live in
      posix-next fd_mgmt and delegate to fileno()/lseek()).
  - path: zephyr/zvfs-dup.patch
    sha256sum: 7046e7f378bd413eb818ea4b81be5677216088f4e663708db73d0f6f98601d77
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-06-30
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/zvfs-poll-no-poll-support.patch
    comments: |
      Rebased onto v4.5.0-rc1: zvfs_close() keeps upstream's zvfs_socket_close_hook().
      Add zvfs_dup() and zvfs_dup2() with F_DUPFD fcntl support and refcount-aware
      close when multiple file descriptors share the same underlying object.
  - path: zephyr/zvfs-fcntl-getfd-setfd.patch
    sha256sum: d6f00bb60043d21800255f85c038e245e9e3fb16f3eed4e1e06f2f16ad64dfe1
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-06-30
    upstreamable: true
    comments: |
      Add per-fd descriptor flags to the ZVFS fd table and implement fcntl()
      F_GETFD, F_SETFD, and F_DUPFD_CLOEXEC.
  - path: zephyr/zvfs-fcntl-record-lock.patch
    sha256sum: 4dca4576b13f710bb36091890668abb023003e2619d31c07b7c17f646c06ed40
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-06-30
    upstreamable: true
    comments: |
      Implement POSIX advisory record locking via fcntl() F_GETLK, F_SETLK, and
      F_SETLKW for ZVFS-backed regular files, with libc fcntl command normalization.
  - path: zephyr/zvfs-stdio-fcntl.patch
    sha256sum: 45b34bd4fb393fd17e777a60a81f6368475aba3c36eb50d1fe93b0a9edef6b08
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-30
    upstreamable: true
    comments: |
      Answer F_GETFL (O_RDWR) and accept F_SETFL on the reserved stdio
      descriptors; busybox printf probes fcntl(1, F_GETFL) and treats
      failure as a closed stdout, exiting silently.
  - path: zephyr/libc-stdio-fd-backed-standard-streams.patch
    sha256sum: 93b7f7402b415f173e63e46b555f458978d388875d871f508b3420f760c333d3
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-02
    upstreamable: true
    comments: |
      Route the standard streams through the reserved ZVFS descriptors
      (0/1/2) under CONFIG_ZVFS_RESERVE_STDIO_FDS instead of the console
      hook, so dup2() redirection of stdin/stdout/stderr onto pipes or
      files (as posix_spawn() file actions do) is honored. Picolibc
      stdio.c gains fd-backed put/get; minimal libc stops special-casing
      fds 1/2 to the console and fd 0 to EOF (MINIMAL_STDIO_FD_MIN).
      Newlib already routes through the POSIX device_io write/read aliases
      and needs no change.
  - path: zephyr/kernel-dyn-stack-alloc-align.patch
    sha256sum: ad11516f5882b58b5769c52762d61ae58930827a722a2f63cdc779a4af3c4ab1
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-10-17
    upstreamable: true
    comments: |
      kernel: userspace: align dynamic user stacks to their own object alignment

      dynamic_object_create() allocates the buffer of a dynamic thread stack
      aligned to DYN_OBJ_DATA_ALIGN_K_THREAD_STACK, the object alignment of
      CONFIG_DYNAMIC_THREAD_STACK_SIZE, whatever size was requested. On
      architectures with CONFIG_MPU_REQUIRES_POWER_OF_TWO_ALIGNMENT (ARMv7-M,
      ARMv7-R) the object alignment of a stack is its power-of-two size, so a
      user stack larger than the default is only aligned to the default size
      and the MPU region programmed for it does not cover it. Whether the
      thread then faults depends on where the heap happened to place the
      buffer: on mps2/an385 and qemu_cortex_r5 a user thread on a stack of
      twice the default size takes an MPU stacking fault on its first
      exception.

      Align the buffer to the larger of the default alignment and the
      requested size's own object alignment. On every other architecture the
      two are equal and nothing changes. STACK_ELEMENT_DATA_SIZE() already
      reserves Z_THREAD_STACK_OBJ_ALIGN(size) of slack, so the privileged
      stack placed at ROUND_UP(data + K_THREAD_STACK_LEN(size), obj_align)
      still fits; with an aligned buffer the ROUND_UP is exact.

      Found through zephyr#122510, whose dynamic_thread_stack test allocates
      user stacks of twice CONFIG_DYNAMIC_THREAD_STACK_SIZE and faults on
      exactly the two power-of-two MPU platforms in CI.
  - path: zephyr/disk-ramdisk-map-ram-region-only.patch
    sha256sum: 48fd57b3139498bd035faf47dbecfdd5d7c6954477a1a28d5254069b79332cca
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-10-04
    upstreamable: true
    comments: |
      Map a RAM disk under the MMU only when its buffer is a ram-region.
      A buffer declared in the image is already mapped and its address is
      virtual: mapping it again as a physical address is wrong where the
      two differ and otherwise costs a second virtual range the size of
      the disk, which a 4 MiB disk no longer finds in an 8 MiB kernel VM.

  - path: zephyr/fs-ext2-log-uuid-as-hex.patch
    sha256sum: bcdb807bcfe9d418bfc1dfb57a0474924b88165bffb048950f428350f0284e01
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-14
    upstreamable: true
    comments: |
      fs: ext2: log the file system UUID as hex. ext2_format() logged
      cfg->uuid with %s, but the UUID is 16 raw bytes - random ones when
      the caller sets none - neither text nor NUL-terminated: any byte at
      or above 0x80 put a non-UTF-8 byte on the console, which twister's
      byte-wise decoder reports as "unexpected byte" and fails the run,
      and the string ran into whatever followed the field in memory.
      About one format in two hit it, which made every ext2-backed suite
      (symbolic_links_fd, file_system) look load-flaky on every qemu
      platform. Format the UUID through bin2hex() into a stack buffer.
  - path: zephyr/fs-ext2-serialize-operations.patch
    sha256sum: 377050a98462ff65c30e8bb68008ec0ad020b66f9750eb58c5d4c71d04ae1f41
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-30
    upstreamable: true
    comments: |
      Serialize every ext2 operation behind one lock: the driver was
      written assuming external serialization (static lookup buffers,
      shared block-fetch state) which concurrently running processes do
      not provide; racing lookups returned phantom ENOENTs. ext2 supports
      a single mounted instance, so a single lock suffices.
  - path: zephyr/riscv-mmu-support.patch
    sha256sum: 483b489a580a56b5762e1eb528011513c7db735ef68c57cf8567e7bde6eb0da8
    module: zephyr
    author: Alexios Lyrakis
    email: alexios.lyrakis@gmail.com
    date: 2026-08-28
    merge-pr: https://github.com/zephyrproject-rtos/zephyr/pull/105403
    comments: |
      Resynced 2026-10-03 with the head of zephyr#105403 (fdbbeedf89, 2026-09-30) rebased onto
      v4.5.0-rc1: six commits adding Sv39/Sv48 MMU support, the qemu_riscv64 S-mode/MMU boot and
      Sv48 board variant, the MEM_REGION_ALLOC test case and the architecture documentation. The
      S-mode and SBI groundwork of the earlier snapshot is in v4.5.0-rc1 itself.
      Adapted to v4.5.0-rc1: k_mem_domain_default is created by a kernel pre-init hook before the
      PRE_KERNEL_1 arch_mem_init(), so partition mapping is deferred while kernel_root_table is
      NULL and replayed once the domain root has been patched with the kernel tables (the PR's
      memcpy alone drops the libc partition). The earlier adaptations are kept: RISCV_MMU
      default y, read-only stack guard pages, PRIVILEGED_STACK_SIZE 4096.
      Backport RISC-V MMU support (zephyr#105403): CONFIG_RISCV_MMU with
      Sv39/Sv48 page tables, per-domain ASID-tagged root tables, userspace
      and memory-domain isolation, MMU stack guards, arch_mem_map/unmap/
      arch_page_phys_get, and the qemu_riscv64 smode/sv48 MMU board
      variants. RV64-only (no Sv32); no demand paging. Adaptations:
      dropped the virt-riscv-plic.dtsi include (PLIC is still inline in the
      shared QEMU virt dtsi) and omitted main-only PMP_DATA_EXECUTION_PREVENTION
      Kconfig context. RISCV_MMU defaults y (its dependencies already require
      an S-mode kernel and every enabled hart declaring MMU hardware in the
      devicetree, so platforms with an MMU enable it by default, matching
      other architectures). Adds PRIVILEGED_STACK_SIZE default 4096 under RISCV_MMU
      (mirrors X86_MMU): the guard+priv reservation is page-rounded so a 1024B
      priv stack wastes the rest of the page, and 1024B overflows into the
      guard page on deeper syscall paths (k_mem_map from sys_thread_stack_alloc),
      which fault-storms at trap entry with no diagnosable backtrace. Stack
      guard pages are made read-only (W/X/U cleared, V kept) instead of
      unmapped, mirroring x86's z_x86_set_stack_guard(): stores still fault as
      overflow, and mem-mapped dynamic stack objects stay fully resolvable so
      k_mem_unmap_phys_guard() can free their page frames at thread destroy
      (V=0 tripped its "cannot unmap an unmapped address" assert).
      The PLIC register windows that the interrupt controller driver addresses
      physically are identity-mapped beside the console UART.
      Rebased onto v4.5.0-rc2 (2026-10-15): the privileged-stack painting that skips the guard
      region is upstream (5a7b28425ae), so the patch no longer touches it.
  - path: zephyr/riscv-mmu-domain-mappings.patch
    sha256sum: fad4314cf72a5a1134a33f300b283584ed011a1f6cf278e5d43385bc13e75ddf
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-13
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/riscv-mmu-support.patch
    comments: |
      riscv: mmu: keep memory-domain mappings in step with the kernel's. Two
      fixes to the backported MMU (zephyr#105403), for memory that is mapped
      rather than identity-mapped, such as a thread stack from k_mem_map().
      Domain tables mapped user ranges (partitions, user stacks) at virt ==
      phys, so a user thread on a mapped stack saw a different page than the
      kernel did: the user-mode flag the kernel set in its TLS read 0, the
      inline system call wrapper concluded it was in kernel context and
      dereferenced kernel data. User ranges are now mapped page by page at
      the frames the kernel tables hold. And kernel leaf mappings made after
      a domain privatized the covering leaf table were never propagated
      (upstream syncs only new L0/L1 entries): arch_mem_map()/arch_mem_unmap()
      now mirror the changed leaves into every domain's private leaf tables,
      leaving leaves that carry PTE_USER (the domain's own) alone, so that
      late mappings stay reachable while a domain SATP is active - a trap
      from user mode stores into the privilege stack before switching SATP.
  - path: zephyr/intc-plic-supervisor-context.patch
    sha256sum: 5ffcbaee49fe80299952d5ac27b2c1a8848af28d4c2b22dca016a24568c7f3a7
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-10-05
    upstreamable: true
    comments: |
      drivers: intc: plic: use the supervisor hart context under RISCV_S_MODE

      The driver connects the PLIC to the first interrupt of its
      interrupts-extended list, the machine external interrupt, and takes
      the hart contexts listed with that number. A kernel built for
      supervisor mode never sees machine interrupts: connect the supervisor
      external interrupt and use the supervisor contexts instead, so that
      external interrupts (virtio-net on qemu_riscv64) reach the kernel.

  - path: zephyr/boards-qemu-riscv64-smode-default.patch
    sha256sum: a9a982cc753d1fc04cf10c58395204c06225c20579f78ae2dddea5278173070a
