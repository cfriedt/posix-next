common:
  filter: not CONFIG_NATIVE_LIBC
  tags:
    - xsi_realtime
  # 1 tier0 platform per supported architecture
  platform_key:
    - arch
    - simulation
  min_flash: 64
  min_ram: 96
  integration_platforms:
    - qemu_x86
    - qemu_cortex_a53
    - qemu_riscv64
  platform_exclude:
    # linker_zephyr_pre0.cmd:140: syntax error (??)
    - qemu_xtensa/dc233c
tests:
  portability.posix.xsi_realtime: {}
  portability.posix.xsi_realtime.userspace:
    filter: CONFIG_ARCH_HAS_USERSPACE
    tags: userspace
    min_ram: 160
    extra_configs:
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
  portability.posix.xsi_realtime.minimal:
    extra_configs:
      - CONFIG_MINIMAL_LIBC=y
  portability.posix.xsi_realtime.newlib:
    filter: TOOLCHAIN_HAS_NEWLIB == 1
    extra_configs:
      - CONFIG_NEWLIB_LIBC=y
  portability.posix.xsi_realtime.picolibc:
    tags: picolibc
    filter: CONFIG_PICOLIBC_SUPPORTED
    extra_configs:
      - CONFIG_PICOLIBC=y
  # fails: asserts Zephyr's ENOSYS sched_*() stubs, which the host libc implements
  # portability.posix.xsi_realtime.linux_compat:
