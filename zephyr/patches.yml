  - path: zephyr/sys-timepoint-user-callable.patch
    sha256sum: 24ea764b9ed9515fda655f76c47649738309ac8eb5d7db04419fd0fb1525701d
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-04-25
    upstreamable: true
    comments: |
      Make the timepoint API safe to call from user mode.
      sys_timepoint_calc() and sys_timepoint_timeout() are executed in
      the caller's context (the POSIX layer computes deadlines for
      sem_timedwait() and friends from user threads), but their bodies
      in kernel/timeout.c read the tick counter under timeout_lock,
      faulting any user-mode caller. Move the timepoint helpers inline
      into kernel.h, reading ticks through the existing k_uptime_ticks()
      syscall: they then compile in the caller's domain, so kernel
      callers keep the direct tick read and user-compiled callers trap
      for the tick and do the arithmetic on their own stack.
      sys_clock_tick_get() stays a kernel-internal function - no second
      syscall for the same value. This replaces an earlier approach that
      compiled timeout.c a second time without __ZEPHYR_SUPERVISOR__,
      which produced duplicate definitions under LLEXT's whole-archive
      kernel linking.
  - path: zephyr/arm-mpu-priv-stack-wrn.patch
    sha256sum: 7aac0e495b033b20851a47f9d0a3c0843af4f81d771fa8d14c57386e9fbcd8ce
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-05-04
    upstreamable: true
    comments: |
      No other zephyr architectures assert on assumptions about where userspace thread
      stacks lie in memory. While it's true that statically allocated thread stacks are
      in specific regions, dynamically allocated stacks could be anywhere. Older ARM MPUs
      have fairly stringent requirements on power-of-two size and alignment of MPU regions,
      so the concern is warranted, but downgrade it to a LOG_WRN_ONCE() so that zephyr code
      that is hardware agnostic can still be coherent with other architectures.
