manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  # zephyr-keep-sorted-start re(^\s+\- name:)
  projects:
    - name: busybox
      url: https://github.com/cfriedt/busybox
      revision: 15666f3e9a0b54305cec1b01f34bc5b2a1794e74
      path: modules/lib/busybox
    - name: toybox
      url: https://github.com/cfriedt/toybox
      revision: 498db90f2513d17429536b82a53fd45b64935909
      path: modules/lib/toybox
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.5.0-rc1
      import:
        name-allowlist:
          - cmsis_6
          - fatfs
          - hostap
          - littlefs
          - mbedtls
          - picolibc
          - tf-psa-crypto
          - zcbor
  # zephyr-keep-sorted-stop

  self:
    path: modules/lib/posix
