common:
  tags:
    - posix_non_portable
  min_ram: 64
  platform_key:
    - arch
    - simulation
tests:
  portability.posix.non_portable:
    filter: not CONFIG_NATIVE_LIBC
  portability.posix.non_portable.userspace:
    filter: (not CONFIG_NATIVE_LIBC) and CONFIG_ARCH_HAS_USERSPACE
    tags: userspace
    extra_configs:
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
  portability.posix.non_portable.linux_compat:
    tags: native
    platform_allow:
      - native_sim
      - native_sim/native/64
    filter: CONFIG_NATIVE_LIBC
    extra_configs:
      - CONFIG_POSIX_TEST_LINUX_COMPAT=y
