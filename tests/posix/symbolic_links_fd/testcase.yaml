common:
  tags:
    - ext2
    - posix_symbolic_links_fd
  min_ram: 128
  # 1 tier0 platform per supported architecture
  platform_key:
    - arch
    - simulation
tests:
  portability.posix.symbolic_links_fd:
    filter: not CONFIG_NATIVE_LIBC
  portability.posix.symbolic_links_fd.userspace:
    filter: (not CONFIG_NATIVE_LIBC) and CONFIG_ARCH_HAS_USERSPACE
    tags: userspace
    min_ram: 160
    extra_configs:
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
      - platform:mps2/an385:CONFIG_TEST_USERSPACE_WITHOUT_HW_STACK_PROTECTION=y
      # ext2 symlink resolution runs deep on the syscall side
      - platform:qemu_riscv32/qemu_virt_riscv32:CONFIG_PRIVILEGED_STACK_SIZE=2048
  portability.posix.symbolic_links_fd.linux_compat:
    tags: native
    platform_allow:
      - native_sim
      - native_sim/native/64
    filter: CONFIG_NATIVE_LIBC
    extra_configs:
      - CONFIG_POSIX_TEST_LINUX_COMPAT=y
