  - path: zephyr/zvfs-poll-no-poll-support.patch
    sha256sum: c718cea7d21b5ffa5d87c8adfcbb24cb9b95218ff803c87deefad805caaa825e
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-01
    upstreamable: true
    comments: |
      lib: os: zvfs: poll fds whose backends have no poll support

      poll() on a descriptor whose backend implements no poll ioctls
      (regular files, shared memory, message queues, directories, and
      the stdio slots) failed with a garbage errno: the vmethod's -1
      return was negated into errno as EPERM. POSIX requires that
      regular files always poll readable and writable.

      Classify such descriptors by their fd entry mode: IFREG, IFSHM,
      IFBLK, IFCHR, IFDIR, and IMSGQ have no waitable condition and are
      reported ready for input and output immediately, without
      consulting the backend. The stdio slots, previously untyped, are
      now typed IFCHR. Backends that do implement the poll ioctls
      (sockets, eventfd, socketpair) are unaffected: eventfd finalizes
      untyped and continues through the ioctl path.

      The per-fd prepare and update steps move into zvfs_poll_prepare_fd()
      and zvfs_poll_update_fd(), internal single-descriptor helpers that
      zvfs_poll_internal() now loops over, so the classification exists
      in exactly one place and kernel services can arm readiness waits
      on a single descriptor (e.g. with k_work_poll) without a pollfd
      array of their own.
  - path: zephyr/fs-fatfs-rewinddir-utime.patch
    sha256sum: 4c22061022bf2852c7400765ec7bafe0a77d673620a6e08a92a4c93b7f07e999
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-07
    upstreamable: true
    comments: |
      Back fs_rewinddir() on FatFs with f_readdir(dp, NULL) and fs_utime()
      with f_utime() behind a new CONFIG_FS_FATFS_FF_USE_CHMOD (mapped to
      FF_USE_CHMOD in zephyr_fatfs_config.h). Under CONFIG_FS_DIRENT_EXT,
      stat and readdir results carry the modification timestamp, converted
      from the FAT date fields with timeutil_timegm64(); the write path uses
      gmtime_r() per the existing subsys precedent. FAT records no access
      time, so atime mirrors mtime, and timestamps outside 1980-2107 are
      rejected with -EINVAL. Covered by a new
      filesystem.fat.api.dirent_ext scenario whose test round-trips an
      explicit timestamp through the conversion and exercises rewinddir.
  - path: zephyr/fs-littlefs-rewinddir.patch
    sha256sum: fc13b868ee9295c39500cf4b0f33e63bb50d0a913bf9875824ba50fa2abdf2c3
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
