common:
  tags:
    - posix_spawn
  platform_key:
    - arch
    - simulation
  min_flash: 64
  min_ram: 32
tests:
  portability.posix.spawn:
    filter: not CONFIG_NATIVE_LIBC
    integration_platforms:
      - qemu_riscv64
      - qemu_cortex_m3
      - qemu_x86
  portability.posix.spawn.userspace:
    filter: (not CONFIG_NATIVE_LIBC) and CONFIG_ARCH_HAS_USERSPACE
    tags: userspace
    extra_configs:
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
      - CONFIG_ZTEST_FATAL_HOOK=y
      # a user caller clones on its privileged stack
      - CONFIG_PRIVILEGED_STACK_SIZE=4096
  # images loaded from the file system by the kernel into the paused child
  portability.posix.spawn.llext:
    tags: llext
    platform_allow:
      - qemu_cortex_a53
      - qemu_riscv32
      - qemu_riscv64
      - qemu_x86
      - qemu_x86_64
    integration_platforms:
      - qemu_x86
      - qemu_riscv64
    extra_configs:
      - CONFIG_LLEXT=y
      - CONFIG_POSIX_EXEC_LLEXT=y
      - CONFIG_FILE_SYSTEM=y
      - CONFIG_FAT_FILESYSTEM_ELM=y
      - CONFIG_FS_FATFS_LFN=y
      - CONFIG_DISK_ACCESS=y
      - CONFIG_DISK_DRIVER_RAM=y
      - CONFIG_FILE_SYSTEM_MKFS=y
      - CONFIG_FS_FATFS_MOUNT_MKFS=y
      - CONFIG_POSIX_FILE_SYSTEM=y
      - CONFIG_SYS_PROCESS_STATE_AREA=4096
      # the mount-time format runs on the test thread
      - CONFIG_ZTEST_STACK_SIZE=4096
      - CONFIG_MAIN_STACK_SIZE=4096
      # the leader stages the vectors and the working directory on its own
      # stack before the image runs: a no-MMU 1 KiB pool stack is too small
      - CONFIG_SYS_THREAD_STACK_SIZE=4096
      - CONFIG_LLEXT_HEAP_SIZE=64
      - CONFIG_HEAP_MEM_POOL_SIZE=65536
  # the same images entered as user-mode processes with their own domains
  portability.posix.spawn.llext.userspace:
    tags:
      - llext
      - userspace
    platform_allow:
      - mps2/an385
      - qemu_cortex_a53
      - qemu_riscv64
      - qemu_x86
      - qemu_x86_64
    integration_platforms:
      - qemu_x86
      - qemu_riscv64
    extra_configs:
      - CONFIG_LLEXT=y
      - CONFIG_POSIX_EXEC_LLEXT=y
      - CONFIG_FILE_SYSTEM=y
      - CONFIG_FAT_FILESYSTEM_ELM=y
      - CONFIG_FS_FATFS_LFN=y
      - CONFIG_DISK_ACCESS=y
      - CONFIG_DISK_DRIVER_RAM=y
      - CONFIG_FILE_SYSTEM_MKFS=y
      - CONFIG_FS_FATFS_MOUNT_MKFS=y
      - CONFIG_POSIX_FILE_SYSTEM=y
      - CONFIG_SYS_PROCESS_STATE_AREA=4096
      # the mount-time format runs on the test thread
      - CONFIG_ZTEST_STACK_SIZE=4096
      - CONFIG_MAIN_STACK_SIZE=4096
      - CONFIG_LLEXT_HEAP_SIZE=64
      - CONFIG_HEAP_MEM_POOL_SIZE=65536
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
      - CONFIG_ZTEST_FATAL_HOOK=y
      # a user caller clones and loads the image on its privileged stack
      - CONFIG_PRIVILEGED_STACK_SIZE=8192
  # fails: spawns prelinked Zephyr thread images via the image registry, which the host libc cannot run
  # portability.posix.spawn.linux_compat:
  #   tags: native
  #   platform_allow:
  #     - native_sim
  #     - native_sim/native/64
  #   filter: CONFIG_NATIVE_LIBC
  #   extra_configs:
  #     - CONFIG_POSIX_TEST_LINUX_COMPAT=y
      - platform:mps2/an385:CONFIG_TEST_USERSPACE_WITHOUT_HW_STACK_PROTECTION=y
