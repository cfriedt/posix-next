common:
  tags:
    - xsi_realtime
  # 1 tier0 platform per supported architecture
  platform_key:
    - arch
    - simulation
  min_flash: 64
  min_ram: 96
  platform_exclude:
    # linker_zephyr_pre0.cmd:140: syntax error (??)
    - qemu_xtensa/dc233c
tests:
  portability.posix.xsi_realtime:
    integration_platforms:
      - qemu_x86
      - qemu_cortex_a53
      - qemu_riscv64
    filter: not CONFIG_NATIVE_LIBC
  portability.posix.xsi_realtime.minimal:
    integration_platforms:
      - qemu_x86
      - qemu_cortex_a53
      - qemu_riscv64
    filter: not CONFIG_NATIVE_LIBC
    extra_configs:
      - CONFIG_MINIMAL_LIBC=y
  portability.posix.xsi_realtime.newlib:
    integration_platforms:
      - qemu_x86
      - qemu_cortex_a53
      - qemu_riscv64
    filter: (not CONFIG_NATIVE_LIBC) and (TOOLCHAIN_HAS_NEWLIB == 1)
    extra_configs:
      - CONFIG_NEWLIB_LIBC=y
  portability.posix.xsi_realtime.picolibc:
    integration_platforms:
      - qemu_x86
      - qemu_cortex_a53
      - qemu_riscv64
    tags: picolibc
    filter: (not CONFIG_NATIVE_LIBC) and CONFIG_PICOLIBC_SUPPORTED
    extra_configs:
      - CONFIG_PICOLIBC=y
  portability.posix.xsi_realtime.linux_compat:
    tags: native
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    filter: CONFIG_NATIVE_LIBC
    extra_configs:
      - CONFIG_POSIX_TEST_LINUX_COMPAT=y
