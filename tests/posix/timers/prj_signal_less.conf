# The reduced mode: kernel timers without signal-based expiry notification
# (CONFIG_TIMER_SIGNAL=n). SIGEV_NONE timers remain fully functional; notifying
# sigevent types report ENOTSUP and timer_getoverrun() reports 0.
#
# Note: CONFIG_SIGNAL itself cannot be disabled in a POSIX configuration --
# POSIX_BASE_DEFINITIONS mandates POSIX_REALTIME_SIGNALS/POSIX_THREADS (Issue 8),
# which select it. CONFIG_TIMER_SIGNAL=n is the reachable reduced mode and
# subsumes the CONFIG_SIGNAL=n kernel behavior at this layer.
CONFIG_ZTEST=y

CONFIG_POSIX_AEP_CHOICE_PSE51=y
CONFIG_POSIX_TIMERS=y
CONFIG_TIMER_SIGNAL=n

CONFIG_SYS_TIMER_MIN_ADD_TEST=2
CONFIG_SYS_THREAD_STACK_MIN_ADD_TEST=3
CONFIG_SYS_THREAD_THREAD_MIN_ADD_TEST=3
