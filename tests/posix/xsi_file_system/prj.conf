CONFIG_ZTEST=y

CONFIG_POSIX_AEP_CHOICE_BASE=y
CONFIG_XSI=y
CONFIG_XSI_FILE_SYSTEM=y
# the group stands alone: the suite observes through ZVFS, not POSIX_FILE_SYSTEM
CONFIG_POSIX_FILE_SYSTEM=n

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_TMPFS=y

CONFIG_EVENTFD=n

# stdio (3) + a lock test file + the walk's directory streams
CONFIG_ZVFS_OPEN_IGNORE_MIN=y
CONFIG_ZVFS_OPEN_MAX=12
CONFIG_ZVFS_DIR_MAX=4

CONFIG_MAIN_STACK_SIZE=4096
# realpath() and the tree walk keep PATH_MAX buffers per level
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_TEST_EXTRA_STACK_SIZE=4096

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384
