CONFIG_ZTEST=y

CONFIG_POSIX_AEP_CHOICE_BASE=y
CONFIG_POSIX_MULTI_PROCESS=y
CONFIG_POSIX_DEVICE_IO=y
CONFIG_POSIX_EXEC_LLEXT=y
# small enough for the table-full and stale-slot-sweep sections to fill
CONFIG_POSIX_EXEC_LLEXT_MAX=2

CONFIG_LLEXT=y
CONFIG_LLEXT_HEAP_SIZE=16

CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y

CONFIG_SYS_PROCESS_MAX=4
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384

# base scenarios execute-from-RAM without an MPU; the .mpu scenario turns it
# back on together with CONFIG_USERSPACE (unknown-symbol =n is a no-op)
CONFIG_ARM_MPU=n
