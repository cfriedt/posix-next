# the board maps 8 MiB by default: the guest image, its copy in the file
# system and the heap it is loaded into need more
CONFIG_KERNEL_VM_SIZE=0x4000000
CONFIG_MAX_XLAT_TABLES=64
# Linux executables use the floating-point registers (lp64d)
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
