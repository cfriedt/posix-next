  - path: zephyr/k-thread-cleanup.patch
    sha256sum: 1193468ae4a437d85920e22e600e3f6dfe6ec22d5afc868450b34e30ddad3734
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-03-07
    upstreamable: true
    comments: |
      add general thread cleanup support
      k_thread_cleanup_pop() is an inline over the k_thread_cleanup_pop_entry() system
      call, which only returns the routine (and refuses to follow a cleanup entry the
      caller has corrupted), so handlers run in the popping thread's own privilege level;
      the tests assert that mode.
