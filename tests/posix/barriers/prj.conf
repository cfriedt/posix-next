CONFIG_ZTEST=y

CONFIG_POSIX_AEP_CHOICE_BASE=y
CONFIG_POSIX_BARRIERS=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_TEST_EXTRA_STACK_SIZE=4096
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384

# static stacks/threads: heap-carved user stacks do not fit the fixed heap above
CONFIG_SYS_THREAD_STACK_MIN_ADD_TEST=3
CONFIG_SYS_THREAD_THREAD_MIN_ADD_TEST=3
