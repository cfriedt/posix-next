  - path: zephyr/do-not-define--POSIX-C-SOURCE-and--XOPEN-SOURCE-globally.patch
    sha256sum: fa00972f3d6972b8d668b7e0b16150f6d52fae0c7bacf52ae8e527b0969941e0
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2025-10-24
    upstreamable: true
    comments: |
      Companion to the PR 120028 patches; regenerated for Zephyr v4.5.0-rc1 (replaces
      do-not-define--POSIX-C-SOURCE-and--XOPEN-SOURCE-globally-v4.4.1.patch). Consumers declare the
      feature-test macros they need instead of the build defining them globally: on v4.5.0-rc1
      that also covers the applications PR 120028 switched to the Network Appliance profile, and
      sys_clock_from_clockid() moves back to the POSIX implementation.
  - path: zephyr/sigrtmin-linux-alignment.patch
    sha256sum: 6c56de0f2055b6b1488fb31a4fb017e0450a622ed85c7c9cfdc925e0c8703d02
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-06-21
    upstreamable: true
    comments: |
      Align SIGRTMIN with Linux/glibc NPTL (reserve 32 for cancel and 33;
      application RT signals from 34). Corrects SIGRTMIN 32 in Newlib/Picolibc
      libc shadows after move-posix; posix headers and Kconfig live out-of-tree.
      The original value 32 was taken from Newlib and Picolibc Cygwin targets,
      which use a compact sigset_t (uint32_t or unsigned long) rather than a
      range sized for Zephyr's POSIX realtime signal requirements.
  - path: zephyr/libc-minimal-and-pico-support-for-strfmon.patch
    sha256sum: 5219d395d6778ca47041056cab1f383c6a51c410f60c2c7fbdd0b902be14f520
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2025-11-20
    upstreamable: true
    comments: |
      Add missing locale.h for minimal libc, as well as a trivial implementation of setlocale() and
      localeconv() that only support the "C" locale. Also patch picolibc to provide monetary.h via
