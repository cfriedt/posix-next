          - zephyr/kernel-k-thread-stack-alloc-flags-uint32.patch
    comments: |
      Rebased onto v4.5.0-rc1: the test keeps upstream's new size-overflow case and doc comments
      (reworded for the pool), its scenarios live in tests.yaml, and the rpi_zero_2w excludes stay.
      kernel: migrate dynamic thread stack APIs to SYS_THREAD
  - path: zephyr/c11-thrd-use-sys-thread-and-k-thread.patch
    sha256sum: fb3f9c6afc6629c9f0cf3c8164b42dcc04ba64c14b4b04e35722e0ee9e083c7d
