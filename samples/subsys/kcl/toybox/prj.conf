CONFIG_USERSPACE=y
# nothing of the POSIX API: the layer selects the services it is built on
CONFIG_POSIX_AEP_CHOICE_NONE=y

# loopback networking, host-independent (see samples/posix/toybox)
CONFIG_NETWORKING=y
CONFIG_NET_TEST=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_INET_RAW=y
CONFIG_NET_TX_STACK_SIZE=8192
CONFIG_NET_RX_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# the Linux kernel compatibility layer, for the executable's system calls
CONFIG_KCL=y
CONFIG_KCL_LINUX=y

# toysh runs its commands in fork()ed children
CONFIG_PROCESS_VM=y
CONFIG_CURRENT_THREAD_USE_TLS=n

CONFIG_LLEXT=y
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y
CONFIG_LLEXT_HEAP_SIZE=16

# the root file system lives in pages mapped as it fills; the guest arrives
# in it from the image's .xz stream
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_TMPFS=y
CONFIG_XZ_DEC=y
# random bytes for the executable's AT_RANDOM and its getrandom()
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ZVFS_STDIN_CONSOLE=y
CONFIG_ZVFS_PIPE=y
CONFIG_ZVFS_PIPE_MAX=8
# Linux-sized pipe buffers: toysh keeps a pipeline's read end open as its own
# stdin until the pipeline is done, so a writer must not have to wait for it
CONFIG_ZVFS_PIPE_BUF_SIZE=65536
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_PROC_OPEN_MAX=16

CONFIG_SYS_PROCESS_MIN=16
CONFIG_SYS_PROCESS_MAX=64
CONFIG_SYS_THREAD_THREAD_MAX=8
CONFIG_SYS_THREAD_STACK_MAX=8
CONFIG_SYS_THREAD_STACK_SIZE=8192
CONFIG_PRIVILEGED_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_MAX_DOMAIN_PARTITIONS=16
# permission indexes: one per process, the option groups' own threads included
CONFIG_MAX_THREAD_BYTES=8
# the 2 MiB toybox, its copy in the file system, the heap it and its forks live in
CONFIG_HEAP_MEM_POOL_SIZE=25165824
