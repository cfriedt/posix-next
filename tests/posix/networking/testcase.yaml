common:
  min_ram: 48
  tags:
    - iface
    - net
    - posix_networking
  platform_key:
    - arch
    - simulation
tests:
  portability.posix.networking:
    filter: not CONFIG_NATIVE_LIBC
  portability.posix.networking.userspace:
    filter: (not CONFIG_NATIVE_LIBC) and CONFIG_ARCH_HAS_USERSPACE
    tags: userspace
    min_ram: 160
    extra_configs:
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
  portability.posix.networking.dns_resolver.userspace:
    filter: (not CONFIG_NATIVE_LIBC) and CONFIG_ARCH_HAS_USERSPACE
    tags: userspace
    min_ram: 160
    extra_configs:
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
      # a name server nothing answers for: the query fails as a result code
      - CONFIG_DNS_RESOLVER=y
      - CONFIG_DNS_SERVER_IP_ADDRESSES=y
      - CONFIG_DNS_SERVER1="192.0.2.53"
      - CONFIG_NET_SOCKETS_DNS_TIMEOUT=500
  portability.posix.networking.inet_raw:
    filter: not CONFIG_NATIVE_LIBC
    extra_configs:
      - CONFIG_NET_SOCKETS_INET_RAW=y
  portability.posix.networking.armclang_std_libc:
    filter: not CONFIG_NATIVE_LIBC
    toolchain_allow: armclang
    extra_configs:
      - CONFIG_ARMCLANG_STD_LIBC=y
  portability.posix.networking.arcmwdtlib:
    filter: not CONFIG_NATIVE_LIBC
    toolchain_allow: arcmwdt
    extra_configs:
      - CONFIG_ARCMWDT_LIBC=y
  portability.posix.networking.minimal:
    filter: not CONFIG_NATIVE_LIBC
    extra_configs:
      - CONFIG_MINIMAL_LIBC=y
  portability.posix.networking.newlib:
    filter: (not CONFIG_NATIVE_LIBC) and (TOOLCHAIN_HAS_NEWLIB == 1)
    extra_configs:
      - CONFIG_NEWLIB_LIBC=y
  portability.posix.networking.picolibc:
    tags: picolibc
    filter: (not CONFIG_NATIVE_LIBC) and CONFIG_PICOLIBC_SUPPORTED
    extra_configs:
      - CONFIG_PICOLIBC=y
  portability.posix.networking.linux_compat:
    tags: native
    platform_allow:
      - native_sim
      - native_sim/native/64
    filter: CONFIG_NATIVE_LIBC
    extra_configs:
      - CONFIG_POSIX_TEST_LINUX_COMPAT=y
