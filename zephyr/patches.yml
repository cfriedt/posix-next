  - path: zephyr/riscv-mmu-support.patch
    sha256sum: 3d11bacbc57f51a8c3fa9a80a9497620972104b675d02378f2c01a51bc553c56
    module: zephyr
    author: Alexios Lyrakis
    email: alexios.lyrakis@gmail.com
    date: 2026-08-28
    merge-pr: https://github.com/zephyrproject-rtos/zephyr/pull/105403
    custom:
      upstream:
        depends-on:
          - zephyr/riscv-s-mode-support.patch
    comments: |
      Resynced 2026-10-03 with the head of zephyr#105403 (fdbbeedf89, 2026-09-30) rebased onto
      v4.5.0-rc1: six commits adding Sv39/Sv48 MMU support, the qemu_riscv64 S-mode/MMU boot and
      Sv48 board variant, the MEM_REGION_ALLOC test case and the architecture documentation. The
      S-mode and SBI groundwork of the earlier snapshot is in v4.5.0-rc1 itself.
      Adapted to v4.5.0-rc1: k_mem_domain_default is created by a kernel pre-init hook before the
      PRE_KERNEL_1 arch_mem_init(), so partition mapping is deferred while kernel_root_table is
      NULL and replayed once the domain root has been patched with the kernel tables (the PR's
      memcpy alone drops the libc partition). The earlier v4.4.1 adaptations are kept: RISCV_MMU
      default y, read-only stack guard pages, PRIVILEGED_STACK_SIZE 4096.
      Backport RISC-V MMU support (zephyr#105403): CONFIG_RISCV_MMU with
      Sv39/Sv48 page tables, per-domain ASID-tagged root tables, userspace
      and memory-domain isolation, MMU stack guards, arch_mem_map/unmap/
      arch_page_phys_get, and the qemu_riscv64 smode/sv48 MMU board
      variants. RV64-only (no Sv32); no demand paging. Adapted to v4.4.1:
      dropped the virt-riscv-plic.dtsi include (PLIC is still inline in the
      shared QEMU virt dtsi) and omitted main-only PMP_DATA_EXECUTION_PREVENTION
      Kconfig context. RISCV_MMU defaults y (its dependencies already require
      an S-mode kernel and every enabled hart declaring MMU hardware in the
      devicetree, so platforms with an MMU enable it by default, matching
      other architectures). Adds PRIVILEGED_STACK_SIZE default 4096 under RISCV_MMU
      (mirrors X86_MMU): the guard+priv reservation is page-rounded so a 1024B
      priv stack wastes the rest of the page, and 1024B overflows into the
      guard page on deeper syscall paths (k_mem_map from sys_thread_stack_alloc),
      which fault-storms at trap entry with no diagnosable backtrace. Stack
      guard pages are made read-only (W/X/U cleared, V kept) instead of
      unmapped, mirroring x86's z_x86_set_stack_guard(): stores still fault as
      overflow, and mem-mapped dynamic stack objects stay fully resolvable so
      k_mem_unmap_phys_guard() can free their page frames at thread destroy
      (V=0 tripped its "cannot unmap an unmapped address" assert).
      The PLIC register windows that the interrupt controller driver addresses
      physically are identity-mapped beside the console UART.

  - path: zephyr/riscv-mmu-domain-mappings.patch
    sha256sum: fad4314cf72a5a1134a33f300b283584ed011a1f6cf278e5d43385bc13e75ddf
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-13
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/riscv-mmu-support.patch
    comments: |
      riscv: mmu: keep memory-domain mappings in step with the kernel's. Two
      fixes to the backported MMU (zephyr#105403), for memory that is mapped
      rather than identity-mapped, such as a thread stack from k_mem_map().
      Domain tables mapped user ranges (partitions, user stacks) at virt ==
      phys, so a user thread on a mapped stack saw a different page than the
      kernel did: the user-mode flag the kernel set in its TLS read 0, the
      inline system call wrapper concluded it was in kernel context and
      dereferenced kernel data. User ranges are now mapped page by page at
      the frames the kernel tables hold. And kernel leaf mappings made after
      a domain privatized the covering leaf table were never propagated
      (upstream syncs only new L0/L1 entries): arch_mem_map()/arch_mem_unmap()
      now mirror the changed leaves into every domain's private leaf tables,
      leaving leaves that carry PTE_USER (the domain's own) alone, so that
      late mappings stay reachable while a domain SATP is active - a trap
      from user mode stores into the privilege stack before switching SATP.
  - path: zephyr/intc-plic-supervisor-context.patch
    sha256sum: 5ffcbaee49fe80299952d5ac27b2c1a8848af28d4c2b22dca016a24568c7f3a7
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-10-05
    upstreamable: true
    comments: |
      drivers: intc: plic: use the supervisor hart context under RISCV_S_MODE

      The driver connects the PLIC to the first interrupt of its
      interrupts-extended list, the machine external interrupt, and takes
      the hart contexts listed with that number. A kernel built for
      supervisor mode never sees machine interrupts: connect the supervisor
      external interrupt and use the supervisor contexts instead, so that
      external interrupts (virtio-net on qemu_riscv64) reach the kernel.

  - path: zephyr/boards-qemu-riscv64-smode-default.patch
    sha256sum: a9a982cc753d1fc04cf10c58395204c06225c20579f78ae2dddea5278173070a
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-13
    custom:
      upstream:
        depends-on:
          - zephyr/riscv-mmu-support.patch
    comments: |
      Rebased onto v4.5.0-rc1 + the zephyr#105403 head: upstream's opensbi and opensbi_smp variants stay,
      the MMU properties use the PR's /cpus form, and coredump_threads keeps upstream's
      'not CONFIG_RISCV_S_MODE' filter, which still covers the mmode variant.
      boards: qemu_riscv64: S-mode with the Sv39 MMU is the board's default
      configuration, as qemu_cortex_a53 and qemu_x86_64 run their MMU by
      default; the M-mode PMP configuration that upstream calls
      qemu_riscv64 becomes the qemu_riscv64/qemu_virt_riscv64/mmode variant
      and the smode variant goes away (sv48 and smp are unchanged). The
      four Zephyr test manifests that excluded or listed the smode
      identifier now name qemu_riscv64, and coredump_threads, whose
      S-mode exclusion would otherwise leave riscv64 uncovered, lists the
      mmode variant. Not for upstream as is: it reverses upstream's board
      default.
      Kernel leaf mappings made after a domain privatized the covering leaf
      table (dynamically allocated thread stacks, k_mem_map()) are mirrored
      into every domain's private leaf tables on arch_mem_map()/arch_mem_unmap();
      the upstream PR syncs only new L0/L1 entries, so such pages were
      reachable from a domain only while its table was still shared with the
      kernel, although a trap from user mode stores into the thread's
      privilege stack before switching SATP.
  - path: zephyr/net-sockets-guard-null-thread-name-log.patch
    sha256sum: 52bee2eb163c627cb3f6894efb266119fa2a7d28e588169a06b2257600ca6dfe
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-19
    upstreamable: true
    comments: |
      net: sockets: guard the NULL thread name in get_sock_vtable()'s invalid-access
      NET_DBG. k_thread_name_get() returns NULL when CONFIG_THREAD_NAME=n, and the
      deferred-logging cbprintf string packaging strlen()s the %s argument, so an
      invalid socket access (e.g. recvfrom() on a stale fd) crashes with a NULL
      dereference. Pass a "?" placeholder instead.
  - path: zephyr/samples-net-can-propagate-socket-errors.patch
    sha256sum: d2fd61d358a934be94f9718cee5d109a49a463577bacbb2f49d790ebdb5d1c26
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-19
    upstreamable: true
    comments: |
      samples: net: sockets: can: return the real (negative) error from setup_socket()
      instead of overwriting it with -errno. When a failed socket()/bind()/setsockopt()
      leaves errno at 0, -errno is 0, which the caller reads as a valid fd (0) and then
      calls recvfrom() on it, tripping the get_sock_vtable() crash above.
  - path: zephyr/net-addr-ntop-vrfy-honor-size.patch
    sha256sum: 7e780c5d35a9ed658a15258aa124d0d803ec996c431794a783bac43073bc394c
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-09
    upstreamable: true
    comments: |
      The net_addr_ntop() syscall verifier formatted into its full-size local
      buffer and ignored the caller's size, so undersized destination buffers
      succeeded (truncated) from user mode where kernel mode fails. Clamp the
      format width to the caller's size so both modes agree.
  - path: hostap/hostap-net-headers.patch
    sha256sum: 1095516b9abf7915fdd563266f3eb8e518ed805c3eb7c1694bb1fe1a795224a3
    module: hostap
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-19
    upstreamable: true
    comments: |
      hostap: use native net_sockaddr_ll and include <net/if.h> / <netinet/in.h> for
      IF_NAMESIZE and struct sockaddr_in/sockaddr_in6/in_addr/in6_addr. In the common
      includes.h, replace the CONFIG_POSIX_API-gated block with an unconditional pull
      of the unprefixed POSIX headers on Zephyr (<netinet/in.h>, <sys/socket.h>,
      <sys/select.h>, <arpa/inet.h>, <netpacket/packet.h>, <unistd.h>) instead of the
      net_compat-backed <zephyr/net/socket.h>, so hostap gets the standardized names
      from the posix-next headers rather than net_compat, which now provides only the
      non-POSIX extensions. Drop the blanket "#define signal(a, b) (void)(b)" shim: its
      only call sites (eloop.c SIGSEGV/SIGALRM) are already compiled out on Zephyr, and
      it shadowed the real POSIX_SIGNALS signal().
  - path: zephyr/libc-posix-net-header-shims.patch
    sha256sum: bbc923255aab30056a2f6058de33fb9aaa57b0123781aeb29bda2da4493a3e75
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-19
    upstreamable: true
    comments: |
      Rebased onto v4.5.0-rc1 + zephyr#120028, which already carry the <netpacket/packet.h> shims; only
      <sys/uio.h> and <sys/un.h> remain here.
      Add picolibc and newlib <sys/uio.h>, <sys/un.h>, and <netpacket/packet.h>
      shim headers that forward to the out-of-tree posix-next headers, so the new
      POSIX networking headers resolve for these libcs (mirrors the existing
      <sys/socket.h> / <netinet/in.h> shims).
  - path: zephyr/net-compat-non-posix-constants.patch
    sha256sum: b5d92fab453ab620df7ee3d96d7f6ad46ed8a22c57173a59769a2cf911bf70bb
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-19
    upstreamable: true
    comments: |
      Rebased onto v4.5.0-rc1: the packet_mreq, SOL_PACKET and PACKET_* spellings upstream added stay,
      as non-POSIX names; the compat mode's NET_TEST guard (now spelled with POSIX_NETWORKING) still goes.
      Repurpose the network namespace compatibility mode to provide only the
      non-POSIX, system-dependent unprefixed names (AF_PACKET, IPPROTO_IGMP,
      SO_PRIORITY, CAN_RAW, TLS_*, PACKET_*, sockaddr_ll, ...). All POSIX symbols
      are removed from net_compat.h -- the posix-next headers own those -- so
      compat mode no longer collides with a conforming <sys/socket.h> or
      <netinet/in.h>. Because it no longer defines POSIX symbols, the Kconfig
      option drops its "depends on !NET_TEST || POSIX_API" guard (now simply
      default y, help updated) and net_ip.h's struct net_addr no longer needs
      the compat-mode member rename (in6_addr/in_addr used unconditionally).
  - path: zephyr/net-ip-icmp-message-types.patch
    sha256sum: 3930731b430e98de2f7b2a74dcb46fbda07a344fb7ace408796511e61ae30e2c
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-03
    upstreamable: true
    comments: |
      Move the ICMPv4 and ICMPv6 message type and code constants next to the
      ICMP header layout in net_ip.h, a light header, instead of splitting them
      between the heavyweight public icmp.h (which pulls in the kernel, net_if
      and net_pkt) and the private icmpv4.h/icmpv6.h. The <netinet/ip_icmp.h>
      and <netinet/icmp6.h> compatibility headers alias these values.
  - path: zephyr/net-sockaddr-in6-match-posix-layout.patch
    sha256sum: 0362c9405e4399d33adbef2f4531f650d121a5b9ebd1e81ddbd7011d260928f4
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-21
    upstreamable: true
    comments: |
      Make net_sockaddr_in6 match the POSIX sockaddr_in6 layout: widen sin6_scope_id to
      uint32_t and add sin6_flowinfo at the end (rather than before sin6_addr as in the
      POSIX spec) so sin6_addr keeps offset 4 -- the same offset as net_sockaddr_in.sin_addr,
      which zsock_getnameinfo relies on, and which lets the POSIX<->native sockaddr_in6
      conversion take the zero-copy fast path. This grows sizeof(net_sockaddr_in6) from 24
      to 28 bytes, so two in-tree consumers that hard-coded the old size are updated to
      track it: the dns_sd test's expected length uses sizeof(struct net_sockaddr_in6)
      instead of the literal 24, and the MQTT-SN UDP transport's
      CONFIG_MQTT_SN_LIB_MAX_ADDR_SIZE IPv6 default goes 24 -> 28 so its
      BUILD_ASSERT(>= sizeof(net_sockaddr_in6)) still holds.
  - path: zephyr/net-subsys-native-and-sockatmark.patch
    sha256sum: 4ef339a437a14724584802ce5f313a82ec59b4415ef250960f3f8bcda7f9e556
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-19
    upstreamable: true
    comments: |
      Add zsock_sockatmark(): declare the __syscall in net/socket.h and implement it in
      sockets.c (a stub that fails with ENOSYS). Also switch the FTP client to
      net_socklen_t.
  - path: zephyr/net-sockets-getaddrinfo-literal-nonstatic.patch
    sha256sum: 7555cef7a447ee99f431063904249279480233556b1776a93ea4665ddab0368f
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-10
    upstreamable: true
    comments: |
      POSIX getaddrinfo() owns its result array (allocated with calloc(), freed
      with free()) so a user-mode process never faults taking the kernel heap
      lock, and hands it to the network stack to fill. Reusing zsock_getaddrinfo()
      is not possible because it k_calloc()s the result itself; the caller instead
      drives the same two steps directly. The DNS step is already the public
      z_zsock_getaddrinfo_internal() syscall, but the literal-address fast path
      (net_ipaddr_parse for e.g. "127.0.0.1" when no resolver is configured) is a
      file-static helper. Drop its static qualifier so the POSIX wrapper can call
      it; it stays undeclared in any public header, forward-declared at its single
      call site.
  - path: zephyr/samples-net-posix-api.patch
    sha256sum: 31370b9647c59222ec892d97126e998aa46d69258c655882e02d177a8a642fa0
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-19
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/move-posix-impl-and-tests-out-of-tree.patch
    comments: |
      Rebased onto v4.5.0-rc1 + zephyr#120028: the samples already use the short-form POSIX includes;
      the cellular modem sample keeps upstream's native net_sin() on its dns_resolve storage, the CoAP
      server keeps upstream's guarded address setup, and the TFTP client converts the resolved POSIX
      sockaddr before storing it in upstream's server_addr.
      Migrate samples/net to the POSIX networking APIs: include the POSIX headers and
      use POSIX socket types/constants, replacing net_sin()/net_sin6() with the POSIX
      posix_sin() helpers from <zephyr/posix/net/conversion.h>. Must be applied after
      move-posix-impl-and-tests-out-of-tree.patch, which switches these samples to the
      short-form POSIX includes this patch builds on.
  - path: zephyr/tests-net-socket-service-posix-bind-casts.patch
    sha256sum: 1f03984bee7900a667d089b3b4abaad692dc6f9f9b87991faacde9695b5e9c0a
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-19
    upstreamable: true
    comments: |
      net.socket.service sets CONFIG_POSIX_API (for eventfd), so bind()/connect()
      resolve to the POSIX wrappers taking (struct sockaddr *). Call zsock_bind()/
      zsock_connect() directly -- the native APIs taking (struct net_sockaddr *) --
      and keep the (struct net_sockaddr *) casts, avoiding the mismatched prototype
      when passing net_sockaddr_in6/net_sockaddr_in addresses.
  - path: zephyr/net-conn-deliver-raw-unlocked.patch
    sha256sum: 48d0c05b79aa69af00316275135b8b748eee1665796eddd0a29d4cf24af205cc
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-03
    upstreamable: true
    comments: |
      Raw IP and packet socket delivery invoked the socket callback while
      holding the connection lock. The callback takes the socket's fd lock,
      which close() already holds while it waits for the connection lock in
      net_conn_unregister(), so closing a raw socket while looped-back
      traffic is still being delivered deadlocked the RX thread and the
      closer. Walk the connection array by index and release the lock
      around each delivery, as the unicast UDP path already does.
  - path: zephyr/net-sockets-inet-raw-ip-hdrincl.patch
    sha256sum: e15ccfb17e32661f39f482fa0dd164f295f718f7a20849465249dcad70c1de0e
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-03
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/net-compat-non-posix-constants.patch
    comments: |
      Rebased onto v4.5.0-rc1: NET_OPT_IP_HDRINCL follows upstream's new linger and UDP-option values (43).
      AF_INET/AF_INET6 raw sockets always required the application to supply
      the IP header, unlike Linux and the BSDs where the stack builds it from
      the destination address unless IP_HDRINCL is set (or the protocol is
      IPPROTO_RAW). Add ZSOCK_IP_HDRINCL / ZSOCK_IPV6_HDRINCL backed by a
      NET_OPT_IP_HDRINCL context option, default off, and build the IP header
      on the stack-built path so e.g. socket(AF_INET, SOCK_RAW, IPPROTO_ICMP)
      + sendto() of a bare ICMP echo works as on other systems. The
      af_inet_raw test sets the option where it supplies headers and gains
      stack-built-header and option round-trip cases.
  - path: zephyr/net-ipv6-ll-sl-prefix-10.patch
    sha256sum: 1dc3cec68943bb4a0312dbc58332d05c2c6d8ba3cd2c9931dbfe7df332ffcc47
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-10-08
    upstreamable: true
    comments: |
      net_ipv6_is_ll_addr_raw() and net_ipv6_is_sl_addr() compared the whole
      first 16 bits of the address with fe80 / fec0, so only fe80::/16 and
      fec0::/16 were recognised. RFC 4291 defines link-local unicast as
      fe80::/10 and (deprecated) site-local unicast as fec0::/10; mask the
      prefix like every other implementation of IN6_IS_ADDR_LINKLOCAL() and
      IN6_IS_ADDR_SITELOCAL() does.
  - path: zephyr/libc-isoc-signal-handling.patch
    sha256sum: 59176030d0d0279991bb9fbe1b088c34e91e2843c0b0d54336aa33c42485a9e9
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-22
    upstreamable: true
    comments: |
      libc: common: implement the ISO C <signal.h> functions in terms of the kernel
      k_sig_* API, behind COMMON_LIBC_SIGNAL. signal() and raise() were previously a
      stub returning EINVAL and a declaration with no definition, and abort() panicked
      the system rather than raising SIGABRT.

      Both are shared with POSIX rather than overridden by it: the calling thread is the
      same thread in ISO C, POSIX, and the kernel, and signal handling must behave the
      same regardless of which standard the handler was installed through. When the POSIX
      layer is linked, weak references pick up its signal number table
      (z_sig_from_posix()) and its delivery shim (z_sig_shim()), making signal()'s kernel
      registration identical to sigaction()'s; otherwise only the six ISO C signal
      numbers are reachable, and those coincide with the kernel's, so handlers take
      delivery directly.

      Also reduces the minimal libc <signal.h> to what ISO C requires; the POSIX
      additions already come from <zephyr/posix/posix_signal.h>, which it includes.
  - path: zephyr/minimal-libc-iso-c-stdio-stdlib-time-units.patch
    sha256sum: bd97ce7ecda8bb47f00874349f3ec009ec9730bf7bf36d74851faeaa85a2b199
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-25
    upstreamable: true
    comments: |
      Implement the remaining ISO C units in the minimal libc so that the
      symbols always link: feof(), ferror(), ungetc() (per-stream EOF/error
      flags and single-character push-back for the unbuffered fd-backed FILE
      streams), a real clearerr(), tmpfile(), tmpnam(), atexit() (run by
      exit()), and clock() (CLOCKS_PER_SEC = 1000000, microseconds of uptime).
      Functions that require CONFIG_ZVFS fail visibly with LOG_WRN_ONCE naming
      the missing option when it is not enabled.

      Also align <time.h> with ISO C: gmtime_r()/localtime_r() are visible only
      for C23 and newer; asctime_r()/ctime_r() are POSIX-only and now live
      solely in <posix_time.h> (their in-tree ISO C callers carry local
      prototypes).
  - path: zephyr/k-timer-clock.patch
    sha256sum: 46b04e3d6b87390b8ba4445cfc2bcb41d0efd4c13858b602b232676d6a4fb91b
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-28
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-thread-cancel.patch
    comments: |
      Rebased onto v4.5.0-rc1: timer.c uses upstream's timer_lock and z_try_abort_timeout() (the
      superseded-handler scheme replaced z_abort_timeout()); the legacy-start hook sits under that lock.
      kernel: timer: add clock-based, tick-exact timer arming

      Adds CONFIG_TIMER_CLOCK: k_timer_settime() and k_timer_gettime() arm and
      query kernel timers with timespec values measured against a per-timer
      clock (SYS_CLOCK_MONOTONIC or SYS_CLOCK_REALTIME, bound with the new
      K_TIMER_DEFINE_EXT()/Z_TIMER_INITIALIZER_EXT()). Arming always uses
      absolute timeouts derived from kernel-maintained scheduled-expiry state,
      so at most one clock conversion happens per arming operation and periodic
      expiry advances on a drift-free tick grid, skipping ahead (not replaying)
      when wakeups are late or coalesced under tickless operation. Relative
      durations have "at least" semantics, without k_timer_start()'s historical
      one-tick-early behavior, which is preserved unchanged for legacy users.

      Adds CONFIG_TIMER_REALTIME: armed absolute SYS_CLOCK_REALTIME timers are
      re-targeted when sys_clock_settime() moves the wall clock (forward jumps
      past a deadline fire immediately; backward jumps defer), as POSIX
      requires of TIMER_ABSTIME CLOCK_REALTIME timers. Re-targeting applies to
      the initial expiry only; after the first expiry a periodic timer
      continues on the monotonic grid, matching Linux. Lock ordering is
      timer lock then rt-offset lock, never reversed; the settime hook runs
      after the offset lock is released.

      Both syscalls verify K_OBJ_TIMER kernel objects, so stale or foreign
      handles fault in user mode instead of corrupting memory. Includes the
      tests/kernel/timer/timer_clock ztest suite (default, tickless, SMP with
      spinlock validation, and userspace variants) and kernel timing
      documentation for clock-based arming and the conversion-variance rule.

      This is groundwork for mapping POSIX timers ~1:1 onto kernel timers.

      k_timer_settime()/k_timer_gettime() deliberately take struct timespec
      rather than k_timeout_t: k_timeout_t is uptime-domain (its absolute
      form is a monotonic tick count), so a SYS_CLOCK_REALTIME wall-clock
      deadline cannot cross the boundary through it without the caller
      baking in the realtime offset - defeating both the single-coherent-
      conversion rule and clock_settime() re-targeting. k_timer_start()
      remains the native tick-domain API.
  - path: zephyr/sys-timer.patch
    sha256sum: 212390734498ad3f8efb466feae25aba5fc3b62080ef52787f057af2145b2e46
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-28
    upstreamable: true
    comments: |
      lib: os: add sys_timer, an OS-managed pool of kernel timers

      Adds CONFIG_SYS_TIMER: sys_timer_create() and sys_timer_delete()
      syscalls allocate, initialize, and release k_timer objects from an
      OS-owned elastipool, with semantics shaped after POSIX
      timer_create()/timer_delete(). Creation binds the timer to a clock
      (SYS_CLOCK_MONOTONIC or SYS_CLOCK_REALTIME), optionally arms it
      atomically (native create-and-go; POSIX passes NULL and arms later via
      k_timer_settime()), grants the calling user thread access to the object,
      and reports pool exhaustion as -EAGAIN. Deletion stops the timer,
      revokes user access, and returns the object to the pool; stale or
      foreign handles are rejected (-EINVAL kernel-side, syscall oops in user
      mode).

      Pool sizing follows the distributed-minimum idiom established by
      SYS_THREAD: CONFIG_SYS_TIMER_MIN plus all CONFIG_SYS_TIMER_MIN_ADD_*
      contributions are summed by CMake into the un-prefixed SYS_TIMER_MIN
      compile definition and statically allocated (guaranteed);
      CONFIG_SYS_TIMER_MAX (default INT_MAX, effectively unlimited) caps the
      heap-backed remainder, and setting it equal to the accumulated minimum
      prohibits dynamic allocation entirely. Dynamic objects are allocated
      with k_object_alloc() when CONFIG_DYNAMIC_OBJECTS is available.

      Includes the tests/lib/sys_timer ztest suite (default, static-only, and
      userspace variants, including revoked-handle fault coverage) and
      complete Doxygen. Groundwork for POSIX timer_create()/timer_delete().
  - path: zephyr/k-timer-signal.patch
    sha256sum: 49d4a2f07bdc8d6945b7d622c8de9fe01b6df9d5c1ef78878e410fa3e11eaae7
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-28
    upstreamable: true
    comments: |
      kernel: timer: generate signals on timer expiry with overrun accounting

      Adds CONFIG_TIMER_SIGNAL (default y with SIGNAL and TIMER_CLOCK): a
      kernel timer may generate a thread-targeted signal on each expiry,
      carrying a user value with the new public si_code K_SI_TIMER (K_SI_QUEUE
      is also now public). Notification is attached at pool-allocation time
      via sys_timer_create(); sys_timer_delete() detaches it and purges
      queued-but-undelivered instances so no kernel reference to the timer
      outlives deletion. Unlike expiry functions (interrupt context), signal
      delivery runs in the target thread's context - the robust path for
      userspace consumers. Expiry functions and signals may coexist; with
      CONFIG_TIMER_SIGNAL=n the timer code is unchanged.

      Generation follows the POSIX one-pending model: an atomic per-timer
      latch admits a single queued instance; expiries while pending are
      overruns. The overrun is computed lazily at delivery from the exact
      scheduled-expiry grid - floor((delivery - generation)/period) - so
      expiries coalesced by late or tickless wakeups are counted correctly,
      and k_timer_overrun() reads it non-destructively. Disarming stamps a
      freeze time so idle time does not inflate the count. Queue-full drops
      are best-effort (retried next period), counted per timer, and reported
      with a zero-overhead-by-default LOG_DBG_RATELIMIT message.

      Lock ordering is structural: the expiry path holds timer lock then
      k_sig_lock; the delivery-side hooks called from kernel/signal.c use
      atomics only and are incapable of taking the timer lock.

      Also fixes a pre-existing k_sig_timedwait() bug exposed by the new
      tests: a stale fifo-ready poll raise (raised at generation but never
      consumed, or consumed by an unrelated wake-up) caused an immediate
      spurious -EAGAIN, and a raise for another thread combined with an
      expiring deadline could trip an internal assertion. The wait now keeps
      waiting until its deadline on a stale raise and reports a clean -EAGAIN
      timeout otherwise; sigwait-style acceptance also propagates si_code.
      This is the bug the POSIX layer's sigwait chunked-polling workarounds
      exist for (see lib/posix options signals/rtsig), which can be simplified
      in a follow-up.

      Includes the tests/kernel/timer/timer_signal ztest suite (delivery via
      handler and sigwait, one-pending, overrun latch/coalescing/freeze,
      thread-targeted delivery, delete-purges, queue-full recovery,
      expiry-function coexistence, userspace positive and fault-injection
      negative cases) and kernel timing documentation.

      Also adds function notification: sys_timer_create() callers may pass a
      notification function (with stack size and priority) instead of a
      signal target; a single kernel dispatcher thread accepts the expiries
      through the reserved top-of-set K_SIG_SYS_TIMER signal and spawns one
      detached system-pool thread per notification (requires SYS_THREAD and
      THREAD_DETACH; ENOTSUP otherwise). Notification threads for timers
      created by user threads run in user mode, in the creator's memory
      domain, inheriting the creator's object permissions at dispatch time
      (via a new kernel-mode-only sys_thread_create_paused()). k_sig_info
      gains the generating-timer identity (the Linux si_timerid analog),
      populated at every delivery. This is the substrate for POSIX
      SIGEV_THREAD, which needs no per-timer allocation in the POSIX layer.

      Also fixes a k_sig_timedwait() wake-up starvation: a k_poll signal
      raise notifies only the first registered poller, so a perpetual waiter
      (such as the dispatcher) could consume - and never hand back - another
      thread's wake-up. A waiter that observes a foreign raise now re-raises
      it, notifying the next waiter in line, before yielding.
  - path: picolibc/sigevent-thread-id.patch
    sha256sum: 19396d9b15bd730091b03a8a0c9ac1cedf86ba67c9268584cabff89f7c29d6cc
    module: picolibc
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-28
    upstreamable: true
    comments: |
      Add the Linux-compatible SIGEV_THREAD_ID sigevent extension: a
      sigev_notify_thread_id member on struct sigevent and, under
      __GNU_VISIBLE, the SIGEV_THREAD_ID notification constant. This lets
      POSIX timer implementations deliver expiry signals to a specific
      thread (and implement SIGEV_THREAD on top of thread-directed
      delivery, as glibc does).
  - path: zephyr/libc-sigevent-thread-id.patch
    sha256sum: 47123d74c36b5056c4100720e404ad69ca84b6b7d05ef749864aee84d8348f86
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-03
    upstreamable: true
    comments: |
      lib: libc: declare sigevent with sigev_notify_thread_id

      The companion picolibc patch only reaches builds selecting
      CONFIG_PICOLIBC_USE_MODULE. Picolibc and newlib from the toolchain
      are the Zephyr SDK default, and those prebuilt headers declare
      struct sigevent without sigev_notify_thread_id and without an
      override guard, so anything using the Linux-compatible
      SIGEV_THREAD_ID extension fails to compile - taking every
      non-minimal-libc scenario of tests/posix/asynchronous_io with it.

      Rename the libc declaration aside across #include_next and declare
      the Zephyr struct sigevent in each shim, keeping the libc field
      order, appending sigev_notify_thread_id, and reusing the libc's own
      visibility guard. Only <signal.h> and <time.h> mention struct
      sigevent in either libc, and <time.h> merely forward-declares it,
      so the replacement is the single definition every translation unit
      sees.
  - path: zephyr/k-condvar-clockwait-absolute-timeout.patch
    sha256sum: f43373e6c48fd7cb67882639e743b23bd7d2516f0dcfa89450a48ae3fd4fcd86
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-29
    upstreamable: true
    comments: |
      kernel: condvar: convert clockwait deadlines exactly once

      k_condvar_clockwait() converted its absolute deadline to a timepoint,
      returned early if already expired, and re-derived a relative timeout
      from a second "now" sample before pending - decaying the deadline by
      the scheduling latency between the two samples.

      Convert exactly once with timespec_abs_to_timeout() and pend on the
      absolute kernel timeout (CONDVAR_OPTIONS now selects TIMEOUT_64BIT,
      which absolute timeouts are gated on); an already-past deadline pends
      and expires immediately. Also report -EINVAL for an invalid timespec -
      the positive EINVAL previously returned was negated by the POSIX layer
      into a -22 return from pthread_cond_timedwait().
  - path: zephyr/k-sleep-absolute-timeout-remainder.patch
    sha256sum: c8ebdfab1d072d0a623ec8d6f010d8d9359d49785cbde1116858981f6b88406e
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-28
    upstreamable: true
    comments: |
      kernel: timeout: report the decoded expiry for absolute timeouts

      z_add_timeout() returns the absolute expiry tick of the scheduled
      timeout, which z_tick_sleep() records to compute the time remaining
      when a sleep is cut short by k_wakeup(). For absolute timeouts the
      raw encoded value (Z_TICK_ABS, a negative number) was returned
      instead of the decoded expiry, so k_sleep() with an absolute timeout
      reported a garbage remainder - typically 0, indistinguishable from
      normal expiry - when woken early.

      Return the decoded absolute expiry, matching what the relative branch
      reports, and add a regression case to the kernel sleep testsuite
      covering the woken-early remainder and re-arming against the same
      absolute deadline.
  - path: zephyr/sys-clock-nanosleep-absolute-arming.patch
    sha256sum: 9032c2703d07127bb174083166f904e1e7dde3a5dfca6e42cacb7440397964f9
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-28
    upstreamable: true
    comments: |
      lib: os: clock: arm absolute nanosleep deadlines as absolute timeouts

      The SYS_TIMER_ABSTIME path of sys_clock_nanosleep() converted the
      absolute deadline to a relative duration by sampling "now", then
      converted that duration back through a timepoint and slept in a
      re-derived-relative retry loop: every conversion re-samples the
      clock and adds scheduling-latency skew, and the retry loop re-arms
      short relative sleeps rather than holding one deadline.

      When CONFIG_TIMEOUT_64BIT is available (the default), convert the
      deadline once with timespec_abs_to_timeout() - a single coherent
      conversion, no "now" sample - and k_sleep() on the absolute timeout;
      a premature k_wakeup() re-arms against the same absolute deadline.
      Deadlines too distant for tick conversion (over ~584 years) and
      32-bit-timeout configurations retain the relative fallback.

      Depends on k-sleep-absolute-timeout-remainder.patch for the woken-
      early remainder of an absolute-timeout k_sleep(). Covered by the
      POSIX clock_nanosleep() testsuite (absolute-deadline accuracy on
      both clocks and premature-wake-up re-arming were added to it in the
      posix module).
  - path: zephyr/elastipool-one-ztest-per-unit.patch
    sha256sum: 42d071aed7658c1d3520e89b25287510c609a5570ab5cd8c77e8bac9c792da74
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-29
    upstreamable: true
    comments: |
      tests: elastipool: consolidate to one ZTEST per unit

      The regression cases added alongside the elastipool bug fixes were
      behavior-named ZTESTs. Fold each into the single ZTEST for the unit
      (function) it exercises - init, alloc, free, clear - and give the
      SYS_ELASTIPOOL_DEFINE storage-sizing case its own per-unit ZTEST.
      A follow-up file because the introducing patch predates this branch.
  - path: zephyr/k-msgq-prio.patch
    sha256sum: 3e773118c9808216d394ac1e4103ced52c65731508338779f4d0a13a0a16f9ac
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-30
    upstreamable: true
    comments: |
      kernel: msgq: add opt-in priority-mode message queues

      Adds CONFIG_MSGQ_PRIO: a message queue initialized with
      k_msgq_init_prio() or k_msgq_alloc_init_prio() delivers messages in
      descending priority order (FIFO among equal priorities) and records
      the actual length of each message, as required to natively back POSIX
      message queues (mq_send()/mq_receive() priorities and actual-length
      receives). k_msgq_put_prio() bounds the caller-supplied length by the
      queue's message size; k_msgq_get_prio() returns the stored length and
      reports the message priority.

      Priority mode is strictly opt-in: struct k_msgq does not grow (the
      classic read/write ring pointers overlay a priority-sorted used list)
      and the classic fixed-size FIFO paths are untouched. The priority
      buffer embeds a control block holding a dedicated sender wait queue
      and a free-slot list, splitting senders from the receivers on the
      existing wait queue: blocked peers are woken to retry rather than
      handed data through swap_data, so purge only ever wakes senders and,
      unlike the classic direct-handoff path, caller buffers may live on
      thread stacks under CONFIG_KERNEL_COHERENCE. Classic operations on a
      priority-mode queue (and vice versa) fail with -ENOTSUP.

      Covered by per-unit ZTESTs (user-capable) in the kernel msgq_api
      suite under a new kernel.message_queue.prio twister variant, with
      priority ordering, variable-length, error, blocking, purge, and ISR
      sections.
  - path: zephyr/k-msgq-notify.patch
    sha256sum: 5188b26f6ef1899669509706837b3e84d3044bd3559968baf0ef0d84f72a7421
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-30
    upstreamable: true
    comments: |
      kernel: msgq: add one-shot empty-to-non-empty notification

      Adds CONFIG_MSGQ_NOTIFY: a priority-mode message queue accepts a
      single one-shot notification registration (k_msgq_notify_arm() /
      k_msgq_notify_disarm()). When a message arrives at an empty queue,
      a signal carrying the registered value is generated for the
      registered thread with the new public si_code K_SI_MSGQ, and the
      registration is consumed - atomically with the send, inside the
      queue lock, on both the ISR and thread paths. This replaces the
      inherently racy sample-num-used-then-put emulation the POSIX
      mq_notify() shim performs today and is the kernel primitive that
      backs mq_notify() semantics: sends to a non-empty queue do not
      fire, arming while armed is refused, and a consumed registration
      may be re-armed.

      A signo of 0 arms a signal-less registration (consumed by the
      transition, generates nothing), matching POSIX SIGEV_NONE, and is
      the only form accepted without CONFIG_SIGNAL. If signal generation
      fails on the transition (ISR signal-lock contention), the
      registration stays armed for a later transition rather than being
      lost. Registration state lives in the priority-buffer control
      block, so struct k_msgq is again unchanged.

      Notification signals are kernel-originated: they fire in the
      context of whatever thread sends, not the registrant's, so signal
      generation exempts them from the sender-holds-permission check the
      same way timer expiry signals are exempt - the target thread was
      validated when the registration was armed.

      Covered by per-unit ZTESTs in the kernel msgq_api suite under a
      new kernel.message_queue.notify twister variant: fire-once and
      consumption, non-empty no-fire, signo-0, EBUSY/EINVAL/ENOTSUP
      errors, disarm, and ISR-generation sections.
  - path: zephyr/sys-msgq.patch
    sha256sum: 39c3ba8e6235bf2fafa5d94f0ce11f4fdc451dc794689d2f3aa1204c0aa4bbd5
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-30
    upstreamable: true
    comments: |
      lib: os: add sys_msgq, an OS-managed pool of named message queues

      Adds CONFIG_SYS_MSGQ: an OS-managed pool of named, priority-mode
      message queues opened and operated on through file descriptors -
      the substrate for POSIX message queues (mq_open() and friends),
      following the sys_timer/sys_thread pool pattern.

      sys_msgq_open() returns a zvfs descriptor of mode ZVFS_MODE_IMSGQ;
      sys_msgq_send()/receive()/getattr()/setflags()/notify() are system
      calls keyed by that descriptor, so no kernel object pointers are
      ever exposed to user mode, and zvfs_close() releases it. Naming,
      O_CREAT/O_EXCL, and unlink-with-deferred-destroy semantics live in
      the registry here rather than in the POSIX shim, which is what lets
      mq_open() work from user mode at all. Access mode and O_NONBLOCK
      are per-descriptor state, held in the fd entry's mode bits.

      Pool geometry follows the distributed-minimum idiom: SYS_MSGQ_MIN
      plus every CONFIG_SYS_MSGQ_MIN_ADD_* contribution is summed by the
      build system into the un-prefixed SYS_MSGQ_MIN, statically
      allocated and guaranteed, with SYS_MSGQ_MAX bounding the heap
      remainder. Statically allocated queues draw message storage from a
      parallel static buffer array bounded by CONFIG_SYS_MSGQ_BUF_SIZE;
      heap-allocated queues allocate storage sized to the request, so
      they are not bounded by that budget.

      Notification builds on the kernel signal registration from
      k_msgq_notify_arm(). Function-style notification (POSIX
      SIGEV_THREAD) is dispatched by a single kernel service thread,
      mirroring sys_timer: it accepts every function-notify queue's
      arrival signal (the reserved K_SIG_SYS_MSGQ, second-highest in the
      set as K_SIG_SYS_TIMER holds the highest) and spawns one detached
      system-pool thread per notification. Threads for registrations
      made from user mode run in user mode, in the registrant's memory
      domain, with the registrant's object permissions - so the whole
      notification surface works from user threads. Starting the
      dispatcher synchronizes on its signal mask being in place: an
      arrival that fired before the mask would reach default-action
      delivery and be discarded instead of staying pending.

      Covered by a new tests/lib/sys_msgq suite with per-unit ZTEST_USERs
      and libraries.sys_msgq{,.static_only,.userspace} variants.
  - path: zephyr/k-poll-triggered-work-poller-priority.patch
    sha256sum: bb3a36d816aac12a7cf1d88c50fc348523e4c0d83167827e024bcc9f0fe58ab5
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-10-06
    upstreamable: true
    comments: |
      Kernel bug, independent of posix-next: add_event() in kernel/poll.c
      reads the priority of a triggered-work poller through a k_thread it
      is not embedded in. sys_aio is the first consumer that pends two
      k_work_poll items on one object, which is how AddressSanitizer
      caught it.

      kernel: poll: order triggered work by its queue thread's priority

      add_event() keeps an object's poll events sorted by poller priority
      and reads that priority through poller_thread(), which assumes every
      z_poller is embedded in a struct k_thread. Triggered work registers
      the z_poller embedded in its struct k_work_poll, so the CONTAINER_OF
      yields a bogus thread pointer and the priority is read from whatever
      happens to precede the work item in memory. AddressSanitizer reports
      it as a global-buffer-overflow as soon as two pollers wait on the
      same object.

      Compare triggered work by the thread that will run it, its work
      queue thread, and treat a queue without one as lowest priority.
  - path: zephyr/sys-aio.patch
    sha256sum: 43e9beba50fcff80e6c21031421570eba72382a7a76b42623f3bc1a9e265b002
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-01
    upstreamable: true
    comments: |
      lib: os: add sys_aio, an OS-managed asynchronous I/O request pool

      Adds CONFIG_SYS_AIO: an OS-managed pool of asynchronous I/O requests
      over file descriptors, submitted and reaped with the sys_aio_*()
      system calls - the substrate for POSIX asynchronous I/O (aio_read()
      and friends), following the sys_timer/sys_thread/sys_msgq pool
      pattern.

      Requests are performed by a dedicated kernel service queue, started
      on first use. Descriptors with a waitable readiness condition
      (sockets, eventfds) are armed on ZVFS_POLLIN/ZVFS_POLLOUT readiness
      with k_work_poll over the events produced by zvfs_poll_prepare_fd(),
      so no thread parks while a request waits; always-ready descriptors
      (regular files), already-ready ones, and offloaded sockets execute
      directly on the queue thread. Publication and work submission share
      one critical section, so a successful k_work(_poll)_cancel() in
      sys_aio_cancel() always means the operation never ran, and requests
      claimed that way complete as ECANCELED with waiters woken and
      notifications fired.

      Handles are pool object pointers validated with elastipool
      membership on every call (stale or foreign handles fail with
      -EINVAL, as sys_timer), held by busy references so a slot can never
      be recycled under a concurrent sys_aio_wait()/sys_aio_error().
      Completion state is queried with sys_aio_error(), awaited with
      sys_aio_wait() (k_poll over per-request completion signals, so
      completion is sticky), and reaped with sys_aio_release(). Closing a
      descriptor mid-flight completes the request with EBADF: the service
      queue re-validates the fd entry's object before executing.

      Completion notification mirrors sys_msgq_notify: a signal (new
      K_SI_ASYNCIO code, generated kernel-side so the target needs no
      sender permissions; validated at submit) or a function dispatched
      in a fresh detached system-pool thread, in user mode in the
      submitter's memory domain when submitted from user mode. Completion
      groups (sys_aio_group_create()/finalize()) fire one notification
      when every member of a finalized group has completed - the
      substrate for lio_listio(LIO_NOWAIT) list notification - and
      destroy themselves after firing.

      Pool geometry follows the distributed-minimum idiom: SYS_AIO_MIN
      plus every CONFIG_SYS_AIO_MIN_ADD_* contribution is summed by the
      build system into the un-prefixed SYS_AIO_MIN, statically allocated
      and guaranteed, with SYS_AIO_MAX bounding the heap remainder.

      With CONFIG_SYS_AIO_PRIORITY (the substrate for POSIX
      _POSIX_PRIORITIZED_IO), ready requests are performed in priority
      order rather than submission order: sys_aio_req gains a
      thread-style priority, and ready requests are drained from a
      min-heap (CONFIG_MIN_HEAP) keyed on (priority, readiness sequence),
      so the service queue always executes the highest-priority ready
      request next, first-in-first-out among equals. Ready-queue storage
      keeps capacity >= outstanding requests - statically for the
      guaranteed pool minimum, growing by doubling alongside the elastic
      pool - so queuing at readiness time cannot fail, and a ready (not
      yet running) request is canceled race-free by removal from the
      heap. Readiness arming and the k_work_poll flow are unchanged; when
      the option is disabled the original per-request k_work FIFO path is
      compiled instead.

      aio_fsync() consumers need the synchronized-I/O open flags, so
      fdtable.h gains ZVFS_O_DSYNC/RSYNC/SYNC and the picolibc and newlib
      fcntl.h shims override the libc spellings to those values, the same
      way they already align O_NONBLOCK and F_GETFL/F_SETFL. A picolibc
      limits.h shim chains the SDK header to Zephyr's posix_limits.h -
      the SDK picolibc does not carry the POSIX limits
      (AIO_PRIO_DELTA_MAX and friends) - matching minimal and newlib.

      Covered by a new tests/lib/sys_aio suite with per-unit ZTEST_USERs
      over a FAT RAM disk and eventfds, and
      libraries.sys_aio{,.priority,.static_only,.userspace} variants;
      the priority variant proves priority-order execution and
      ready-state cancellation under a scheduler lock.
  - path: zephyr/arm64-userspace-libgcc-partition.patch
    sha256sum: df604ba2f609b7b591754568011309561ff4b1878c54352f3c505d6528d72765
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-04
    upstreamable: true
    comments: |
      Place libgcc's globals in the libc partition on arm64. The toolchain's
      prebuilt C libraries perform their atomics through libgcc's outline
      helpers, which consult __aarch64_have_lse_atomics on every call; with
      the flag in kernel bss, any such call from user mode (e.g. Picolibc's
      getc_unlocked()) faults. Zephyr's own code already builds with
      -mno-outline-atomics under CONFIG_USERSPACE.
  - path: zephyr/fs-add-rewinddir-utime-and-dirent-ext.patch
    sha256sum: f21c434d319abd563940d3aaaeca6bc45acccf637a97e4f1098a9a04770dcfe0
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-07
    upstreamable: true
    comments: |
      Rebased onto v4.5.0-rc1, which adds fs_normalize_path() beside the new fs_utime().
      Add fs_rewinddir() and fs_utime() to the file system API and the
      fs_file_system_t vtable, handling the VFS root pseudo-directory and
      read-only mounts in the core. Extend struct fs_dirent with access and
      modification timespecs behind the new CONFIG_FS_DIRENT_EXT so timestamp
      support costs nothing when disabled. Backends that implement neither
      operation report -ENOTSUP through the existing CHECKIF convention.
  - path: zephyr/fs-fatfs-rewinddir-utime.patch
    sha256sum: 57fc5b7471c9378984d45845215286f032e426074c69a6e012f4c2f36a88e015
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-07
    upstreamable: true
    comments: |
      Back fs_rewinddir() on FatFs with f_readdir(dp, NULL) and fs_utime()
      with f_utime() behind a new CONFIG_FS_FATFS_FF_USE_CHMOD (mapped to
      FF_USE_CHMOD in zephyr_fatfs_config.h). Under CONFIG_FS_DIRENT_EXT,
      stat and readdir results carry the modification timestamp, converted
      from the FAT date fields with timeutil_timegm64(); the write path uses
      gmtime_r() per the existing subsys precedent. FAT records no access
      time, so atime mirrors mtime, and timestamps outside 1980-2107 are
      rejected with -EINVAL. Covered by a new
      filesystem.fat.api.dirent_ext scenario whose test round-trips an
      explicit timestamp through the conversion and exercises rewinddir.
  - path: zephyr/fs-littlefs-rewinddir.patch
    sha256sum: 52c943645221f6677123c4e0f9a45a0791137bd4cc4c4e4b9678bfca9574b80f
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-07
    upstreamable: true
    comments: |
      Back fs_rewinddir() on LittleFS with lfs_dir_rewind() under the
      filesystem lock, following the littlefs_readdir() pattern. No utime
      hook is registered: littlefs records no timestamps, so fs_utime()
      reports -ENOTSUP through the core CHECKIF, which the extended
      test_lfs_basic asserts alongside a rewind-then-readdir check.
  - path: zephyr/zvfs-fs-relocate-path-ops.patch
    sha256sum: a7fddfd85cfe8a65e41ee16fda4c52559b54313c1921aa771445522e05faec61
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-07
    upstreamable: true
    comments: |
      Move zvfs_unlink() and zvfs_rename() out of the fd table into a new
      lib/os/zvfs/zvfs_path.c under CONFIG_ZVFS_FS, with their declarations
      relocated from fdtable.h to zvfs_fs.h, which becomes a registered
      syscall header. Pure relocation with no behavior change and no in-tree
      callers affected; isolates series-application risk from the syscall
      promotion that follows.
  - path: zephyr/zvfs-fs-path-syscalls.patch
    sha256sum: 466ef9f9d4d3dceeed3654da7d48c28444763a21250393e0a64d34d36a150b59
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-07
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/fs-add-rewinddir-utime-and-dirent-ext.patch
          - zephyr/zvfs-fs-relocate-path-ops.patch
    comments: |
      Rebased onto v4.5.0-rc1, which adds fs_normalize_path() beside the new fs_mount_flags().
      Promote zvfs_open()/zvfs_unlink()/zvfs_rename() to system calls and add
      zvfs_remove/stat/statvfs/fstatvfs/mkdir/rmdir/truncate/access/utime,
      each verifier copying the user path into a CONFIG_ZVFS_PATH_MAX kernel
      buffer per the sys_msgq_open() precedent (over-long paths report
      ENAMETOOLONG, bad pointers oops). zvfs_open() gains O_EXCL, unblocking
      a race-checked mkstemp(). struct zvfs_stat is extended with blksize,
      blocks, nlink, and timespec atime/mtime/ctime (filled from
      CONFIG_FS_DIRENT_EXT); modes are synthesized from a new
      fs_mount_flags() accessor since Zephyr file systems store no permission
      bits, which also drives access() W_OK -> EROFS on read-only mounts.
      struct zvfs_statvfs carries a reserved f_timestamp_resolution (0 until
      backends report it). ISO C remove() moves onto zvfs_remove(), gaining
      empty-directory removal as the standard requires, while zvfs_unlink()
      now rejects directories with EISDIR and zvfs_rmdir() rejects
      non-directories with ENOTDIR. zvfs_truncate() borrows a zvfs_fs_desc
      slot instead of putting a struct fs_file_t on the privileged stack.
  - path: zephyr/zvfs-dirent-syscalls.patch
    sha256sum: d95d391698573f5ad2e136814e0ef5f229ac02bf7bc99bdd7df4580edb1e0c13
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-07
    upstreamable: true
    comments: |
      Open directories as K_OBJ_FILE-backed file descriptors: zvfs_opendir()
      allocates a struct zvfs_dirstream from user-accessible storage
      (zvfs_dir_partition, CONFIG_ZVFS_DIR_MAX slots, kernel-side elastipool
      bookkeeping) plus a directory fd served by a dedicated fd_op_vtable
      whose close path finally routes through fs_closedir() and releases the
      stream. zvfs_readdir() fills a caller buffer through a verified system
      call and returns 1 at end-of-directory so POSIX readdir() can return
      NULL with errno untouched; zvfs_rewinddir() maps to fs_rewinddir().
      zvfs_open() honours the newly-defined ZVFS_O_DIRECTORY by producing a
      streamless directory fd, and directory fds answer ZFD_IOCTL_STAT and
      ZFD_IOCTL_STATVFS. Directory streams now consume an fd each,
      compensated by CONFIG_ZVFS_OPEN_ADD_SIZE_DIR in the fd table sizing.
  - path: zephyr/zvfs-cwd.patch
    sha256sum: 0a893427aa931fe20c711e2734fcea94124df7675f0ecb93099f37b8186f1d3e
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-07
    upstreamable: true
    comments: |
      Add a namespaced, ZVFS-owned current working directory: zvfs_chdir(),
      zvfs_fchdir(), and zvfs_getcwd() system calls over a single system-wide
      string (POSIX per-process semantics on a single-process system), with
      an internal zvfs_resolve_path() applied inside every path z_impl so
      supervisor and user callers get identical semantics with no TOCTOU
      window. Resolution is purely lexical, exact because the fs API has no
      symbolic links: collapse '//', drop '.', pop on '..' (a no-op at the
      root), and prefix the working directory for relative inputs; output is
      always absolute, as fs_open()/fs_opendir() require. Mount operations
      deliberately stay CWD-independent. Directory descriptors record their
      resolved path in zvfs_fs_desc for fchdir(). zvfs_getcwd() returns int,
      not a pointer, so the marshaller never round-trips an address; the
      POSIX getcwd() wrapper returns its own buffer. fopen(), remove(), and
      tmpfile() inherit the CWD for free via zvfs_open()/zvfs_remove().
  - path: zephyr/zvfs-userspace-tests.patch
    sha256sum: c0a499f527c023c21967552c1cd34eba2edb3f8156275839b52e820e48013edd
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-07
    upstreamable: true
    comments: |
      Add tests/lib/zvfs_fs: one ZTEST per ZVFS path, directory-stream, and
      working-directory system call, nearly all ZTEST_USER, over a FAT RAM
      disk, with a userspace twister variant. Covers O_EXCL and O_DIRECTORY,
      EISDIR/ENOTDIR/ENOTEMPTY tightening (tolerating FatFs' ENOENT/EACCES
      spellings), dirstream pool exhaustion, end-of-directory leaving errno
      untouched, relative resolution after chdir()/fchdir(), a table-driven
      zvfs_resolve_path() check, ENAMETOOLONG as a reported error, and a
      fault harness proving the verifier oopses on an unmapped path.
      Prove an ungranted user thread oopses on zvfs and zsock fd access
      (tests/net/socket/socketpair, tcp), that close revokes all grants including
      K_OBJ_FLAG_PUBLIC before slot reuse, and that user threads can write
      to the public stdio descriptors.
  - path: zephyr/libc-common-tmpfile.patch
    sha256sum: 625da03c90a12e2f7351b4797c25d1b91642bda5eaee8089fb66bc1e1ea28e91
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-07
    upstreamable: true
    comments: |
      Move tmpfile()/tmpnam() from the minimal libc into the common C library
      behind CONFIG_COMMON_LIBC_TMPFILE (default y with ZVFS and FILE_SYSTEM,
      mirroring COMMON_LIBC_REMOVE/FOPEN/FCLOSE) so newlib and picolibc get
      the ZVFS-backed implementation too. The generated name format shrinks
      to /tmp/NN: picolibc's L_tmpnam is only 8, so the previous 14-byte
      names could overflow a caller-supplied tmpnam() buffer; two digits
      cover every libc's TMP_MAX, and BUILD_ASSERTs enforce both bounds.
      The unreachable !ZVFS fallback and its LOG registration are dropped.
  - path: zephyr/kernel-mm-update-flags-per-page.patch
    sha256sum: df4cd55e9d088f549db88dc258943dd795bda816cb2421292c2c42dfdbf91f57
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-26
    upstreamable: true
    comments: |
      Rebased onto v4.5.0-rc1: the per-page remap keeps upstream's arch_mem_unmap()/arch_mem_map() result checks.
      kernel: k_mem_update_flags() resolved the physical address of the
      first page only and remapped the whole range as if it were physically
      contiguous. Anonymous pages from k_mem_map() are not, so every page
      after the first was re-pointed at a foreign frame. Resolve and remap
      each page on its own.
  - path: zephyr/arm64-mmu-partition-mapped-pages.patch
    sha256sum: 752658f4e0e20cb877ce4a8d07f245cf4002f7ea11cc202dca7b1b728ca83975
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-26
    upstreamable: true
    comments: |
      arm64: a memory-domain partition on memory-mapped pages (k_mem_map())
      is not identity mapped and its frames need not be contiguous, but
      arch_mem_domain_partition_add() mapped the whole partition at
      phys == virt. Follow the kernel's translation instead, one physically
      contiguous run at a time; memory the kernel does not map keeps its
      identity mapping, so device partitions are unchanged.
  - path: zephyr/kernel-mm-write-fault-hook.patch
    sha256sum: 4fc685d81bb753fbfb0c3c078e8a9854580371a07415e6f4feea6c30125c6b08
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-27
    upstreamable: true
    comments: |
      Rebased onto v4.5.0-rc1, which no longer has the *_sched_locked heap and cleanup variants.
      kernel: a hook for write faults on present pages, so a subsystem can
      track modifications to pages it manages by write-protecting them.
      Behind CONFIG_MEM_WRITE_FAULT_HOOK (ARCH_HAS_MEM_WRITE_FAULT, selected
      by X86_MMU, ARM_MMU and RISCV_MMU) the x86, arm64 and riscv fault
      handlers offer a write protection fault to z_mem_write_fault() before
      treating it as fatal; a true return retries the access. The resolver
      changes one page's protection in a memory domain through the new
      arch_mem_domain_page_attr_set(): x86 applies the attributes to the
      domain's tables and flushes the pages, arm64 privately maps the page at
      the kernel's translation, riscv maps it into the domain's private
      leaves and fences its ASID.
  - path: zephyr/arm-mpu-domain-apply-current.patch
    sha256sum: 8ba607f060e33806d0b47aeac8b5d66ff6af3fa1f4a315f8b02188a6781e0cf0
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-27
    upstreamable: true
    comments: |
      arm: the MPU is programmed from a thread's memory domain at context
      switch, so a partition added to or removed from the calling thread's
      own domain takes effect only once the thread is switched out and in
      again. ARCH_MEM_DOMAIN_APPLY_CURRENT (selected by ARM_MPU with
      USERSPACE) declares arch_mem_domain_apply_current(), which rebuilds
      the calling thread's dynamic regions at once; a caller that changes
      its own domain from a system call uses it before returning to user
      mode.
  - path: zephyr/riscv-pmp-domain-apply-current.patch
    sha256sum: 8be7c21167d1081eb360a4c9c0b46b4587d310d2aa328c313d2a04598c372e38
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-10-05
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/arm-mpu-domain-apply-current.patch
    comments: |
      riscv: pmp: apply memory-domain changes to the calling thread

      With PMP_KERNEL_MODE_DYNAMIC the kernel runs with MPRV set, behind the
      PMP entries of the user thread it serves, and v4.5 no longer clears
      those entries when it activates the kernel-mode set. A partition
      removed or changed from a system call therefore stays in force for the
      kernel until the thread returns to user mode: the refill of a
      read-only file mapping faults in the kernel. The RISC-V
      arch_mem_domain_apply_current() rewrites the user view and
      re-activates the kernel entries at once.

  - path: zephyr/zvfs-mmap.patch
    sha256sum: 0b62ee5dd5fdc61d676c4534f45746afa0ebc9c3323aa18a08136cdb3e2cdae8
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-26
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/kernel-mm-update-flags-per-page.patch
          - zephyr/arm64-mmu-partition-mapped-pages.patch
          - zephyr/kernel-mm-write-fault-hook.patch
          - zephyr/arm-mpu-domain-apply-current.patch
    comments: |
      Rebased onto v4.5.0-rc1: the ZVFS documentation joins upstream's service grid next to portability,
      and the stale *_sched_locked declarations are gone with upstream's heap rework.
      zvfs: memory mappings of file descriptors and anonymous memory behind
      CONFIG_ZVFS_MMAP: zvfs_mmap(), zvfs_munmap(), zvfs_msync() and
      zvfs_mprotect() system calls over a mapping registry. A mapping owns
      page storage (k_mem_map() pages with an MMU, a kernel-heap block at a
      64-byte granule without) and counts as a reference on its open file
      object next to the descriptors. File-backed mappings are filled at
      creation and, when
      shared and writable, written back on msync, unmap and owner exit,
      clipped to the file size. ZFD_IOCTL_MMAP becomes "address of the
      object's own pages", so shm objects are mapped in place and alias.
      User threads reach a mapping through a memory-domain partition on
      its pages, added to the caller's domain; the kernel view of owned
      pages follows the protection. Mappings belong to the creating thread
      and are moved to a graveyard by the halt path, released by the next
      mapping operation. Whole-mapping munmap/mprotect only. With
      CONFIG_ZVFS_MMAP_DIRTY_TRACK (MMU + write-fault hook) the pages of a
      shared writable file mapping start write-protected; the first write
      to a page faults into z_mem_write_fault(), which marks it dirty and
      makes it writable, and msync writes back only the dirty pages and
      protects them again.
  - path: zephyr/zvfs-shm.patch
    sha256sum: ec0cc5f10bdcff1479f9b0c938b4de6a46243b543c19e3744b5f77464fbfbe7f
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-27
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/zvfs-mmap.patch
    comments: |
      zvfs: shared memory objects behind CONFIG_ZVFS_SHM: zvfs_shm_open() and
      zvfs_shm_unlink() system calls over a pool of named, system-wide
      objects (CONFIG_ZVFS_SHM_MAX, names below CONFIG_ZVFS_SHM_NAME_MAX,
      compared by string). An object is sized once with zvfs_ftruncate()
      (EBUSY afterwards, its pages may be mapped), read and written at
      offsets, and answers ZFD_IOCTL_MMAP with its own pinned pages so
      zvfs_mmap() maps it in place and every mapping aliases. The name is a
      lookup key only: unlink drops it at once, O_CREAT recreates it, and
      the object is freed with its last descriptor or mapping, counted
      together by zvfs_fd_obj_refcount(). tests/lib/zvfs_shm covers open,
      create, exclusive, truncate, read/write, unlink semantics, pool
      exhaustion and the aliasing mapping in kernel and user mode.
  - path: zephyr/k-process-core.patch
    sha256sum: 3dd8ee24618e3870f7b2ba90f6d70c430b916b5eea29e5befc8c8a9166007531
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-10
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-tss.patch
          - zephyr/kernel-k-thread-stack-alloc-flags-uint32.patch
          - zephyr/k-timer-clock.patch
          - zephyr/k-msgq-prio.patch
          - zephyr/sys-sem-track-blocked-waiters.patch
    comments: |
      Rebased onto v4.5.0-rc1: Kconfig.process is sourced beside upstream's userspace/Kconfig.
      Introduce the kernel process (thread group) API surface: one
      schedulable entity, a process identified by its thread group leader,
      so a process handle (k_pid_t) is a thread handle. struct k_process is
      the kernel-owned record of one thread group; process groups
      (k_pgrp_t) and sessions (k_session_t) are first-class handles over
      member-list cells, existing exactly as long as they have members.
      kernel/process.h carries types, constants, and macros only
      (K_PROCESS_DEFINE composing K_THREAD_DEFINE, K_PROCESS_DEFINE_EXT,
      K_SESSION_DEFINE, K_PROCESS_GROUP_DEFINE, K_THREAD_DEFINE_EXT); the
      __syscall declarations live in zephyr/kernel.h under CONFIG_PROCESS,
      with handle types visible in every configuration for the generated
      syscall prototypes. Static topology is wired at build time -
      intra-file by C initializers, cross-TU by the mandatory
      gen_process_topology.py post-link pass. Handles resolve by
      identity-value scans and are never dereferenced; only caller-provided
      records passed to k_process_init() are kernel objects
      (K_OBJ_PROCESS), validated like thread objects; k_object_free()
      refuses to free a live or unreaped record - its memory is
      reclaimed at reap.
  - path: zephyr/k-process-exit-wait.patch
    sha256sum: e93698ed06ca2b48599adc7f1b58022c4859884d3bea81b66028f20199aca58f
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-10
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/sys-aio.patch
          - zephyr/zvfs-fs-relocate-path-ops.patch
          - zephyr/k-process-core.patch
    comments: |
      Rebased onto v4.5.0-rc1: z_sched_wake() is an inline there, so only z_sched_waitq_pend_if() and
      z_sched_wake_thread_locked() are declared; the process hooks sit in upstream's split thread setup.
      Implement the k_process lifecycle over the core API: threads join
      their creator's process at creation (z_process_init_thread) and leave
      in the scheduler halt epilogue (z_process_exit_thread); the idle
      threads and the boot thread belong to the idle process, boot-time
      kernel threads to the kthread process, and user threads descend from
      init; the reserved trio is wired at build time. The kernel neither
      allocates nor calls an allocator: k_process_init() initializes
      caller-provided records (-EBUSY on busy records or leaders) and a
      live-record registry resolves them. Everything allocation-adjacent
      lives in lib/os/process.c under CONFIG_SYS_PROCESS: elastipool
      records and group/session cells with graveyard-deferred heap
      reclamation and the sys_process_id() numbering tables. Creation is
      one primitive with tiers: sys_clone() without flags makes a new
      process from a caller-provided leader thread, and SYS_CLONE_THREAD
      makes a thread in the calling process - a plain new thread without
      CONFIG_PROCESS, so process-less behavior is identical -
      with sys_thread_create() a thin wrapper packing the tier and
      SYS_CLONE_PAUSED deferring the start. The dispatch and thread tier
      live in a new lib/os/clone.c, built (and the sys/thread.h syscall
      surface generated) whenever SYS_THREAD or SYS_PROCESS is enabled;
      the process tier stays in process.c as z_sys_clone_process(), with
      an ENOTSUP stub, forward-declared at its single consumer. Beneath
      it, k_clone() is the public no-alloc kernel primitive: the caller
      provides the thread, stack, and process record; both tiers,
      K_CLONE_PAUSED, full userspace verification. Struct and flag
      definitions sit outside the config guards because generated
      syscall prototypes reference them unconditionally, the established
      handle-type rule. Provider frees error (-EINVAL) on memory the
      provider does not own - static or caller memory recycles in place.
      k_exit()/k_waitpid() implement zombie/reap with process_lock nested
      inside the scheduler lock (z_sched_waitq_pend_if); SIGCHLD emission
      defers to a notifier thread.
  - path: zephyr/k-process-sigchld.patch
    sha256sum: 2dcfa8e9fec61d0fb91467b1260877e224d89281aaed253e87fd6956a9701630
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-11
    upstreamable: true
    comments: |
      Extend struct k_sig_info with pid/status fields and add the
      K_SI_CLD_EXITED / K_SI_CLD_KILLED codes (gated on CONFIG_PROCESS);
      widen the internal z_sig_queue_common() to carry them and add
      z_sig_queue_chld() (declared in the lifecycle patch). kernel/process.c
      emits K_SIG_CHLD to a zombie's parent from a notifier thread, since
      signal generation cannot run in the scheduler's thread-halt path.
  - path: zephyr/k-process-pgrp-session.patch
    sha256sum: 8e539f10dc6e8e95b1ef04b5cb7ad35d966a39a6f45cc573f436e93e2aba22b5
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-11
    upstreamable: true
    comments: |
      Complete process-group and session control: k_setpgid() joins live
      groups (session rules; the user-mode handler validates the group and
      every member record via z_pgrp_validate);
      k_process_group_init()/k_session_init() initialize caller-provided
      cells, erroring -EBUSY first on busy cells; sys_setpgid()/sys_setsid()
      are the pool-backed tiers in lib/os, numbering the new group or
      session once the kernel primitive succeeds. k_kill() is
      process-directed via identity resolution (leader handles first, then
      any live member's handle); k_kill_pgrp() fans out to every member
      process in bounded batches with the lock dropped between them;
      k_waitpid_pgrp() waits on a group's children. Process-directed
      delivery picks an unblocked member thread (process_sig_target),
      preferring the caller for self-signals; z_syscall_sig_check() skips
      delivery while a user syscall is in progress so wrappers reached in
      kernel context cannot corrupt the syscall return frame.
  - path: zephyr/k-signal-process-scope.patch
    sha256sum: 86ada6000b7e6dc59181a0913a960fcd941df863ba7ad9e6176c9980f243261a
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-16
    upstreamable: true
    comments: |
      Process-directed signals with no eligible recipient now pend at
      PROCESS scope instead of being pinned to a thread at generation time:
      the fifo element carries a process target, any member thread's
      pending-set, sigwait matching, and return-to-user delivery consider
      its process's pending signals alongside its own (a per-process
      pending counter extends the fast path), and whichever member first
      unmasks or waits claims the signal - strict POSIX semantics for
      fully-masked processes. k_kill(), k_kill_pgrp(), and the SIGCHLD
      notifier queue at process scope when process_sig_target() finds no
      unmasked member; process-scoped entries are dropped at reap, along
      with any unclaimed K_SIG_CHLD notification about the reaped child -
      its status has been collected, and retiring the entry keeps a parent
      that never sigwaits from pinning queue slots.
  - path: zephyr/k-signal-scope-queue-lock.patch
    sha256sum: 1d92d92461ce411af898964acb5c0766537842b5757481b2f65f6027012461f2
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-17
    upstreamable: true
    comments: |
      Queue process-scoped pending signals while still holding the process
      lock, in k_kill(), k_kill_pgrp(), and the SIGCHLD notifier: the
      process lock -> signal lock order is already established by the
      reap-time drop, and queueing under it closes the window where a
      process could be reaped between target resolution and the queue,
      leaving an element aimed at a retired record. k_kill() also now
      distinguishes an empty (zombie) process (-ESRCH) from a fully-masked
      one (pend at process scope).
  - path: zephyr/sys-clone-pool-leader.patch
    sha256sum: 8bbc82cf8648745221683a85de662806a59c7a416330ffe8cab2e6a3aba28f92
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-16
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-signal-process-scope.patch
    comments: |
      Rebased onto v4.5.0-rc1: the join epilogue lives in kernel/thread.c there.
      sys_clone() gains the pool-drawn leader tier: when the caller provides
      no thread object, the leader thread and its stack come from the system
      thread pools via sys_thread_create_paused(), and the record is marked
      K_PROCESS_FLAG_LEADER_RELEASE. A pool leader's TCB remains the
      process's pid identity until reap, so the destruction paths reached
      by k_thread_rejoin() and detached exit first ask
      z_process_leader_pinned() (under the process lock): joining a dead
      leader is synchronization only, and the release stays with the reap
      path. At reap the kernel calls z_process_leader_release()
      (static-inline no-op without CONFIG_SYS_PROCESS) for pool-owned
      leaders only; lib/os parks the dead leader on a release list drained
      at the next spawn, where
      sys_thread_destroy() returns thread and stack to the pools - reap can
      run under the scheduler lock, where the pools' heap tier is off
      limits. The user-mode sys_clone() handler validates caller-provided
      thread/stack objects only when they are supplied; the pool path needs
      no caller objects.
  - path: zephyr/sys-clone-sigmask.patch
    sha256sum: ac424db48714d5cb89bc7f0f39648f3fc320a5c2c7dfb627be6bcaf2370bf16a
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-17
    upstreamable: true
    comments: |
      The clone args take an optional initial signal mask for the new
      thread or leader: NULL keeps the thread-creation inheritance
      rules; a non-NULL mask is vrfy-copied and seeded before the
      thread first runs. As with k_sig_mask(), a user-mode request
      cannot mask K_SIG_KILL or K_SIG_STOP, while a kernel-mode
      caller's mask is honored verbatim. k_clone() carries the same
      field with the same rule. This gives posix_spawn() a
      caller-mode-independent way to implement POSIX_SPAWN_SETSIGMASK.
  - path: zephyr/k-process-perms.patch
    sha256sum: 89579dbf91a7117ff03844224ebaacb888dbe84544746382b6f9c05d2dba2789
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-16
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/kernel-userspace-smp-use-after-free.patch
          - zephyr/kernel-userspace-thread-idx-alloc-smp.patch
          - zephyr/sys-clone-sigmask.patch
    comments: |
      Rebased onto v4.5.0-rc1, whose SMP-safe clear_perms_cb_locked() sweep (zephyr#108721) takes the
      place of the v4.4.1 callback under the same CONFIG_PROCESS guard.
      With CONFIG_PROCESS, the process - not the thread - is the kernel-object
      permission principal: every thread of a process can already write every
      other member's data, so per-thread object permissions within a process
      add no isolation. Each kernel object's permission bitmap shrinks from
      one bit per thread (CONFIG_MAX_THREAD_BYTES) to one bit per process
      (CONFIG_MAX_PROCESS_BYTES), the permission-principal index lives once
      in struct k_process (claimed at record initialization, released at
      reap), and permission checks resolve through the calling thread's
      process. Granting to any member thread grants the process. Thread death
      no longer walks the object table - a single sweep at process reap
      replaces it, which also lets dynamically allocated leader thread
      objects persist to reap as the identity design requires. sys_clone()
      re-grants the leader its own thread and stack objects after the child
      is re-homed out of the caller's process. Configurations without
      CONFIG_PROCESS keep the thread-indexed scheme unchanged.
      The boot thread that drops to user mode with k_thread_user_mode_enter()
      leaves the idle process for init, carrying its grants with it: the idle
      process never parents created threads, so a user thread it created would
      land in init without permission on the objects its creator allocated.
  - path: zephyr/k-process-prune.patch
    sha256sum: 37d7713f7649d2a7efe00526573d517d99712a73c6a3af4a8d5597308acb26a4
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-16
    upstreamable: true
    comments: |
      Add k_process_prune(): abort every other member thread of the calling
      process, leaving the caller as the sole member with the process's
      identity, parent, and group membership unchanged. This is the kernel
      substrate for replacing a process's image in place - exec-style
      loaders terminate the old image's threads and continue on the calling
      thread. The abort loop drops and retakes the process lock around
      k_thread_abort(), which cannot run under it.
  - path: zephyr/sys-thread-restart.patch
    sha256sum: b8e9446ee185e9ef97ca522c9da9202fe6b43c48c5925db7d26172913c185d72
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-18
    upstreamable: true
    comments: |
      The exec() model with the thread and stack reused in place, as in
      Linux: arch_stack_jump() (ARCH_HAS_STACK_JUMP; three-instruction
      shims for Cortex-M, arm64, riscv32/64, x86, and x86-64) resets the
      calling thread's stack pointer and enters a function that never
      returns, abandoning every live frame. sys_thread_stack_stage()
      reserves a block at the top of the calling thread's own stack for
      data that must survive - the argument vectors, Linux's
      setup_arg_pages() analog - and sys_thread_restart() resets SP to
      just below it, Linux's start_thread() analog for kernel-mode
      callers. No new thread, no pool draw, no reaping: same thread, same
      stack, pid trivially preserved, signal mask and priority naturally
      retained. Architectures without the shim (native_sim: host pthread
      stacks) report -ENOSYS and callers fall back to running in place.
  - path: zephyr/k-process-native-topology.patch
    sha256sum: 14089a3f5591226e0385d71cba179e09939a2d2ad42bf9e924b4064702aafe38
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-18
    upstreamable: true
    comments: |
      Native binaries are host-linked after the Zephyr link, so the
      post-build static-topology assembler sees a relocatable object -
      no loadable segments, section-relative symbols, membership
      pointers still in relocations - and cannot patch it (nor could a
      pass over the final host executable: RELA architectures keep
      pointer initializers in relocation addends). Skip the hook under
      CONFIG_NATIVE_BUILD and assemble the K_SESSION_DEFINE /
      K_PROCESS_GROUP_DEFINE membership lists at PRE_KERNEL_1 boot
      instead, where every pointer is real; ROMable targets keep the
      link-time-only assembly. The suite's per-test child fixtures also
      consolidate into one shared trio (tests run sequentially and reap
      their children, so dedicated objects per test bought nothing),
      and the userspace scenario sizes the kernel-object permission
      bitmap for SMP platforms, whose per-CPU statics still exceed the
      default 16-thread bitmap.
  - path: zephyr/sys-thread-ids.patch
    sha256sum: 0b33d695e81177bc3026625de6dec6dcac46d8560b501e632a9aa9f77e0c5593
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-18
    upstreamable: true
    comments: |
      Thread-granular numbering in the same number space as process IDs:
      a thread-group leader's thread ID is its process
      ID (a member promoted to leader by clone keeps its number - the
      pid entry adopts it), member numbers retire at thread death while
      a leader's persists until reap, and thread numbers start above the
      three reserved process identities. sys_thread_id() and
      sys_thread_find() extend the numbering surface; the sizing knob is
      CONFIG_SYS_THREAD_IDS (0 disables member numbering; leaders still
      resolve). Deliberately adds no POSIX consumer:
      pthread_t remains a handle.
  - path: zephyr/sys-clone-fork-tier.patch
    sha256sum: b81256b73a2ed04a4cbdb24fd925243c9119e2e97685b3cb7d33529273542070
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-16
    upstreamable: true
    comments: |
      Define the fork model over sys_clone(): SYS_CLONE_VM_COPY asks for a
      child that receives copies of the caller's writable memory at the same
      virtual addresses and resumes at the clone point, and sys_fork() is
      the resume-style wrapper (returns the child handle to the parent, NULL
      to the child). Copied memory is what makes the model sound where vfork
      was not - the child cannot disturb the parent's stack, and a plain
      setjmp/longjmp resumes the child because every address it restores is
      valid in its own copy. The record and pipeline are in place down to
      process_vm_clone(), which returns -ENOSYS until per-process virtual
      address spaces (per-domain tables mapping fresh frames at the caller's
      addresses) exist; undefined flags are -EINVAL, distinguishing them
      from the awaiting-substrate path. SYS_CLONE_VM_COPY excludes
      SYS_CLONE_THREAD, and a seeded signal mask is invalid with it -
      a forked child always inherits the caller's mask.
  - path: zephyr/k-process-vm.patch
    sha256sum: f24616dc2d3805a39584aa2bc19c1b15b4afb83e8e3235a5f885d3dbf02998ad
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-17
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-condvar-clockwait.patch
          - zephyr/k-signal-scope-queue-lock.patch
          - zephyr/k-process-perms.patch
          - zephyr/sys-thread-restart.patch
          - zephyr/sys-clone-fork-tier.patch
    comments: |
      Per-process virtual address spaces and fork(), the generic layer
      (CONFIG_PROCESS_VM, experimental, default n, on architectures that
      select ARCH_HAS_PROCESS_VM and ARCH_HAS_FORK_RESUME). The arch hook
      z_mem_domain_clone_remap() repoints a domain's page-table entries
      at fresh frames (no TLB flush: the child is not yet live); the
      system layer's process_vm_clone() builds the forking child's domain
      by mirroring the parent's partitions and copying the writable ones
      and the stack onto fresh frames; sys_clone(SYS_CLONE_VM_COPY) and
      POSIX fork() resume the child from its parent's captured syscall
      frame with the return-value register zeroed: the leader is created
      as a supervisor pool thread via a trusted create (kernel-generated
      pool objects skip user-syscall revalidation, which would demand
      K_USER), the resume staged through arch_fork_frame_init() and
      arch_fork_resume(), the thread marked a user thread before its
      first instruction. The child's TLS is the parent's address (the
      clone copies that region, the child resumes on the parent's stack
      address, and TLS lives above it), so PROCESS_VM excludes
      CURRENT_THREAD_USE_TLS, whose kernel-mode reads of the TLS-cached
      current thread would alias the parent's physical memory through
      the shared kernel page tables. A clone context's memory domain is
      initialized once and emptied for reuse (an architecture may never
      return a domain's page tables), the VM-copy path runs the leader
      release collection a plain clone runs, and the VM is torn down
      from the exit path under the scheduler lock, where the heap is off
      limits: the copied frames go to a graveyard drained by the next
      fork. Also delivers k_kill()/k_kill_pgrp() to their kernel-resolved
      thread through z_sig_queue_thread(): kill() authorization is
      process-level, established by identity resolution. Per-architecture
      substrate and resume follow: riscv64, arm64, x86.
  - path: zephyr/k-process-fork-riscv.patch
    sha256sum: 0e18552d77782f5f72bb977ce0a0e0413631ae2b702b7d9a138a670112423e25
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-13
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/riscv-mmu-support.patch
          - zephyr/riscv-mmu-domain-mappings.patch
          - zephyr/k-process-vm.patch
    comments: |
      riscv64 fork support: memory substrate and resume. RISCV_MMU selects
      ARCH_HAS_PROCESS_VM and ARCH_HAS_FORK_RESUME. z_mem_domain_clone_remap()
      privatizes the leaf tables covering the range and repoints them at
      the copy frames, as writable user memory. Unlike x86 without KPTI
      and arm64, the RISC-V kernel cannot run on the process's page tables:
      user mode executes kernel text there, and S-mode cannot fetch from a
      user page, so every trap from user mode switches to the kernel's own
      tables - where a forked child's addresses still resolve to the
      parent's frames. A domain whose memory diverges therefore gets a
      kernel view: its own tables, with the leaf tables covering kernel
      text copied and PTE_USER clear, everything else shared with the user
      view so the diverged leaves are seen by both. Threads of such a
      domain trap into that view and are switched onto it (a per-thread
      kernel SATP), so system calls read and write the child's copies, as
      do the kernel's thread-local accesses (the user-mode flag lives in
      TLS on RISC-V). The resume stages a copy of the parent's syscall
      frame where a live user trap would build it, at the top of the
      child's privilege stack, seeds the callee-saved registers banked at
      syscall entry (the C convention preserves them through the kernel,
      so the exit path never restores them), zeroes a0 and leaves through
      the common exception exit path: privilege-stack bookkeeping, the
      domain SATP switch and sret included. Floating-point state is not
      inherited.
  - path: zephyr/arm64-mmu-globalize-partial-block.patch
    sha256sum: 9fff6fa49381de6b638183ee25143cd788316687589856ea834b2ac608f5a48d
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-25
    upstreamable: true
    comments: |
      arm64: mmu: globalize a range whose global mapping is a block. When a
      private page table stands in for a block of the global tables (a range
      inside the block was changed for one domain) and part of that block
      later goes global again, globalize_table() asserted that the global
      side had to be a table too and, with assertions off, recursed into a
      block descriptor as if it were a table. Restore the entries of the
      partial range in the private table from the block instead, dropping
      any subtable that stood there. Seen when a forked process's domain is
      torn down while its sibling keeps private copies under the same block.
  - path: zephyr/k-process-fork-arm.patch
    sha256sum: 373acf7ef1bf6a6794236aae8cd668ac37ebe806825c26ea3566e309ea837942
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-17
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/user-signals-arm.patch
          - zephyr/k-process-vm.patch
    comments: |
      arm64 fork support: memory substrate and resume. ARMv8-A/ARMv9-A with
      the MMU select ARCH_HAS_PROCESS_VM and ARCH_HAS_FORK_RESUME.
      z_mem_domain_clone_remap() is a thin wrapper over private_map(),
      which privatizes the leaf translation tables before installing the
      copy-frame mapping, so cloned writable ranges isolate per domain. The
      resume needs no new exit path: every arm64 thread is born through
      z_arm64_exit_exc popping a synthetic ESF, so arch_fork_frame_init()
      rewrites the paused child's birth ESF with the parent's captured
      syscall frame (x0 zeroed, EL0 SPSR) and seeds callee_saved.x19-x28 -
      captured by a small SVC-dispatch block while they still hold the
      caller's values - plus sp_el0; the context switch and eret deliver
      the child straight to user mode at the fork call site with complete
      parent/child stack and data isolation. AArch32 Cortex-A has an MMU
      but no userspace support in Zephyr yet; a 32-bit resume flavor slots
      in here once that substrate exists.
  - path: zephyr/k-process-fork-x86.patch
    sha256sum: 8833e2149d21048d2b2251232da05f48296e032b9f8280628b59946615fa3721
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-17
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-process-vm.patch
    comments: |
      x86 fork support: memory substrate and resume, 32- and 64-bit.
      x86 with the MMU, separate page tables per domain and no KPTI
      selects ARCH_HAS_PROCESS_VM; z_mem_domain_clone_remap() repoints
      a domain's page-table entries at fresh frames, keeping each page's
      flags (under KPTI the kernel runs on the shared kernel tables, so a
      syscall on the child's behalf would read the parent's frames
      behind the child's private copies). intel64: the syscall entry also
      saves the callee-saved registers (the C convention preserves them
      through the kernel, so the exit path never restores them, but a
      forked child has no such history), gives the signal-delivery RAX
      stash a dedicated frame slot, and pads the frame so the fxsave area
      stays 16-byte aligned; arch_fork_frame_init() stages a copy at the
      top of the child's privilege stack - exactly where a live syscall
      would build it - and z_x86_fork_resume() loads the callee-saved
      registers, zeroes RAX, and enters the common syscall exit path
      (page-table switch and sysret included). ia32 is smaller: the syscall
      convention passes arguments in the callee-saved registers, so the
      entry's argument slots already bank the caller's complete state; only
      ESI (the syscall id register) needs a per-thread stash, and the
      resume stages the argument-slot/iret-frame block and re-enters the
      iret-based exit path with EAX zeroed.
  - path: zephyr/zvfs-fd-descriptor-split.patch
    sha256sum: 50760f5d391cdce619fcab6a828789a79f0a84e95f7b389c022243b1f98eb9be
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-19
    upstreamable: true
    comments: |
      Split file descriptors from open file descriptions, the POSIX (and
      Linux) model the single fd table conflated: a descriptor is now a
      slot pairing a number with a description pointer and the
      descriptor's own FD_CLOEXEC flag, while descriptions - obj,
      vtable, offset, mode, and the I/O lock - live in a system-wide
      pool whose refcount now counts referencing descriptors. dup() and
      dup2() share the source's description instead of copying it, so
      dup'd descriptors share one file offset as POSIX requires and the
      offset-broadcast workaround in zvfs_fd_offset_set() is deleted.
      Slot exhaustion is EMFILE, pool exhaustion ENFILE. One boot
      descriptor table serves every thread; hanging per-process tables
      off the process record builds on this split.
  - path: zephyr/zvfs-per-process-fds.patch
    sha256sum: 0aae9c16593f3440dd89c40af0b45289ba9d51344b4cbb447ee0cdbd205e909f
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-19
    upstreamable: true
    comments: |
      Per-process file descriptor tables over the descriptor/description
      split, gated implicitly by PROCESS - no feature Kconfig. A cloned
      process's table is a copy of its parent's (descriptors share the
      descriptions, per-descriptor FD_CLOEXEC copied), built by
      sys_clone() before k_process_init() so failures unwind cleanly;
      the record's fds pointer is opaque to the kernel like the VM
      context, and NULL shares the boot table - kernel processes and
      k_process_init()-only callers need no hook. Exit closes the dying
      process's descriptors in k_exit()'s own sleepable context (POSIX:
      at termination, not reap); reap detaches the table under the
      process lock onto a graveyard whose closes and frees run at the
      next table allocation. Tables come from an elastipool whose static
      slab rides the process-record sizing (SYS_PROCESS_MIN, with heap
      growth beyond), so static configurations spawn without a heap. zvfs_fds_cloexec() sweeps the caller's own
      table for exec - the POSIX layer's fcntl loop was bounded by
      POSIX_OPEN_MAX, whose ZVFS default (3) never reached a real fd.
      posix_spawn() file actions get child-table operations (set, dup2,
      close on the paused child), replacing the parent-side application
      that was only valid in a global fd space. CONFIG_ZVFS_PROC_OPEN_MAX
      sizes each table (0 = the system-wide size; must not exceed it -
      fd_set bitsets are system-sized). Library-side user-mode callers
      (fileno, FILE locking) resolve the boot table: they cannot read the
      thread struct or a dynamically placed table; per-process resolution happens
      kernel-side in syscalls. The kernel.process init-scenario test
      orders its two-thread start deterministically - the exiting leader
      could abort its sibling before the sibling recorded its pid, a
      latent race made more visible by the k_exit() close sweep.
  - path: zephyr/zvfs-mmap-per-process.patch
    sha256sum: b389ec95a07884a299d0895b2ea1226fe6a28f15d9f0a0e02efbaf1bea1380dd
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-27
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/zvfs-mmap.patch
          - zephyr/zvfs-per-process-fds.patch
    comments: |
      zvfs: with CONFIG_PROCESS a mapping belongs to the creating thread's
      process and mapping operations reach the caller's process's mappings
      only. A process exiting through k_exit() releases its mappings in its
      own context, before its descriptors (z_process_mmap_exit()); one whose
      last thread returns has them marked at the reap (z_process_mmap_drop())
      and released by the next mapping operation. A process cloned with its
      address space inherits the parent's mappings as copies leaning on the
      original for the pages; the clone skips the pages of shared mappings
      (z_zvfs_mmap_is_shared()) so they stay shared, write faults on tracked
      pages reach the copies' domains, and the last copy releases an
      original its owner has unmapped. tests/lib/zvfs_mmap gains process,
      process.userspace and process.vm scenarios.
  - path: zephyr/k-process-times.patch
    sha256sum: f3f3deaba67eb274421040c736a7f75654a979098e45a7c6fbe379e5a8e6a6ed
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-17
    upstreamable: true
    comments: |
      Per-process CPU accounting for times(): struct k_process gains
      self_cycles (accumulated as member threads exit) and child_cycles
      (rolled up from reaped children and their children) under
      CONFIG_SCHED_THREAD_USAGE. k_process_cpu_stats() returns the calling
      process's cycles (live members plus exited members) and its reaped
      children's cycles, letting POSIX times() fill tms_utime and tms_cutime
      correctly (Zephyr has no user/system split, so tms_stime/tms_cstime
      are zero).
  - path: zephyr/libc-spawn-header-shims.patch
    sha256sum: cf179c17d94d8e99ac1015478d57972389c091dae6766cb2ae4fa2c0de8c2219
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-16
    upstreamable: true
    comments: |
      Route <spawn.h> to <zephyr/posix/spawn.h> for picolibc and newlib,
      following the existing shim pattern (<aio.h>, <dirent.h>, ...): the
      toolchain libcs ship their own <spawn.h> whose types do not match the
      Zephyr implementation, and the shim directories override the
      toolchain headers.
  - path: zephyr/libc-multi-process-headers.patch
    sha256sum: e70236b0424ab39e83b838f7ea435a8660821c225e9948e7ee33563b9406ca44
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-10
    upstreamable: true
    comments: |
      Add <sys/wait.h> forwarder shims for picolibc and newlib so that
      the header resolves to the Zephyr POSIX <zephyr/posix/sys/wait.h>
      rather than the partial toolchain copy, which declares only wait()
      and waitpid() and lacks waitid(), idtype_t, id_t, and the P_*
      constants, and whose W* macros would conflict with the
      Zephyr-native K_WSTATUS_*-derived definitions. Full replacement
      rather than include_next, following the sys/select.h and
      sys/statvfs.h precedents: independent C library headers must be
      independent.
  - path: zephyr/libc-common-exit.patch
    sha256sum: 22dcb7d6209ae2ea8dbdeb4fd01288d9c9342b17aa80d7faf1094673556b180a
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-10
    upstreamable: true
    comments: |
      Promote exit() and atexit() from the minimal libc into the common C
      library (COMMON_LIBC_EXIT, following the COMMON_LIBC_TMPFILE
      precedent), with the registry sized by COMMON_LIBC_ATEXIT_MAX
      (default 32, the ISO C minimum, replacing minimal's 8 fixed slots).

      This also makes the ISO C exit sequence real for picolibc: the
      prebuilt (SDK) picolibc registers atexit() handlers into a stub and
      its exit() runs only __libc_fini_array before _exit, so handlers
      never execute. With COMMON_LIBC_EXIT (default y for minimal libc
      and picolibc), exit() runs registered handlers in reverse
      registration order and then _exit() terminates the program.

      Documented deviations, unchanged from the minimal libc behaviour:
      open streams are not flushed on exit and fini-array functions do
      not run (nothing on Zephyr registers them at exit today; newlib
      keeps its own complete exit machinery and is not affected).

      Route _exit() to k_exit() when CONFIG_PROCESS is enabled, so exit()
      and _exit() terminate the calling thread's process rather than
      spinning forever. Provided as a common C library unit
      (COMMON_LIBC_UNDERSCORE_EXIT, default y when PROCESS is set): the
      strong definition overrides the weak picolibc and newlib stubs, and
      the minimal libc's non-weak stub is gated out at build time. Without
      CONFIG_PROCESS the common _exit() reproduces the prior
      report-and-halt behaviour, and the per-C-library stubs are used as
      before.
  - path: zephyr/k-signal-process-conformance.patch
    sha256sum: 0f991cd01f3f188795486c70b6a2c29ae859722c3033f27ec047946c76c65d31
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-27
    upstreamable: true
    comments: |
      Process-directed signal conformance over CONFIG_PROCESS: signal
      dispositions become a property of the process (installed by any
      member, in force for every member, purged at reap), duplicated into
      new processes by sys_clone() - every disposition for the fork tier,
      ignored dispositions only for a fresh image (fork+exec semantics).
      k_sigqueue() carries a value with k_kill()'s process-directed
      delivery, and k_kill_all() broadcasts to every process except the
      caller's and the reserved system records, batched like
      k_kill_pgrp(). Without CONFIG_PROCESS the system is the single
      (figurative) process: k_kill()/k_sigqueue() prefer an eligible
      caller and otherwise pend at system scope, claimable by the first
      thread to unblock or wait for the signal. Also corrects
      process-scope pending delivery: the claim path resolves the action
      in force for the claiming thread, decrements the counter matching
      the entry's scope, and z_sig_handle() includes process and system
      scope in its entry gate.
  - path: zephyr/zvfs-unlink-on-close-tmpfile.patch
    sha256sum: 37877dfeb9acc300dabf0becb9581d4d0958b94a2535b78f4814ae9e2e26430d
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-27
    upstreamable: true
    comments: |
      ZVFS unlink-on-close: zvfs_unlink_on_close() marks an open file
      description so that its path is removed on the description's final
      close, wherever that close happens - an explicit close or the
      descriptor sweep at process exit. tmpfile() marks its descriptor,
      restoring the ISO C semantics: the file is removed when the stream
      is closed and, with CONFIG_PROCESS, when the process terminates.
      Without process support a stream that is never closed leaves its
      file in place, as there is no process termination to remove it at.
  - path: zephyr/zvfs-pipe.patch
    sha256sum: 70e310a4d941c610817d716861e6d95baba53b6fa4c75f822b4c05a7c2addf64
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-28
    upstreamable: true
    comments: |
      Add zvfs_pipe(): a unidirectional byte channel between two file
      descriptors, modeled on zvfs_eventfd. Each pipe pairs distinct
      read-end and write-end objects over a shared ring buffer so per-end
      close semantics work with the description refcount: closing the last
      write descriptor raises end-of-file (and POLLHUP) at the read end,
      and closing the last read descriptor fails subsequent writes with
      EPIPE (raising K_SIG_PIPE at the writer under CONFIG_SIGNAL) and
      POLLERR at the write end. Writes of at most ZVFS_PIPE_BUF_SIZE bytes
      are atomic. Registered with ZVFS_MODE_IFIFO so poll routes through
      ZFD_IOCTL_POLL_PREPARE/UPDATE; ZVFS_F_GETFL/SETFL, FIONBIO, and
      FIONREAD are supported. Also defines ZVFS_O_CLOEXEC, which
      zvfs_pipe() accepts alongside ZVFS_O_NONBLOCK to apply to both
      descriptors at creation.
  - path: zephyr/libc-sigsetjmp-shims.patch
    sha256sum: 1eb01692a890adb0ff516dcb80ec2c934ce5d026039b8d258b04b86d6fe3f5ea
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-28
    upstreamable: true
    comments: |
      Expose the POSIX_SIGNAL_JUMP declarations through <setjmp.h> for
      newlib and picolibc. Their shared setjmp.h only declares sigsetjmp()
      and siglongjmp() for Cygwin and RTEMS targets, so add interposing
      shims (the signal.h precedent) that include_next the libc header and
      then <zephyr/posix/posix_setjmp.h>, which the POSIX module gates on
      _POSIX_C_SOURCE. Also select TC_PROVIDES_POSIX_SIGNAL_JUMP from
      NATIVE_LIBC (the c-lib-ext precedent), since glibc provides the
      option group itself.
