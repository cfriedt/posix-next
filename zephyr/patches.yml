  - path: zephyr/k-signal.patch
    sha256sum: b81af373855c7c191653b5da479d57ae6d3e8640d4cb2f2cc7146cce59450e87
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2024-06-18
    upstreamable: true
    comments: |
      Add the k_signal API for inter-thread signaling.

      Includes the SIGNAL_ACTION_DB_SIZE_MIN_* Kconfig contributor mechanism, a per-thread
      count of signals delivered to a handler readable via k_sig_delivered(), a user_data
      pointer carried with each k_sig_action (retrievable during handling via k_sig_current(),
      for layers that interpose their own handler), and a system-wide alarm armed via
      k_sig_alarm() that queues K_SIG_ALRM to the calling thread on expiry.
      The pending-scan reclaims queue entries whose target thread has died,
      keyed on each entry's own target rather than the querying thread.
      The generated system call wrappers test one system-wide counter of pending signal
      work inline (z_sig_work_pending, maintained at the queue and release sites) and only
      reach the out-of-line checks when it is non-zero; kernel-only builds force-inline
      every non-variadic wrapper (Z_SYSCALL_INLINE) so that test does not turn a direct
      kernel call into two calls. Invalid actions are rejected before the action database
      capacity check.
  - path: zephyr/k-thread-result.patch
    sha256sum: f9d5392dca7e13ac8f4cf147000cf1fe1dc4f611b32828b103e8da3e02613924
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-01-16
    upstreamable: true
    comments: |
      Support thread results. Thread results are necessary to support standard
      threading APIs such as pthread_join() and thrd_join().
  - path: zephyr/k-thread-cancel.patch
    sha256sum: 81587f81cdcc60a1b5a73e1da82219825233d43ac657bf630f02445c78c86a3f
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-01-15
    upstreamable: true
    comments: |
      Support thread cancellation. Thread cancellation is necessary to support
      standard threading APIs such as pthread_cancel() and thrd_cancel().
      Cancellation actuates in the cancelled thread's own privilege level: a user thread's
      request is handed to the signal path and runs through the trampoline in user mode,
      K_SIG_CANCEL is reserved (neither caught nor ignored), and the result becomes
      K_THREAD_CANCELLED when the request actuates rather than when it is made.
      k_thread_exit() is not a system call: it disables cancellation, records the result
      and actuates directly. The thread bookkeeping system calls are not cancellation
      points.
