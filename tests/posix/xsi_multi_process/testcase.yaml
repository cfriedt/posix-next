common:
  tags:
    - posix
    - xsi_multi_process
  # 1 tier0 platform per supported architecture
  platform_key:
    - arch
    - simulation
  min_ram: 32
tests:
  portability.posix.xsi_multi_process:
    filter: not CONFIG_NATIVE_LIBC
  portability.posix.xsi_multi_process.userspace:
    filter: (not CONFIG_NATIVE_LIBC) and CONFIG_ARCH_HAS_USERSPACE
    tags: userspace
    extra_configs:
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
  portability.posix.xsi_multi_process.linux_compat:
    tags: native
    platform_allow:
      - native_sim
      - native_sim/native/64
    filter: CONFIG_NATIVE_LIBC
    extra_configs:
      - CONFIG_POSIX_TEST_LINUX_COMPAT=y
