common:
  tags:
    - posix_aep
    - llext
  # a link test: the image links only if every function of the profile resolves
  build_only: true
  # native_sim has no linkable loadable extensions
  arch_exclude:
    - posix
  platform_key:
    - arch
    - simulation
tests:
  portability.posix.aep.pse51:
    extra_configs:
      - CONFIG_POSIX_AEP_CHOICE_PSE51=y
  portability.posix.aep.pse52:
    extra_configs:
      - CONFIG_POSIX_AEP_CHOICE_PSE52=y
  portability.posix.aep.pse53:
    extra_configs:
      - CONFIG_POSIX_AEP_CHOICE_PSE53=y
