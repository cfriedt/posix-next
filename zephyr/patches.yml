  - path: zephyr/kernel-futex-per-object-wait-queues.patch
    sha256sum: b99625f8063618e2733cebe9346a79f1ae3c9eb4317912bf8c34e79453828193
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-10-03
    upstreamable: false
    comments: |
      Revert zephyr#110059 (158ebbd44c, "kernel: userspace: Support arbitrary futex addresses",
      in v4.5.0-rc1): restore the per-object futex wait queues, the k_futex kernel object metadata
      and the mem_protect futex tests of v4.4.1. posix-next carries its own futex variant on top of
      them (address-hashed wait queues for unregistered futexes, a waiter count, priority
      inheritance through sys_mutex), which the following patches build; which of the two designs
      survives is settled when that work is upstreamed, so this revert is not for upstream.
  - path: zephyr/sys-sem-track-blocked-waiters.patch
    sha256sum: 01272b01ede4bf6d68c4f87faf0167b172d0401b66e36799a56b725d1dc77d17
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-09
    upstreamable: true
    comments: |
      Rebased onto v4.5.0-rc1 (on the restored per-object futex): sys_sem lives in kernel/userspace/sem.c
      and kernel/sys/sem.c there.
      Track whether any thread is blocked taking a sys_sem and expose it
      as sys_sem_has_waiters(). The kernel maintains the count in every
      k_futex: it is incremented under the wait-queue lock before the
      value compare and decremented by whoever unblocks the thread, the
      waker in k_futex_wake() or the thread itself on timeout, still inside
      the system call. A woken thread therefore never touches the futex
      again, which makes it safe to destroy a semaphore right after the
      give that released its last waiter. Without userspace the k_sem wait
      queue is peeked. The answer is a snapshot intended as a hint, e.g. for
      POSIX sem_destroy() EBUSY detection, which lets sem_t be exactly
      struct sys_sem and the POSIX semaphore layer be a thin spelling
      adapter over the sys_sem API.
  - path: zephyr/futex-wait-at-any-user-accessible-address.patch
    sha256sum: 9950d1bd5efed9776fc2101e9b8f861a85d130bc07d8735f2cd8777cd1664fa1
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-08-09
    upstreamable: false
    custom:
      upstream:
        depends-on:
          - zephyr/sys-sem-track-blocked-waiters.patch
    comments: |
      Rebased onto v4.5.0-rc1 on top of kernel-futex-per-object-wait-queues, which restores the v4.4.1 futex
      this variant extends; the implementation lives in kernel/userspace/futex.c there.
      k_futex_wait() resolved its wait queue through the kernel object
      table, so only statically-defined futexes - the ones the kernel
      object scanner can see - were waitable; a futex on a stack or in
      heap memory failed with -EINVAL even for supervisor callers, and
      only under contention, since uncontended operations never enter the
      kernel. Fall back to a small fixed array of address-hashed wait
      queues for unregistered futexes, in the manner of Linux: waiters
      record the futex address and wake-ups unpend only matching waiters,
      in priority order, so sharing a bucket costs lock contention but
      never a lost or spurious wakeup. Statically-defined futexes keep
      their dedicated wait queues. Update the mem_protect/futex testsuite
      cases that asserted -EINVAL for user-accessible non-kobject
      addresses to assert the new pend/no-waiter behavior instead.

      This lifts the static-allocation restriction from sys_sem and
      everything built on it, notably POSIX sem_t.

      Inspired by upstream PR #110059, which fixes the same issue with a
      single global wait queue and the awaited address in the thread
      struct, but the implementation here varies quite differently and it
      is not clear if this is a candidate for upstreaming.
  - path: zephyr/kernel-futex-without-userspace.patch
    sha256sum: c1be36a3a281f350a4a550f9c1b7e15f67bb49da135e35eb262832ea00454867
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-12
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/futex-wait-at-any-user-accessible-address.patch
    comments: |
      Rebased onto v4.5.0-rc1: futex.c lives in kernel/userspace/ and is listed with the multithreading sources.
      k_futex was only built and declared with CONFIG_USERSPACE, although
      nothing in the contended path needs user mode: waiters pend on a
      wait queue that is found either through the kernel object table or,
      for unregistered addresses, the address-hashed buckets. Build futex.c
      whenever the kernel is multithreaded and keep only the system call
      verifiers and marshallers under CONFIG_USERSPACE, so supervisor-only
      builds can block on a futex word too. Without userspace no futex is
      a registered kernel object, so every futex uses the hashed queues.
      This lets sys_thread_once() block waiters on the once word in every
      configuration instead of polling when userspace is disabled.
  - path: zephyr/k-obj-map-size.patch
    sha256sum: a490528e70769c7d22d9029f19b972603270dc4acbead1c98f761f9e0b25a3df
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-05-10
    upstreamable: true
    comments: |
      provide a means of using k_mem_map() to map a thread stack instead of using the heap.
  - path: zephyr/sys-thread.patch
    sha256sum: 30257170f3ea50e5bc6369cdb919c0ef8ae64cd08ba6eed79b98293ab9a4ab99
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-04-25
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-tss.patch
          - zephyr/k-thread-detach.patch
          - zephyr/k-obj-map-size.patch
          - zephyr/kernel-userspace-dynamic-thread-index-leak.patch
    comments: |
      lib: os: add sys_thread api for pooled condvar, mutex, thread, and stack

      Pooled thread and stack objects are torn down by the kernel-object
      collector. A thread or stack object is live from k_object_init() until
      halt_thread() is done with it, marked by K_OBJ_FLAG_HALTING, and neither
      unref_check() nor k_object_free() disposes of a live one: the last
      permission drop of a running thread only clears the bit, and the halt
      collects the object once nothing references it. A collected dynamic
      object is not freed where it is found: the heap reaches the scheduler
      lock to wake waiters, and lists_lock and obj_lock are taken under the
      scheduler lock by halt, so the record goes onto an object graveyard and
      z_kobj_graveyard_flush() releases and frees it with no lock held, at
      allocation, k_object_free(), a permission drop, and the collect and reap
      entry points once their locks are dropped. An object drawn from a pool
      (K_OBJ_FLAG_OWNED) tells its owner through the weak z_kobj_owner_release()
      before it goes; a stack bound to its thread (K_OBJ_FLAG_BOUND) is reaped
      with the thread; a thread is granted its own stack at setup; and a stack
      from k_object_map_size() carries K_OBJ_FLAG_ALLOC so that the collector
      can unmap it. The kernel's entry points are z_kobj_halt_begin(),
      z_kobj_halt_clear(), z_kobj_halt_end(), z_kobj_collect() and
      z_kobj_reap(), the last of which ends every reference to a collectable
      thread object and its bound stack while leaving an application's static
      object, which outlives its thread, untouched.

      halt_thread() frees nothing. It moves the thread's objects to halting,
      sweeps the thread's own permissions as before, and parks a kernel-owned
      thread, a pool entry or a dynamic object, on the graveyard, a list
      through the k_thread that only the kernel owns; an application-owned
      k_thread is never parked and never touched again once its abort returns,
      which the thread_apis abort-from-ISR test relies on. The drains dispose
      with no lock held, after the parked thread has switched out: thread and
      stack allocation, reuse of the k_thread, and the reap events, which are
      the join in z_thread_epilogue() and k_thread_detach() of a dead thread.
      A detached thread's death is its reap. Without CONFIG_USERSPACE the same
      drains reclaim a pooled thread explicitly through z_sys_thread_reclaim().
      The one-slot mapped-stack stash stays for application-owned threads.
      DYNAMIC_OBJECTS and SYS_THREAD select THREAD_ABORT_NEED_CLEANUP. The
      dynamic_thread suite checks that a running thread's object survives its
      creator's release and k_object_free(), that the join disposes of it, and
      that a detached thread's index returns.

      The pool locks are leaf locks, since the collector calls back into the
      pool while holding its own: elastic entries are reserved under the pool
      lock, allocated without it and registered under it again. Every pool
      stack is bound to the thread that runs on it, the pool records how each
      elastic stack was obtained so that releasing one never asks the
      kernel-object layer, z_kobj_owner_release() drops bookkeeping only, and
      z_sys_thread_reclaim() follows a pooled thread's stack that is not a
      kernel object and, without CONFIG_USERSPACE, reclaims the pooled thread
      itself. sys_thread_destroy() and sys_thread_stack_destroy() drop the
      caller's reference with CONFIG_USERSPACE and CHECKIF() a live object
      without it; the uninitialized-flag check of sys_thread_once() is a
      CHECKIF() too. The ztest rule only observes: it records the pool usage
      before each test and waits a bounded time for it to return. The
      sys_thread suite covers detached and aborted pooled threads.

      CONFIG_SYS_THREAD_STACK_SIZE is an int like every other stack size
      symbol.

