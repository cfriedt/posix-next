CONFIG_ZTEST=y

CONFIG_POSIX_AEP_CHOICE_BASE=y
CONFIG_POSIX_SPAWN=y
# the image section registers a fork handler of the image's own
CONFIG_POSIX_THREADS=y
CONFIG_POSIX_THREAD_ATFORK_MAX=1
CONFIG_SYS_PROCESS_MAX=4
CONFIG_HEAP_MEM_POOL_SIZE=32768

# the file-actions section uses an eventfd as the shared description
CONFIG_EVENTFD=y
