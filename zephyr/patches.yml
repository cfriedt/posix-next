  - path: zephyr/tests-net-socket-service-posix-bind-casts.patch
    sha256sum: 93e6ba3f9117e21e5d30b7d85f21d73dc4ff7a4dd7a41088728bcb651e544963
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-07-19
    upstreamable: true
