      - CONFIG_SYS_PROCESS_IDS=48
      # a forked child privatizes a leaf table per copied range and its domain's
      # partitions: nine live children (sigrt) run past 64 tables
      - platform:qemu_cortex_a53/qemu_cortex_a53:CONFIG_MAX_XLAT_TABLES=256
