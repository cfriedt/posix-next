      utime() nor includes <time.h> for time_t, so the shim supplies both
      around an include_next.
  - path: zephyr/libc-sys-select-h.patch
    sha256sum: 367dce8f910ef98fc79cc18bf28c2b7f0beb739b00d89278d26c2b2290d34043
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-06-30
