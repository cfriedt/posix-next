      add general thread cleanup support
      k_thread_cleanup_pop() is an inline over the k_thread_cleanup_pop_entry() system
      call, which only returns the routine (and refuses to follow a cleanup entry the
      caller has corrupted), so handlers run in the popping thread's own privilege level;
      the tests assert that mode.
  - path: zephyr/k-tss.patch
    sha256sum: 3ee1ee0eee28b475bf70081dbe057b938e22ee3d968483fd6e9400e64dda97da
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-03-07
    upstreamable: true
    comments: |
      add thread-specific storage support
      The thread-specific storage system calls are not cancellation points.
      k_thread_key_delete() drops the live associations of the key in every
      thread instead of failing with -EBUSY; a thread's exit calls destructors
      only for non-NULL values, in passes bounded by
      CONFIG_THREAD_SPECIFIC_STORAGE_DESTRUCTOR_ITERATIONS, each visiting the
      values stored when it started (reported in zephyr#120152 by Harshit
      Kudhial). k_thread_specific_count() reports the number of stored values.
  - path: zephyr/gen-syscalls-va-list-by-reference.patch
    sha256sum: 5764c220a83e52e9f48b228fb76904f8f40ba84091da3e3e7a16676c101dba28
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-13
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-signal.patch
    comments: |
      scripts: build: gen_syscalls: pass va_list arguments by reference. A
      va_list system-call argument (zsock_ioctl_impl(), zvfs_ioctl()) was
      va_copy()d into a register-sized union and its first word sent
      through the trap; the marshaller rebuilt a va_list from that word.
      That only works where a va_list is a pointer (riscv, arm, x86-32).
      On x86_64 and arm64 it is a struct or an array wider than a register,
      so the kernel read the remaining fields uninitialized - GCC 14
      diagnoses reg_save_area/overflow_arg_area as maybe-uninitialized in
      z_vrfy_zsock_ioctl_impl(), a build error under warnings-as-errors,
      and at run time va_arg() walked garbage. The wrapper now keeps the
      copy on the caller's stack and sends its address; the marshaller
      validates that object for reading, va_copy()s it into a local list
      for the verifier and va_end()s it afterwards.
