  - path: zephyr/k-signal.patch
    sha256sum: 5b3edfdef80c721ed8907fa8342205a261d7e8a57fe301985bbdb2632e7c33ae
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2024-06-18
    upstreamable: true
    comments: |
      Add the k_signal API for inter-thread signaling.
      A thread object set up anew drops the thread-directed entries its
      previous occupant never claimed (z_sig_thread_drop() from
      z_setup_new_thread()): a pooled thread that exited with a kill queued
      to it would otherwise hand that kill to the next thread drawn on it.
      The syscall-return trampoline is its own mechanism, SYSCALL_RETURN_HOOK
      (kernel/return_hook.c), which signals select: z_sig_handle(), k_sig_current()
      and k_sig_return() live there, and kernel/signal.c keeps the queue, the
      dispositions, z_sig_claim() and z_sig_pending_any().
      Handlers run in series: while one is in progress (k_sig_ctx.handling,
      set at redirection and cleared by k_sig_return()) z_sig_handle() leaves
      further signals pending, so a second signal arriving at a system call
      made inside a handler cannot start a nested handler. The per-thread
      backup of the interrupted context has one slot; a nested delivery
      overwrote it and the outer k_sig_return() resumed the wrong context.

      Includes the SIGNAL_ACTION_DB_SIZE_MIN_* Kconfig contributor mechanism, a per-thread
      count of signals delivered to a handler readable via k_sig_delivered(), a user_data
      pointer carried with each k_sig_action (retrievable during handling via k_sig_current(),
      for layers that interpose their own handler), and a system-wide alarm armed via
      k_sig_alarm() that queues K_SIG_ALRM to the calling thread on expiry. The alarm
      goes with the thread that armed it: halt_thread() cancels it through
      z_sig_thread_exit(), so an expiry never queues to a thread object that has since
      been retired or reused.
      The pending-scan reclaims queue entries whose target thread has died,
      keyed on each entry's own target rather than the querying thread.
      The generated system call wrappers test one system-wide counter of pending signal
      work inline (z_syscall_work_pending, maintained at the queue and release sites) and only
      reach the out-of-line checks when it is non-zero; kernel-only builds force-inline
      every non-variadic wrapper (Z_SYSCALL_INLINE) so that test does not turn a direct
      kernel call into two calls. Invalid actions are rejected before the action database
      capacity check.

      kernel: an ignored signal that its target has unblocked is discarded as
      it is generated. Delivery would only have discarded it, so queueing it
      held a slot of the shared signal queue until the target next passed a
      delivery point; a flood of kill()s with an ignored signal (stress-ng
      kill: SIGUSR1 to a process ignoring it, STOP/CONT/USR1 to a child
      slower than its parent) filled the queue and a later kill() failed with
      EAGAIN, which is not a kill() error. Blocked signals still pend whatever
      their action (POSIX leaves a blocked, ignored signal unspecified; a
      handler installed later, or a sigwait(), may still take it), child
      notifications keep their reaped status, and timer, message-queue and
      asynchronous I/O notifications keep their own accounting: only
      kill()-class generation (K_SI_QUEUE) to a thread is discarded. The
      standing decision not to merge repeats of a standard signal in the
      queue is unchanged. tests/kernel/signal test_k_kill floods an ignored
      unblocked signal past the queue size and checks that a blocked one
      still pends and is claimed.
  - path: zephyr/k-signal-ucontext.patch
    sha256sum: dad3d7456b2804a997377b8277e13b6498b989147a43992412fcf5a2746f6621
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-11-20
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-signal.patch
    comments: |
      The signal trampoline builds the context a handler is entered with on
      the handler's stack and passes its address as the third argument: the
      mask the interrupted context resumes with, which the handler may change.
      k_sig_return() installs that mask, with K_SIG_KILL and K_SIG_STOP kept
      unblocked for a user caller, in place of the one it kept; k_sig_current()
      fills the context in.
  - path: zephyr/k-signal-fault.patch
    sha256sum: 239fae688f75845d89a0c94decbc0ff1f2420c7092dec7059ac319afdcb61e65
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-11-03
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-signal.patch
    comments: |
      A fault a user thread takes generates a signal for it (SIGSEGV, SIGBUS,
      SIGILL, SIGFPE, SIGTRAP with the Linux si_code and si_addr) instead of
      a fatal error. The arch records the fault and resumes the thread in a
      stack-free user-mode stub whose k_sig_fault() system call either runs
      the handler on the return path or, for a blocked, ignored or default
      disposition or a fault inside a handler, ends the thread with the
      signal in thread context (its process, once there are processes). A
      returning handler ends it the same way (POSIX leaves it undefined).
      Each architecture's fault classifier follows in a patch of its own. The
      picolibc signal.h shim numbers si_code as Linux does.
      tests/kernel/signal test_k_sig_fault, with the sections every
      architecture shares.
  - path: zephyr/k-signal-interruptible-wait.patch
    sha256sum: 226a436f79b6ff76719592e57d318ab674edd9d17cb13a9667f7ae3320ce932a
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-10-24
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-signal.patch
    comments: |
      Signals interrupt a thread's blocking waits. Queueing a signal never
      woke its target: a thread blocked in a sleep, a pend or a poll ran its
      handler only when that wait ended on its own, so an alarm never ended
      a sleep and a handled signal never interrupted the call. A blocking
      wait that signals may interrupt opts in at its wait site, so the
      kernel's own waits are never cut short: the waiter marks its thread
      (z_sig_pend_begin()), checks once more that no deliverable signal
      (unblocked, not ignored) is pending, and pends as before. A signal
      queued to a marked thread unpends it with -EINTR, wakes it from
      k_sleep(), or flags a pend not yet made so that it returns at once;
      the window between the waiter's check and its pend is closed inside
      the scheduler (z_sched_sig_interrupt(), pend_locked(), z_pend_curr()).
      z_sig_pend_end() reports a signal pending, or one claimed during the
      wait - the arch return path claims it for delivery before the waiter
      looks. Waits built on poll signals register the signal they poll in
      the thread's signal context (k_sig_ctx.wait_sig, z_sig_wait_begin()
      and z_sig_wait_end()) and queueing raises it.

      Opted in here: sys_clock_nanosleep() (sleep, nanosleep,
      clock_nanosleep), the socket accept, connect and receive waits,
      poll and select, and the eventfd read and write, which end with
      EINTR as on Linux instead of staying blocked until the counter moves.
      A signal wait (k_sig_timedwait) ends with -EINTR when a deliverable
      signal outside its set arrives, so a thread blocked in sigwaitinfo()
      can be terminated or run a handler. Blocked and ignored signals do
      not interrupt; a call is never restarted. The sender of a signal
      yields to its target: when z_sched_sig_interrupt() readies the target
      and the sender is a preemptible thread of the same priority, the
      sender moves to the end of its run queue, as a time slice expiry
      would, so that programs which rely on the woken thread running first
      see every report.

      tests/kernel/signal covers a sleep, a semaphore pend and a signal
      wait; tests/lib/zvfs_eventfd covers the interrupted read.
  - path: zephyr/k-thread-result.patch
    sha256sum: 2095708a34e300d868d60d466021c47095a52d588021a0f5a2ae350f3423a694
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-01-16
    upstreamable: true
    comments: |
      Support thread results. Thread results are necessary to support standard
      threading APIs such as pthread_join() and thrd_join().
  - path: zephyr/k-thread-cancel.patch
    sha256sum: f978459c40e0204d3460c18d157f6bfbc24aedf536d077bae46f7148a342a105
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-01-15
    upstreamable: true
    comments: |
      Support thread cancellation. Thread cancellation is necessary to support
      standard threading APIs such as pthread_cancel() and thrd_cancel().
      Cancellation is a flag the target acts on at its next cancellation point or
      system-call return, never a signal: a user thread's request arms the
      SYSCALL_RETURN_HOOK trampoline so the teardown runs in its own privilege level,
      cancel state is the K_CANCEL_DISABLED thread option, THREAD_CANCEL selects the hook
      and THREAD_RESULT and does not depend on SIGNAL, and the result becomes
      K_THREAD_CANCELLED when the request actuates rather than when it is made.
      K_SIG_CANCEL, the Linux SIGCANCEL slot, is an explicit alternative entry: queued
      to a thread with k_sig_queue() it runs an installed handler or, by default,
      cancels the thread. z_thread_teardown() (cleanup handlers, destructors, abort)
      is shared with k_thread_exit() in kernel/thread_exit.c.
      k_thread_exit() is not a system call: it disables cancellation, records the result
      and actuates directly. The thread bookkeeping system calls are not cancellation
      points.
  - path: zephyr/sigrtmin-use-cancel-kconfig.patch
    sha256sum: de2ca5bedbdb90994a80f8c76bf8c3a15cce3d8e90d3e7b9d4d03ff7a2111560
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-06-24
    upstreamable: true
    comments: |
      Tie SIGRTMIN to CONFIG_THREAD_CANCEL_SIGNAL_NUMBER now that
      k-thread-cancel.patch defines the Kconfig symbol.
  - path: zephyr/riscv-mmu-support.patch
    sha256sum: bedbbc1b53ce17d5e4ea891d372ca0e0d085c6abec8e64c5cd25a02a498f2b29
    module: zephyr
    author: Alexios Lyrakis
    email: alexios.lyrakis@gmail.com
    date: 2026-08-28
    merge-pr: https://github.com/zephyrproject-rtos/zephyr/pull/105403
    comments: |
      Resynced 2026-10-03 with the head of zephyr#105403 (fdbbeedf89, 2026-09-30) rebased onto
      v4.5.0-rc1: six commits adding Sv39/Sv48 MMU support, the qemu_riscv64 S-mode/MMU boot and
      Sv48 board variant, the MEM_REGION_ALLOC test case and the architecture documentation. The
      S-mode and SBI groundwork of the earlier snapshot is in v4.5.0-rc1 itself.
      Adapted to v4.5.0-rc1: k_mem_domain_default is created by a kernel pre-init hook before the
      PRE_KERNEL_1 arch_mem_init(), so partition mapping is deferred while kernel_root_table is
      NULL and replayed once the domain root has been patched with the kernel tables (the PR's
      memcpy alone drops the libc partition). The earlier adaptations are kept: RISCV_MMU
      default y, read-only stack guard pages, PRIVILEGED_STACK_SIZE 4096.
      Backport RISC-V MMU support (zephyr#105403): CONFIG_RISCV_MMU with
      Sv39/Sv48 page tables, per-domain ASID-tagged root tables, userspace
      and memory-domain isolation, MMU stack guards, arch_mem_map/unmap/
      arch_page_phys_get, and the qemu_riscv64 smode/sv48 MMU board
      variants. RV64-only (no Sv32); no demand paging. Adaptations:
      dropped the virt-riscv-plic.dtsi include (PLIC is still inline in the
      shared QEMU virt dtsi) and omitted main-only PMP_DATA_EXECUTION_PREVENTION
      Kconfig context. RISCV_MMU defaults y (its dependencies already require
      an S-mode kernel and every enabled hart declaring MMU hardware in the
      devicetree, so platforms with an MMU enable it by default, matching
      other architectures). Adds PRIVILEGED_STACK_SIZE default 4096 under RISCV_MMU
      (mirrors X86_MMU): the guard+priv reservation is page-rounded so a 1024B
      priv stack wastes the rest of the page, and 1024B overflows into the
      guard page on deeper syscall paths (k_mem_map from sys_thread_stack_alloc),
      which fault-storms at trap entry with no diagnosable backtrace. Stack
      guard pages are made read-only (W/X/U cleared, V kept) instead of
      unmapped, mirroring x86's z_x86_set_stack_guard(): stores still fault as
      overflow, and mem-mapped dynamic stack objects stay fully resolvable so
      k_mem_unmap_phys_guard() can free their page frames at thread destroy
      (V=0 tripped its "cannot unmap an unmapped address" assert).
      The PLIC register windows that the interrupt controller driver addresses
      physically are identity-mapped beside the console UART.
      Rebased onto v4.5.0-rc2 (2026-10-15): the privileged-stack painting that skips the guard
      region is upstream (5a7b28425ae), so the patch no longer touches it.

      A partition attribute without user access (K_MEM_PARTITION_P_RW_U_NA,
      P_RO_U_NA, P_NA_U_NA) became a valid PTE with R=W=X=0, which RISC-V
      reads as a pointer to a next-level table: the page's own data was
      walked as a page table, and unmapping it wrote into that data. Such an
      attribute is now a supervisor read-write leaf.
  - path: zephyr/riscv-mmu-domain-mappings.patch
    sha256sum: 221325193535993abfd69bdc265e09f8f60bac58156d60aec9318a379dd06df5
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-13
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/riscv-mmu-support.patch
    comments: |
      riscv: mmu: keep memory-domain mappings in step with the kernel's. Two
      fixes to the backported MMU (zephyr#105403), for memory that is mapped
      rather than identity-mapped, such as a thread stack from k_mem_map().
      Domain tables mapped user ranges (partitions, user stacks) at virt ==
      phys, so a user thread on a mapped stack saw a different page than the
      kernel did: the user-mode flag the kernel set in its TLS read 0, the
      inline system call wrapper concluded it was in kernel context and
      dereferenced kernel data. User ranges are now mapped page by page at
      the frames the kernel tables hold. And kernel leaf mappings made after
      a domain privatized the covering leaf table were never propagated
      (upstream syncs only new L0/L1 entries): arch_mem_map()/arch_mem_unmap()
      now mirror the changed leaves into every domain's private leaf tables,
      leaving leaves that carry PTE_USER (the domain's own) alone, so that
      late mappings stay reachable while a domain SATP is active - a trap
      from user mode stores into the privilege stack before switching SATP.
  - path: zephyr/intc-plic-supervisor-context.patch
    sha256sum: 9a0d2b7c4a867a45e3781356002c3158ae67021c0a2e0f354d4a7ac3a7155243
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-10-05
    upstreamable: true
    comments: |
      drivers: intc: plic: use the supervisor hart context under RISCV_S_MODE

      The driver connects the PLIC to the first interrupt of its
      interrupts-extended list, the machine external interrupt, and takes
      the hart contexts listed with that number. A kernel built for
      supervisor mode never sees machine interrupts: connect the supervisor
      external interrupt and use the supervisor contexts instead, so that
      external interrupts (virtio-net on qemu_riscv64) reach the kernel.

  - path: zephyr/boards-qemu-riscv64-smode-default.patch
    sha256sum: 7e4e7eb2ff027dbd6e7abf996e56fffebad9515daa6cf988cb29a9231a265e1b
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-09-13
    custom:
      upstream:
        depends-on:
          - zephyr/riscv-mmu-support.patch
    comments: |
      Rebased onto v4.5.0-rc1 + the zephyr#105403 head: upstream's opensbi and opensbi_smp variants stay,
      the MMU properties use the PR's /cpus form, and coredump_threads keeps upstream's
      'not CONFIG_RISCV_S_MODE' filter, which still covers the mmode variant.
      boards: qemu_riscv64: S-mode with the Sv39 MMU is the board's default
      configuration, as qemu_cortex_a53 and qemu_x86_64 run their MMU by
      default; the M-mode PMP configuration that upstream calls
      qemu_riscv64 becomes the qemu_riscv64/qemu_virt_riscv64/mmode variant
      and the smode variant goes away (sv48 and smp are unchanged). The
      four Zephyr test manifests that excluded or listed the smode
      identifier now name qemu_riscv64, and coredump_threads, whose
      S-mode exclusion would otherwise leave riscv64 uncovered, lists the
      mmode variant. Not for upstream as is: it reverses upstream's board
      default.
      Kernel leaf mappings made after a domain privatized the covering leaf
      table (dynamically allocated thread stacks, k_mem_map()) are mirrored
      into every domain's private leaf tables on arch_mem_map()/arch_mem_unmap();
      the upstream PR syncs only new L0/L1 entries, so such pages were
      reachable from a domain only while its table was still shared with the
      kernel, although a trap from user mode stores into the thread's
      privilege stack before switching SATP.
  - path: zephyr/riscv-user-ebreak-is-a-fault.patch
    sha256sum: 0163ab22d11c147dac00c668539a479e63699ff25c322bc0f7e32fcef32636c3
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-11-04
    upstreamable: true
    comments: |
      In supervisor mode the kernel raises its exceptions and switches
      context with ebreak, and the trap entry took any breakpoint for such a
      call: a user thread's ebreak reached the runtime-exception, IRQ-offload
      and context-switch dispatch with registers of its choosing. A
      breakpoint taken in user mode is now an ordinary fault.
  - path: zephyr/user-signals-riscv.patch
    sha256sum: 65f8cc1a6b80c5ca328c34c43561cb7ba9e0db8d03af4696ed57086e2ab80289
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-02-08
    upstreamable: true
    comments: |
      RISC-V arch-level support for userspace signals in syscall handling: the
      user-mode return path is gated on SYSCALL_RETURN_HOOK.
  - path: zephyr/k-signal-fault-riscv.patch
    sha256sum: a19451f486a4e5357aeddce095a9bddc1c0424f0e4dc6de78af95b87415f7a48
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-11-04
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-signal-fault.patch
          - zephyr/user-signals-riscv.patch
          - zephyr/riscv-mmu-support.patch
    comments: |
      riscv delivers user-mode faults as signals: it classifies mcause and
      mtval (stval in S-mode) as Linux does, records the fault with
      z_sig_fault() and resumes the thread in a stack-free z_sig_fault_entry
      stub (li t0 / ecall). An unknown cause is SIGILL ILL_ILLTRP; riscv has
      no arithmetic traps and never generates SIGFPE. test_k_sig_fault gains
      the undefined-instruction (unimp) and breakpoint (ebreak) sections, and
      accepts SEGV_ACCERR for the unmapped address under a protection unit.
  - path: zephyr/user-signals-arm.patch
    sha256sum: 131fae77221466ab985727f1cd92f9517dbceec297b0e18f93089e736f252de7
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-02-10
    upstreamable: true
    comments: |
      ARM and Aarch64 arch-level support for userspace signals in syscall handling:
      the user-mode return paths are gated on SYSCALL_RETURN_HOOK.
  - path: zephyr/k-signal-fault-arm64.patch
    sha256sum: d36156ff3ebebcb4d4ca57a55929245f14924770caf86897624a73137ed4aefc
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-11-03
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-signal-fault.patch
          - zephyr/user-signals-arm.patch
    comments: |
      arm64 delivers user-mode faults as signals: ESR_EL1 classifies the fault
      as Linux does, z_sig_fault() records it and the thread resumes in a
      stack-free z_sig_fault_entry stub (svc). test_k_sig_fault gains the
      undefined-instruction (.inst 0) and breakpoint (brk) sections.
  - path: zephyr/user-signals-x86.patch
    sha256sum: 073c05e9983442db4804a420965bb48f0b7aab7e1d20cae7953f7dad56f61487
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-02-15
    upstreamable: true
    comments: |
      x86 arch-level support for userspace signals in syscall handling: the
      user-mode return paths are gated on SYSCALL_RETURN_HOOK, and the system
      call save frame offsets are generated for every userspace build.
      The syscall id is read back from the thread's own syscall frame: the
      per-CPU TSS stash it replaced went stale when the thread was preempted
      inside the call by another thread's syscall, or migrated.
  - path: zephyr/k-signal-fault-x86.patch
    sha256sum: fcc6b4985f15607766749a9c4e6e1a30f60c8af1a3ef32e1b9d8bb745df19c70
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-11-04
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-signal-fault.patch
          - zephyr/user-signals-x86.patch
    comments: |
      x86 (32- and 64-bit) delivers user-mode faults as signals: the vector,
      error code and CR2 classify the fault as Linux does, z_sig_fault()
      records it and the thread resumes in a stack-free z_sig_fault_entry
      stub (syscall, int $0x80); the generic exception handler may return
      for that. x86 decodes #MF and #XM into the SIGFPE code, maps #DB and
      #BP to SIGTRAP, lets ring 3 issue int3 and into, sets CR0.NE (x86_64)
      and CR4.OSXMMEXCPT so x87 and SSE errors raise #MF and #XM, and fixes
      the KPTI USER_TRAP gate type. test_k_sig_fault gains the
      undefined-instruction (ud2), breakpoint (int3), integer divide and x87
      divide sections, accepts either SEGV code for kernel memory (KPTI keeps
      it out of the user page tables) and ILL_ILLOPN for an invalid opcode.
  - path: zephyr/zsock-fcntl-zvfs-nonblock-compat.patch
    sha256sum: 436ea05e27b2fe97ca2d09325714a2cc2495876f2aff8afb940c6c91afa2c7bc
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-05-16
    upstreamable: true
    comments: |
      Accept POSIX fcntl constants in zsock_fcntl() while translating them to ZVFS constants used by
      socket backends.
  - path: zephyr/x86-z-mapped-size-after-iterable-sections.patch
    sha256sum: d695b1c01da6803476ca1ad4a0c1453863df3038907d913163594c956f24ca04
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-05-23
    upstreamable: true
    comments: |
      x86: compute z_mapped_size after snippets-sections and ram-end.ld. gen_mmu.py maps only
      z_mapped_size bytes; assigning it before app iterable sections (e.g. HTTP_RESOURCE_DEFINE)
      left tail regions unmapped and caused page faults on qemu_x86 (net.http.server.crime/tls).
  - path: zephyr/k-thread-cleanup.patch
    sha256sum: 2fef783588c63813cac92853ae2cda2e8eadfdf6e5066298087825e68621309f
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-03-07
    upstreamable: true
    comments: |
      add general thread cleanup support
      k_thread_cleanup_pop() is an inline over the k_thread_cleanup_pop_entry() system
      call, which only returns the routine (and refuses to follow a cleanup entry the
      caller has corrupted), so handlers run in the popping thread's own privilege level;
      the tests assert that mode.
  - path: zephyr/k-tss.patch
    sha256sum: a2f68e5cd035446c31b18702e167b9e06701c97931b7d3203d08e3a692bd61f8
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-03-07
    upstreamable: true
    comments: |
      add thread-specific storage support
      The thread-specific storage system calls are not cancellation points.
      k_thread_key_delete() drops the live associations of the key in every
      thread instead of failing with -EBUSY; a thread's exit calls destructors
      only for non-NULL values, in passes bounded by
      CONFIG_THREAD_SPECIFIC_STORAGE_DESTRUCTOR_ITERATIONS, each visiting the
      values stored when it started (reported in zephyr#120152 by Harshit
      Kudhial). k_thread_specific_count() reports the number of stored values.
  - path: zephyr/k-thread-detach.patch
    sha256sum: 427ed8f95515e7b4214944d5cd47cb00dd4de8986347a60396220fb5d4eff066
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-03-08
    upstreamable: true
    comments: |
      add support for detached threads.
  - path: zephyr/k-mutex-nonrecursive.patch
    sha256sum: adba5841efc2aba74888c9043733527a14bfd992eda2f1a748a393ac447c811a
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-03-08
    upstreamable: true
    comments: |
      Rebased onto v4.5.0-rc1's priority-inheritance rework of k_mutex (held_mutexes list, no
      owner_orig_prio); the release path there already clears the owner under the scheduler lock.
      add support for nonrecursive and errorcheck mutexes.
  - path: zephyr/timespec-to-timepoint.patch
    sha256sum: ce4da72acace2ed34f31015a0bea5a055b8683d1bb8b55a6a11a56fefb777b48
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-12-21
    upstreamable: true
    comments: |
      Provide a function to convert absolute timespec values to k_timepoint_t.
  - path: zephyr/k-condvar-clockwait.patch
    sha256sum: 85442786728aa4bfdd0a8950ff0d4beccc49fbd4ee31a60c3f3cdf4fcdc87ed7
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-05-22
    upstreamable: true
    custom:
      upstream:
        depends-on:
          - zephyr/k-mutex-nonrecursive.patch
    comments: |
      Rebased onto v4.5.0-rc1, which already re-acquires the mutex on a timed-out wait.
      Support timespec-based absolute timeouts for condition variables. These functions are used
      to support standard threading APIs such as C11, C++11, and POSIX. Moving the
      absolute-to-relative conversion into the kernel ensures that there are fewer race conditions
      and sources of error which are common when multiple timepoint conversion happens in several
      places.
