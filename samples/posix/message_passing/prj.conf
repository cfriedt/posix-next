CONFIG_POSIX_AEP_CHOICE_PSE51=y
CONFIG_POSIX_MESSAGE_PASSING=y

CONFIG_MAIN_STACK_SIZE=2048
# The queue is heap-allocated, and so is the transient SIGEV_THREAD
# notification-thread stack on platforms without anonymous memory mappings
# (with an MMU, dynamic thread stacks are mem-mapped instead): a 64-bit
# native_sim notification thread needs a little over 3 KiB.
CONFIG_HEAP_MEM_POOL_SIZE=8192
