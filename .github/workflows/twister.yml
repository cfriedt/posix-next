name: Twister

on:
  # no push trigger: every job is PR- or nightly-gated, and an all-skipped
  # push run would still cancel an in-progress nightly via the shared
  # concurrency group (cancellation precedes job-level if conditions)
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
      - v*-branch
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ZEPHYR_BASE: ${{ github.workspace }}/zephyr
  CI_CONFIG: ${{ github.workspace }}/.github/ci-config.json

jobs:
  twister-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up workspace
        id: workspace
        uses: ./.github/actions/setup-workspace
        with:
          toolchains: aarch64-zephyr-elf:arm-zephyr-eabi:riscv64-zephyr-elf:x86_64-zephyr-elf

      - name: Generate PR test plan
        id: plan
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          MANIFEST: ${{ github.workspace }}/${{ env.MANIFEST_PATH }}
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          git -C "${MANIFEST}" diff --name-only "${BASE_REF}.." \
            | python3 -c 'import json,sys; json.dump([l for l in sys.stdin.read().splitlines() if l], sys.stdout)' \
            > changed_files.json
          "${{ github.workspace }}/${{ env.MANIFEST_PATH }}/scripts/ci/gen-pr-testplan.sh" \
            changed_files.json
          count=$(jq '.testsuites | length' testplan.json)
          if [ "$count" -gt 0 ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload PR test plan
        uses: actions/upload-artifact@v4
        with:
          name: pr-testplan
          path: testplan.json
          if-no-files-found: error

      - name: Skip twister (no tests in plan)
        if: steps.plan.outputs.has_tests != 'true'
        run: echo "Pull request changes do not require twister; skipping test run."

      - name: Run Tests with Twister (Pull Request)
        if: steps.plan.outputs.has_tests == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ccache --zero-stats
          "${{ github.workspace }}/${{ env.MANIFEST_PATH }}/scripts/ci/twister-pr-run.sh"
          ccache --show-stats

      - name: Save workspace ccache
        if: always() && !cancelled()
        uses: ./.github/actions/save-workspace-ccache
        with:
          cache-primary-key: ${{ steps.workspace.outputs.ccache-primary-key }}
          save: ${{ github.event_name == 'push' }}

  twister-nightly-prep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      shard_total: ${{ steps.plan.outputs.shard_total }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Plan nightly shards
        id: plan
        shell: bash
        run: |
          total=$(jq -r '.twister_nightly.shards // 10' "$CI_CONFIG")
          echo "shard_total=$total" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -nc --argjson n "$total" '{shard: [range(1; $n+1)]}')" >> "$GITHUB_OUTPUT"

  twister-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: twister-nightly-prep
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.twister-nightly-prep.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up workspace
        id: workspace
        uses: ./.github/actions/setup-workspace
        with:
          toolchains: aarch64-zephyr-elf:arm-zephyr-eabi:riscv64-zephyr-elf:x86_64-zephyr-elf
          ccache-key-prefix: twister

      - name: Generate nightly test plan
        if: matrix.shard == 1
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          CI_CONFIG_PROFILE=twister_nightly \
            "${{ github.workspace }}/${{ env.MANIFEST_PATH }}/scripts/ci/gen-testplan.sh"
          test -s testplan.json

      - name: Upload nightly test plan
        if: matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: twister-nightly-testplan
          path: testplan.json
          if-no-files-found: error

      - name: Wait for nightly test plan
        if: matrix.shard != 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Shard 1: setup (<=2m) + twister -c plan generation + upload; other shards poll after their own setup.
          setup_max_sec=120
          plan_gen_sec=10
          buffer_sec=30
          poll_sec=10
          max_wait_sec=$((setup_max_sec + plan_gen_sec + buffer_sec))
          max_attempts=$(( (max_wait_sec + poll_sec - 1) / poll_sec ))

          name=twister-nightly-testplan
          for attempt in $(seq 1 "${max_attempts}"); do
            count=$(gh api -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --paginate -q "[.artifacts[] | select(.name == \"${name}\")] | length")
            if [ "${count}" -gt 0 ]; then
              echo "Found ${name} after ${attempt} attempt(s)"
              exit 0
            fi
            echo "Waiting for ${name} (${attempt}/${max_attempts}, poll ${poll_sec}s, budget ${max_wait_sec}s)..."
            sleep "${poll_sec}"
          done
          echo "Timed out waiting for ${name} after ${max_wait_sec}s"
          exit 1

      - name: Download nightly test plan
        if: matrix.shard != 1
        uses: actions/download-artifact@v4
        with:
          name: twister-nightly-testplan
          path: ${{ github.workspace }}

      - name: Run Tests with Twister (Nightly)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -s testplan.json
          ccache --zero-stats
          CI_CONFIG_PROFILE=twister_nightly \
            "${{ github.workspace }}/${{ env.MANIFEST_PATH }}/scripts/ci/runci.sh" \
            -i \
            --load-tests testplan.json \
            --subset ${{ matrix.shard }}/${{ needs.twister-nightly-prep.outputs.shard_total }}
          ccache --show-stats

      - name: Upload twister results
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: twister-json-shard-${{ matrix.shard }}
          path: |
            ${{ github.workspace }}/twister-out/twister.json
            ${{ github.workspace }}/twister-out.*/twister.json
          if-no-files-found: ignore

      - name: Save workspace ccache
        if: always() && !cancelled() && matrix.shard == 1
        uses: ./.github/actions/save-workspace-ccache
        with:
          cache-primary-key: ${{ steps.workspace.outputs.ccache-primary-key }}
          save: true

  twister-summary-publish:
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.twister-nightly.result != 'cancelled' &&
      needs.twister-nightly.result != 'skipped'
    needs: [twister-nightly-prep, twister-nightly]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Download twister shard results
        uses: actions/download-artifact@v4
        with:
          pattern: twister-json-shard-*
          path: ${{ runner.temp }}/twister-shards

      - name: Summarize twister results
        id: summarize
        shell: bash
        run: |
          set -euo pipefail
          # Sort so twister-out.N retry backups precede the final twister-out
          # ('.' < '/'): the summarizer merges last-wins per (suite, platform).
          mapfile -t inputs < <(find "${RUNNER_TEMP}/twister-shards" -name twister.json | sort)
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "No twister.json artifacts found; skipping summary"
            echo "has_summary=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/ci/twister-summarize.py \
            --output "${RUNNER_TEMP}/twister-summary.json" \
            --commit "$(git rev-parse HEAD)" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --profile twister_nightly \
            --shards-expected "${{ needs.twister-nightly-prep.outputs.shard_total }}" \
            "${inputs[@]}"
          echo "has_summary=true" >> "$GITHUB_OUTPUT"

      - name: Check for twister summary changes
        id: changes
        if: steps.summarize.outputs.has_summary == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dest=doc/metrics/twister-summary.json
          # Ignore provenance-only churn (timestamp/run URL/commit) so an
          # unchanged result set does not open a no-op PR.
          norm() {
            jq -S 'del(.provenance.created_at, .provenance.workflow_run_url,
                       .provenance.commit, .provenance.commit_short)' "$1"
          }
          if [ -f "$dest" ] && diff <(norm "$dest") <(norm "${RUNNER_TEMP}/twister-summary.json") >/dev/null; then
            echo "summary_changed=false" >> "$GITHUB_OUTPUT"
            echo "Twister summary unchanged; skipping publish PR"
            exit 0
          fi
          echo "summary_changed=true" >> "$GITHUB_OUTPUT"
          cp "${RUNNER_TEMP}/twister-summary.json" "$dest"

      - name: Create or update twister summary PR
        if: steps.changes.outputs.summary_changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/twister-summary
          sign-commits: true
          add-paths: |
            doc/metrics/twister-summary.json
          title: "doc: refresh nightly twister summary"
          commit-message: "doc: refresh nightly twister summary"
          body: |
            Update the committed twister results summary from the Twister
            workflow (GitHub Actions run ${{ github.run_id }}).

            This snapshot drives the POSIX Option Group badges in the docs.
          labels: |
            automation
            twister

  twister-nightly-status:
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [twister-nightly-prep, twister-nightly]
    runs-on: ubuntu-24.04
    steps:
      - name: Check nightly shards
        run: |
          if [ "${{ needs.twister-nightly.result }}" != "success" ]; then
            echo "One or more twister nightly shards failed"
            exit 1
          fi
          echo "All ${{ needs.twister-nightly-prep.outputs.shard_total }} twister nightly shards passed"
