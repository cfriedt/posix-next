  - path: zephyr/sys-timepoint-user-callable.patch
    sha256sum: c642e94661f176dc8af0820040ba3d30a6fe7367c0f2c72bbf6a8a71a0878eaa
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-04-25
    upstreamable: true
    comments: |
      Make the timepoint API safe to call from user mode.
      sys_timepoint_calc() and sys_timepoint_timeout() are executed in
      the caller's context (the POSIX layer computes deadlines for
      sem_timedwait() and friends from user threads), but their bodies
      in kernel/timeout.c read the tick counter under timeout_lock,
      faulting any user-mode caller. Turn the helpers into static
      inlines in their own header, <zephyr/sys/clock.h>, reading ticks
      through a new sys_clock_ticks() system call implemented over
      sys_clock_tick_get(): the arithmetic then compiles in the
      caller's domain, so kernel callers keep the direct tick read and
      user-compiled callers trap for the tick only. This replaces an
      earlier approach that compiled timeout.c a second time without
      __ZEPHYR_SUPERVISOR__, which produced duplicate definitions under
      LLEXT's whole-archive kernel linking.
  - path: zephyr/arm-mpu-priv-stack-wrn.patch
    sha256sum: 85e57fd18fe54a442f5eb54976a8d8140c164aaa52919f569e9294d346ee22c7
    module: zephyr
    author: Chris Friedt
    email: chris@fr4.co
    date: 2026-05-04
    upstreamable: true
    comments: |
      No other zephyr architectures assert on assumptions about where userspace thread
      stacks lie in memory. While it's true that statically allocated thread stacks are
      in specific regions, dynamically allocated stacks could be anywhere. Older ARM MPUs
      have fairly stringent requirements on power-of-two size and alignment of MPU regions,
      so the concern is warranted, but downgrade it to a LOG_WRN_ONCE() so that zephyr code
      that is hardware agnostic can still be coherent with other architectures.
